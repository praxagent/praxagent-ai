<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430"
     viewBox="0 0 760 430" role="img"
     aria-labelledby="rmsDirectionTitle rmsDirectionDesc">
  <title id="rmsDirectionTitle">RMS keeps the same scale when direction reverses</title>
  <desc id="rmsDirectionDesc">Conceptual toy calculation. The vector h has coordinates 3, 4, 0, 0, while negative h has coordinates negative 3, negative 4, 0, 0 and points in the opposite direction. Squaring either vector produces 9, 16, 0, 0. The coordinate mean is 6.25 and its square root is 2.5, so both vectors have the same root mean square scale despite their opposite directions.</desc>
  <defs>
    <marker id="rmsFlowArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A67C52"/>
    </marker>
    <marker id="rmsBlueArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4B6787"/>
    </marker>
    <marker id="rmsClayArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A67C52"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:15px;font-weight:700}
      .h{font-size:13px;font-weight:700}
      .s{font-size:12px}
      .m{font-size:11px;fill:#5A544C}
      .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
      .blue{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
      .clay{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
      .green{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
      .guide{fill:none;stroke:#A89B8C;stroke-width:1.2;stroke-dasharray:5 4}
      .flow{fill:none;stroke:#A67C52;stroke-width:1.7;marker-end:url(#rmsFlowArrow)}
    </style>
  </defs>

  <rect width="760" height="430" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Same RMS scale, opposite vector directions</text>
  <text x="24" y="48" class="t m">Toy vectors point opposite ways, then collapse to the same squared coordinates.</text>

  <rect x="24" y="70" width="210" height="270" rx="12" class="neutral"/>
  <text x="129" y="94" text-anchor="middle" class="t h">OPPOSITE DIRECTIONS</text>
  <text x="129" y="112" text-anchor="middle" class="t m">first two coordinates shown</text>

  <line x1="58" y1="175" x2="200" y2="175" class="guide"/>
  <line x1="129" y1="120" x2="129" y2="230" class="guide"/>
  <line x1="129" y1="175" x2="171" y2="119" stroke="#4B6787" stroke-width="3"
        marker-end="url(#rmsBlueArrow)"/>
  <line x1="129" y1="175" x2="87" y2="231" stroke="#A67C52" stroke-width="3"
        marker-end="url(#rmsClayArrow)"/>
  <circle cx="129" cy="175" r="4" fill="#2C2924"/>
  <text x="179" y="120" class="t h" fill="#4B6787">h</text>
  <text x="67" y="240" class="t h" fill="#795431">-h</text>

  <rect x="40" y="256" width="178" height="32" rx="8" class="blue"/>
  <text x="129" y="277" text-anchor="middle" class="t s">h = (3, 4, 0, 0)</text>
  <rect x="40" y="297" width="178" height="32" rx="8" class="clay"/>
  <text x="129" y="318" text-anchor="middle" class="t s">-h = (-3, -4, 0, 0)</text>

  <path class="flow" d="M234 153 H258"/>
  <path class="flow" d="M234 257 H258"/>

  <rect x="262" y="92" width="218" height="226" rx="12" class="neutral"/>
  <text x="371" y="118" text-anchor="middle" class="t h">SQUARE EACH COORDINATE</text>
  <rect x="282" y="139" width="178" height="58" rx="10" class="blue"/>
  <text x="371" y="161" text-anchor="middle" class="t m">h squared</text>
  <text x="371" y="184" text-anchor="middle" class="t h">(9, 16, 0, 0)</text>
  <rect x="282" y="215" width="178" height="58" rx="10" class="clay"/>
  <text x="371" y="237" text-anchor="middle" class="t m">-h squared</text>
  <text x="371" y="260" text-anchor="middle" class="t h">(9, 16, 0, 0)</text>
  <text x="371" y="297" text-anchor="middle" class="t m">The signs differ; the squares match.</text>

  <path class="flow" d="M480 168 C494 168 494 180 508 180"/>
  <path class="flow" d="M480 244 C494 244 494 220 508 220"/>

  <rect x="512" y="150" width="92" height="100" rx="12" class="neutral"/>
  <text x="558" y="177" text-anchor="middle" class="t h">MEAN</text>
  <text x="558" y="207" text-anchor="middle" class="t title">6.25</text>
  <text x="558" y="230" text-anchor="middle" class="t m">for both</text>

  <path class="flow" d="M604 200 H624"/>

  <rect x="628" y="150" width="108" height="100" rx="12" class="green"/>
  <text x="682" y="177" text-anchor="middle" class="t h">SQUARE ROOT</text>
  <text x="682" y="207" text-anchor="middle" class="t title">RMS = 2.5</text>
  <text x="682" y="230" text-anchor="middle" class="t m">for both</text>

  <rect x="24" y="365" width="712" height="42" rx="10" class="green"/>
  <text x="380" y="391" text-anchor="middle" class="t s">Same scale: RMS 2.5. Opposite direction: h points exactly against -h.</text>
</svg>
