<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560"
     viewBox="0 0 780 560" role="img"
     aria-labelledby="fpBitsTitle fpBitsDesc">
  <title id="fpBitsTitle">Bit layouts of FP16, BF16, and FP32</title>
  <desc id="fpBitsDesc">Three floating-point formats drawn left-aligned from the sign bit. FP16 uses 1 sign bit, 5 exponent bits, and 10 mantissa bits. BF16 uses 1 sign bit, 8 exponent bits, and 7 mantissa bits. FP32 uses 1 sign bit, 8 exponent bits, and 23 mantissa bits. BF16 matches FP32 exponent width and truncates the mantissa, so it keeps a similar dynamic range with less precision. A dashed vertical guide marks where the 16-bit BF16 word ends inside the longer FP32 layout.</desc>
  <rect width="780" height="560" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:11px}
    .m{font-size:11px;fill:#5A544C}
    .tiny{font-size:9px;fill:#5A544C}
    .field{font-size:10px;font-weight:700}
    .signFill{fill:#4B6787}
    .expFill{fill:#6F8D5E}
    .mantFill{fill:#A67C52}
  </style>

