<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="lensTransportsTitle lensTransportsDesc">
  <title id="lensTransportsTitle">Three transports with one shared vocabulary readout</title>
  <desc id="lensTransportsDesc">The same selected middle-layer state branches through identity, a corpus-derived Jacobian, or a named Random-J. All lanes then share final normalization, the output head, the probe, the search rule, and the rank statistic.</desc>
  <defs>
    <marker id="lensTransportsArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A67C52"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:15px;font-weight:700}
      .h{font-size:13px;font-weight:700}
      .s{font-size:12px}
      .m{font-size:11px;fill:#5A544C}
      .source{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
      .identity{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
      .fitted{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
      .random{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.7;stroke-dasharray:5 4}
      .shared{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.6}
      .test{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.6}
      .flow{fill:none;stroke:#A67C52;stroke-width:1.8;marker-end:url(#lensTransportsArrow)}
      .footer{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    </style>
  </defs>

  <rect width="760" height="440" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Three transports, one shared vocabulary readout</text>
  <text x="24" y="48" class="t m">Hold the state and evaluation fixed so the comparison changes only the transport.</text>

  <rect x="24" y="152" width="132" height="104" rx="12" class="source"/>
  <text x="90" y="181" text-anchor="middle" class="t h">SELECTED STATE</text>
  <text x="90" y="207" text-anchor="middle" class="t s">same layer</text>
  <text x="90" y="228" text-anchor="middle" class="t s">same position</text>
  <text x="90" y="246" text-anchor="middle" class="t m">same input to each lane</text>

  <path class="flow" d="M156 204 C176 204 174 111 196 111"/>
  <path class="flow" d="M156 204 H196"/>
  <path class="flow" d="M156 204 C176 204 174 297 196 297"/>

  <rect x="196" y="76" width="218" height="70" rx="11" class="identity"/>
  <text x="305" y="102" text-anchor="middle" class="t h">LOGIT LENS</text>
  <text x="305" y="124" text-anchor="middle" class="t s">identity transport</text>
  <text x="305" y="140" text-anchor="middle" class="t m">no fitted map</text>

  <rect x="196" y="169" width="218" height="70" rx="11" class="fitted"/>
  <text x="305" y="195" text-anchor="middle" class="t h">JACOBIAN LENS</text>
  <text x="305" y="217" text-anchor="middle" class="t s">corpus-derived transport</text>
  <text x="305" y="233" text-anchor="middle" class="t m">averaged downstream derivatives</text>

  <rect x="196" y="262" width="218" height="70" rx="11" class="random"/>
  <text x="305" y="288" text-anchor="middle" class="t h">RANDOM-J CONTROL</text>
  <text x="305" y="310" text-anchor="middle" class="t s">named random transport</text>
  <text x="305" y="326" text-anchor="middle" class="t m">preserved properties stated</text>

  <path class="flow" d="M414 111 C437 111 435 204 458 204"/>
  <path class="flow" d="M414 204 H458"/>
  <path class="flow" d="M414 297 C437 297 435 204 458 204"/>

  <rect x="458" y="145" width="132" height="118" rx="12" class="shared"/>
  <text x="524" y="172" text-anchor="middle" class="t h">HELD FIXED</text>
  <text x="524" y="199" text-anchor="middle" class="t s">final normalization</text>
  <text x="524" y="222" text-anchor="middle" class="t s">output head</text>
  <text x="524" y="246" text-anchor="middle" class="t m">vocabulary scores</text>

  <path class="flow" d="M590 204 H616"/>
  <rect x="616" y="145" width="120" height="118" rx="12" class="test"/>
  <text x="676" y="172" text-anchor="middle" class="t h">SAME TEST</text>
  <text x="676" y="198" text-anchor="middle" class="t s">probe tokens</text>
  <text x="676" y="220" text-anchor="middle" class="t s">search rule</text>
  <text x="676" y="242" text-anchor="middle" class="t s">rank statistic</text>

  <rect x="24" y="365" width="712" height="50" rx="10" class="footer"/>
  <text x="380" y="395" text-anchor="middle" class="t s">Only the transport changes; any advantage is relative to the named identity and Random-J controls.</text>
</svg>
