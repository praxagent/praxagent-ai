<style>
/* Scoped to this visual companion; other research notes retain their layout. */
.post-content:has(.feedback-feature) {max-width: 72rem;}
.post-content:has(.feedback-feature) .post-header,.post-content:has(.feedback-feature) .post-lead,.post-content:has(.feedback-feature) .post-footer {max-width: 48rem;margin-left:auto;margin-right:auto;}
.post-content:has(.feedback-feature) .post-title {font-size:clamp(2.35rem,5.3vw,4.2rem);line-height:1.08;letter-spacing:-.035em;max-width:16ch;}
.post-content:has(.feedback-feature) .post-lead {font-size:1.22rem;line-height:1.65;}
.post-content:has(.feedback-feature) .post-body > .panel {max-width:48rem;margin-left:auto;margin-right:auto;}
.post-body > .feedback-feature {max-width:none;}
.feedback-feature > p:has(.research-figure) {max-width:none;}
.feedback-feature {--feature-accent:#5934a4;--feature-ink:#21213d;}
.feedback-feature > p,.feedback-feature > ol,.feedback-feature > h2,.feedback-feature > h3,.feedback-feature > .feature-next {max-width:46rem;margin-left:auto;margin-right:auto;}
.feedback-feature > p,.feedback-feature > ol {font-size:1.13rem;line-height:1.8;}
.feedback-feature > ol {box-sizing:border-box;padding-left:1.5rem;}
.feedback-feature > ol > li {margin-bottom:.8rem;}
.feedback-feature > h2 {margin-top:4rem;margin-bottom:1.2rem;font-size:clamp(1.8rem,3.2vw,2.55rem);line-height:1.17;letter-spacing:-.025em;border-top:1px solid #cec9dc;padding-top:1.4rem;}
.feedback-feature > h3 {font-size:1.45rem;margin-top:2rem;}
.feedback-feature .feature-kicker {font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--feature-accent);margin-top:2.8rem;}
.feedback-feature .research-figure,.feedback-feature .feedback-film {max-width:100%;width:100%;margin:2rem auto 1rem;}
.feedback-feature .research-figure img {display:block;width:100%;height:auto;max-height:none;object-fit:contain;border:1px solid #e0dce7;border-radius:6px;background:#fff;}
.feedback-feature .research-figure:has(img[src*="feedback-loop"]) {max-width:42rem;}
.feedback-feature .research-figure:has(img[src*="fig-passages"]),.feedback-feature .research-figure:has(img[src*="batching-comparison"]) {max-width:49rem;}
.feedback-feature .research-figure:has(img[src*="fig-cross512"]) {max-width:46rem;}
.feedback-feature .research-figure__credit {font-size:.78rem;line-height:1.5;}
.feedback-feature .feedback-film img {display:block;width:100%;height:auto;border-radius:8px;}
.feedback-feature .feedback-film--youtube {aspect-ratio:16/9;max-width:49rem;background:#111124;overflow:hidden;border-radius:8px;}
.feedback-feature .feedback-film iframe {width:100%;height:100%;border:0;}
.feedback-feature .feedback-film:has(img[src*="islands"]) {max-width:49rem;}
.feedback-feature p.feature-caption {max-width:49rem;font-size:.92rem;line-height:1.65;color:#54516a;border-left:3px solid #a78bcf;padding-left:1.2rem;margin-top:1rem;}
.feedback-feature .feature-caption strong {color:var(--feature-ink);}
.feedback-feature .feature-next {background:#f0edf7;border-radius:10px;padding:1.5rem 2rem;margin-top:3rem;box-sizing:border-box;}
.feedback-feature .feature-next .feature-kicker {margin-top:0;}
.feedback-feature .feature-next p {font-size:1rem;line-height:1.7;}
.feedback-feature .feature-next p:nth-child(2) {font-size:1.4rem;font-weight:700;}
@media(max-width:600px){.feedback-feature > p{font-size:1.05rem;line-height:1.75}.feedback-feature > h2{margin-top:2.8rem}.feedback-feature p.feature-caption{font-size:.87rem;padding-left:.8rem}.feedback-feature .feature-next{padding:1.2rem}.post-content:has(.feedback-feature) .post-title{font-size:2.5rem}.feedback-feature .research-figure{overflow-x:auto}}
[data-theme="dark"] .feedback-feature {--feature-accent:#d7c8f4;--feature-ink:#fff2e3;}
[data-theme="dark"] .feedback-feature p.feature-caption {color:#e0dce8;}
[data-theme="dark"] .feedback-feature .feature-next {background:#26374c;}
.feedback-article .feedback-opening {display:grid;grid-template-columns:1.1fr 1fr;gap:3rem;align-items:center;margin-bottom:3rem;}
.feedback-article .feedback-opening .post-title {font-size:clamp(2.5rem,4.5vw,3.8rem);max-width:16ch;margin:.6rem 0 1.3rem;}
.feedback-article .feedback-eyebrow {color:var(--text-secondary);font:600 .8rem/1.4 var(--font-mono,monospace);text-transform:uppercase;letter-spacing:.12em;}
.feedback-article .feedback-opening .post-meta {font-size:.8rem;margin-bottom:1.4rem;gap:.5rem;}
.feedback-article .feedback-opening .post-lead {font-size:1.05rem;line-height:1.7;margin:0;padding:0;}
.feedback-article .feedback-opening .post-lead p {margin:0 0 1rem;}
.feedback-article .feedback-opening-art {margin:0;}
.feedback-article .feedback-opening-art img {width:100%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:10px;display:block;}
.feedback-article .feedback-opening-art figcaption {font-size:.75rem;line-height:1.4;margin-top:.7rem;color:var(--text-secondary);}
.feedback-article .feedback-opening a {color:#3a526f;text-underline-offset:.18em;}
[data-theme="dark"] .feedback-article .feedback-opening a {color:#e6f1fa;}
.feedback-article .feedback-start {display:inline-block;font-size:.9rem;font-weight:600;margin-top:.5rem;}
@media(max-width:760px){.feedback-article .feedback-opening{grid-template-columns:1fr;gap:1.2rem}.feedback-article .feedback-opening .post-title{font-size:2.5rem;max-width:none}.feedback-article .feedback-opening-art{max-width:28rem;justify-self:center}.feedback-article .feedback-opening .post-lead{font-size:1rem}.feedback-article .feedback-opening-copy{order:0}.feedback-article .feedback-opening-art{order:1}}
</style>
<div class="feedback-feature">
{{ .Page.RenderString (dict "display" "block") .Inner }}
</div>
