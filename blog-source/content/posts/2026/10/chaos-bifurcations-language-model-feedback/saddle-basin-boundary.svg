<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="titleSaddle descSaddle">
  <title id="titleSaddle">A saddle orbit's stable manifold divides two basins (schematic, not data)</title>
  <desc id="descSaddle">Schematic, not data, and not to scale: a two-dimensional slice of the state space around one point of each of three period-6 orbits. A curve from the top to the bottom of the slice passes through a saddle point; it is the saddle's stable manifold, and arrows on it point toward the saddle. It divides the slice into the basin of the attracting orbit S on the left, shaded blue, and the basin of the attracting orbit W on the right, shaded tan. The saddle's unstable manifold leaves the saddle to the left, ending at S, and to the right, ending at W. Two starts a tiny distance apart, one on each side of the stable manifold, first move down along it toward the saddle, linger near it, and then leave along the unstable manifold, one to S and one to W. Labels say that the saddle has one repelling direction and attracts along every other, that the closer a start lies to the manifold the longer it lingers, and that on the way out the distance from the saddle grows by the unstable multiplier on every lap of six steps.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <defs>
    <marker id="arrUnst" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5A544C"/>
    </marker>
    <marker id="arrStab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2C2924"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .basinS{fill:#E8F0F7}
    .basinW{fill:#F3E8E0}
    .frame{fill:none;stroke:#C4B8A8;stroke-width:1.2}
    .stable{fill:none;stroke:#2C2924;stroke-width:2.2}
    .unstable{fill:none;stroke:#5A544C;stroke-width:1.8}
    .trS{fill:none;stroke:#36506B;stroke-width:1;stroke-dasharray:2 3}
    .trW{fill:none;stroke:#7A5634;stroke-width:1;stroke-dasharray:2 3}
    .dotS{fill:#36506B}
    .dotW{fill:#7A5634}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
  </style>

  <text x="24" y="28" class="t title">A saddle orbit's stable manifold divides two basins</text>
  <text x="24" y="48" class="t m">Schematic, not data, not to scale: a two-dimensional slice of the state space around one point of each period-6 orbit.</text>

  <!-- the two basins, separated by the stable manifold -->
  <path class="basinS" d="M24,64 L392,64 C380,130 376,180 375,212 C374,244 368,300 360,352 L24,352 Z"/>
  <path class="basinW" d="M392,64 L736,64 L736,352 L360,352 C368,300 374,244 375,212 C376,180 380,130 392,64 Z"/>
  <rect class="frame" x="24" y="64" width="712" height="288" rx="4"/>
  <text x="40" y="88" class="t h" style="fill:#36506B">basin of S</text>
  <text x="720" y="88" text-anchor="end" class="t h" style="fill:#7A5634">basin of W</text>

  <!-- stable manifold, with arrows toward the saddle -->
  <path class="stable" d="M392,64 C380,130 376,180 375,212 C374,244 368,300 360,352"/>
  <line x1="369.2" y1="300" x2="370.6" y2="288" stroke="#2C2924" stroke-width="2.2" marker-end="url(#arrStab)"/>
  <text x="364" y="132" text-anchor="end" class="t s">stable manifold of the saddle:</text>
  <text x="364" y="147" text-anchor="end" class="t s">the boundary between the basins</text>

  <!-- unstable manifold, leaving the saddle toward S and toward W -->
  <path class="unstable" d="M369,212 C320,214 250,236 196,250 C164,258 146,261 132,262" marker-end="url(#arrUnst)"/>
  <path class="unstable" d="M381,212 C430,210 520,190 616,172" marker-end="url(#arrUnst)"/>
  <text x="232" y="262" class="t m">unstable manifold</text>
  <text x="470" y="176" class="t m">unstable manifold</text>

  <!-- attractors and saddle -->
  <circle cx="120" cy="263" r="8" fill="#4B6787"/>
  <text x="44" y="290" class="t s">S: the strongly contracting orbit</text>
  <circle cx="628" cy="170" r="8" fill="#A67C52"/>
  <text x="720" y="200" text-anchor="end" class="t s">W: the other attracting orbit</text>
  <circle cx="375" cy="212" r="6" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.8"/>

  <!-- two starts, one on each side of the stable manifold -->
  <polyline class="trS" points="381,88 379,118 378,146 377,168 376,184 373,196 368,204 363,208 356,211 344,213 324,217 296,225 262,234 226,243 190,252 160,258"/>
  <polyline class="trW" points="395,88 389,118 385,146 382,168 380,184 380,196 383,203 388,207 395,207 408,206 430,202 462,197 500,190 540,183 580,177"/>
  <g class="dotS">
    <circle cx="381" cy="88" r="3.4"/>
    <circle cx="379" cy="118" r="2.4"/><circle cx="378" cy="146" r="2.4"/><circle cx="377" cy="168" r="2.4"/>
    <circle cx="376" cy="184" r="2.4"/><circle cx="373" cy="196" r="2.4"/><circle cx="368" cy="204" r="2.4"/>
    <circle cx="363" cy="208" r="2.4"/><circle cx="356" cy="211" r="2.4"/><circle cx="344" cy="213" r="2.4"/>
    <circle cx="324" cy="217" r="2.4"/><circle cx="296" cy="225" r="2.4"/><circle cx="262" cy="234" r="2.4"/>
    <circle cx="226" cy="243" r="2.4"/><circle cx="190" cy="252" r="2.4"/><circle cx="160" cy="258" r="2.4"/>
  </g>
  <g class="dotW">
    <circle cx="395" cy="88" r="3.4"/>
    <circle cx="389" cy="118" r="2.4"/><circle cx="385" cy="146" r="2.4"/><circle cx="382" cy="168" r="2.4"/>
    <circle cx="380" cy="184" r="2.4"/><circle cx="380" cy="196" r="2.4"/><circle cx="383" cy="203" r="2.4"/>
    <circle cx="388" cy="207" r="2.4"/><circle cx="395" cy="207" r="2.4"/><circle cx="408" cy="206" r="2.4"/>
    <circle cx="430" cy="202" r="2.4"/><circle cx="462" cy="197" r="2.4"/><circle cx="500" cy="190" r="2.4"/>
    <circle cx="540" cy="183" r="2.4"/><circle cx="580" cy="177" r="2.4"/>
  </g>
  <text x="408" y="86" class="t s">two starts a tiny distance apart,</text>
  <text x="408" y="101" class="t s">one on each side of the manifold</text>

  <!-- what happens near the saddle -->
  <text x="392" y="236" class="t m">saddle orbit: one repelling direction,</text>
  <text x="392" y="250" class="t m">every other direction attracting</text>
  <text x="392" y="274" class="t m">both starts come close and linger;</text>
  <text x="392" y="288" class="t m">the closer to the manifold, the longer</text>
  <text x="44" y="318" class="t m">on the way out, the distance from the saddle grows</text>
  <text x="44" y="332" class="t m">by the unstable multiplier on every lap of six steps</text>

  <!-- footer takeaway -->
  <rect class="foot" x="24" y="370" width="712" height="40" rx="10"/>
  <text x="380" y="395" text-anchor="middle" class="t s">The side of the stable manifold decides the attractor; starts close to it linger at the saddle first.</text>
</svg>
