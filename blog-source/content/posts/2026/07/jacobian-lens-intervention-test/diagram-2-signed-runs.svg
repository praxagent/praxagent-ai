<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="d2title">
  <title id="d2title">Three deterministic forward passes per prompt: a clean run with no edit, a run with the scaled direction added at block 50, and a run with it subtracted. Their final hidden states combine into the signed response, which keeps what flips with the edit's sign, and the common mode, which keeps what does not.</title>
  <rect width="960" height="480" fill="#ffffff"/>
  <defs>
    <marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/></marker>
    <marker id="s-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B9E77"/></marker>
    <marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7570B3"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#17324D">One measurement = three forward passes of the same network</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#66717E">same prompt &#183; same weights &#183; same token position &#183; nothing is generated, so no temperature exists</text>

  <!-- block ticks -->
  <g stroke="#E8EDF2" stroke-width="1.4">
    <line x1="210" y1="86" x2="210" y2="330"/>
    <line x1="400" y1="86" x2="400" y2="330"/>
    <line x1="640" y1="86" x2="640" y2="330"/>
  </g>
  <text x="210" y="78" text-anchor="middle" font-size="11.5" fill="#7B8794">block 0</text>
  <text x="400" y="78" text-anchor="middle" font-size="11.5" fill="#7B8794">block 50</text>
  <text x="640" y="78" text-anchor="middle" font-size="11.5" fill="#7B8794">block 79</text>

  <!-- clean lane -->
  <text x="160" y="125" text-anchor="end" font-size="13" font-weight="bold" fill="#66717E">clean run</text>
  <line x1="176" y1="120" x2="668" y2="120" stroke="#9AA6B2" stroke-width="2.5" marker-end="url(#s-gray)"/>
  <text x="400" y="110" text-anchor="middle" font-size="11.5" fill="#7B8794">no edit</text>
  <text x="688" y="125" font-size="13.5" font-style="italic" fill="#66717E">h clean</text>

  <!-- +b lane -->
  <text x="160" y="215" text-anchor="end" font-size="13" font-weight="bold" fill="#1B9E77">+b run</text>
  <line x1="176" y1="210" x2="668" y2="210" stroke="#1B9E77" stroke-width="2.5" marker-end="url(#s-teal)"/>
  <circle cx="400" cy="210" r="12" fill="#ffffff" stroke="#1B9E77" stroke-width="2"/>
  <text x="400" y="215.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B9E77">+</text>
  <text x="400" y="190" text-anchor="middle" font-size="11.5" fill="#1B9E77">b&#183;v added to the residual here</text>
  <text x="688" y="215" font-size="13.5" font-style="italic" fill="#1B9E77">h+</text>

  <!-- -b lane -->
  <text x="160" y="305" text-anchor="end" font-size="13" font-weight="bold" fill="#7570B3">&#8722;b run</text>
  <line x1="176" y1="300" x2="668" y2="300" stroke="#7570B3" stroke-width="2.5" marker-end="url(#s-purple)"/>
  <circle cx="400" cy="300" r="12" fill="#ffffff" stroke="#7570B3" stroke-width="2"/>
  <text x="400" y="305.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#7570B3">&#8722;</text>
  <text x="400" y="329" text-anchor="middle" font-size="11.5" fill="#7570B3">b&#183;v subtracted from the residual here</text>
  <text x="688" y="305" font-size="13.5" font-style="italic" fill="#7570B3">h&#8722;</text>

  <!-- readout note -->
  <text x="770" y="212" text-anchor="start" font-size="11.5" fill="#7B8794">hidden states read</text>
  <text x="770" y="228" text-anchor="start" font-size="11.5" fill="#7B8794">after every block</text>

  <!-- combination equations -->
  <line x1="80" y1="356" x2="880" y2="356" stroke="#E8EDF2" stroke-width="1.4"/>

  <text x="480" y="388" text-anchor="middle" font-size="14">
    <tspan font-weight="bold" fill="#17324D">signed response</tspan>
    <tspan fill="#66717E">&#160;=&#160;(&#8202;</tspan><tspan font-style="italic" fill="#1B9E77">h+</tspan><tspan fill="#66717E">&#160;&#8722;&#160;</tspan><tspan font-style="italic" fill="#7570B3">h&#8722;</tspan><tspan fill="#66717E">&#8202;)&#160;/&#160;2</tspan>
  </text>
  <text x="480" y="408" text-anchor="middle" font-size="12" fill="#66717E">keeps only what flips when the edit&#8217;s sign flips: the edit&#8217;s effect</text>

  <text x="480" y="438" text-anchor="middle" font-size="14">
    <tspan font-weight="bold" fill="#7B8794">common mode</tspan>
    <tspan fill="#66717E">&#160;=&#160;(&#8202;</tspan><tspan font-style="italic" fill="#1B9E77">h+</tspan><tspan fill="#66717E">&#160;+&#160;</tspan><tspan font-style="italic" fill="#7570B3">h&#8722;</tspan><tspan fill="#66717E">&#8202;)&#160;/&#160;2&#160;&#8722;&#160;</tspan><tspan font-style="italic" fill="#66717E">h clean</tspan>
  </text>
  <text x="480" y="458" text-anchor="middle" font-size="12" fill="#66717E">keeps what appears either way: kept separately as a disturbance diagnostic</text>
</svg>
