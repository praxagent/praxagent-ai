<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="d3title">
  <title id="d3title">What the dose-linearity gates measure. Left: for the source edit, the per-unit-dose vectors at 2, 3, and 4 percent coincide, passing both gates. Right: for the actual final state, the per-unit-dose vectors rotate apart and change length, failing the cosine gate and the size gate.</title>
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="g-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B9E77"/></marker>
    <marker id="g-teal2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3aa88a"/></marker>
    <marker id="g-teal3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#63b8a1"/></marker>
    <marker id="g-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D95F02"/></marker>
    <marker id="g-orange2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0813a"/></marker>
    <marker id="g-orange3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a06c"/></marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#17324D">After dividing each response by its dose, do the arrows stay put?</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#66717E">q&#7495; = response &#247; dose, compared at 2%, 3%, 4% against the 3% anchor</text>

  <!-- left panel: pass -->
  <rect x="55" y="80" width="400" height="280" rx="10" fill="#FBFCFD" stroke="#DCE2E8" stroke-width="1.2"/>
  <text x="255" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B9E77">Source edit: dose-linear (24 / 24 pass)</text>

  <g transform="translate(150,300)">
    <line x1="0" y1="0" x2="196" y2="-138" stroke="#63b8a1" stroke-width="7" opacity="0.55" marker-end="url(#g-teal3)"/>
    <line x1="0" y1="0" x2="199" y2="-141" stroke="#3aa88a" stroke-width="4.5" opacity="0.8" marker-end="url(#g-teal2)"/>
    <line x1="0" y1="0" x2="202" y2="-144" stroke="#1B9E77" stroke-width="2.4" marker-end="url(#g-teal)"/>
    <circle cx="0" cy="0" r="4" fill="#17324D"/>
  </g>
  <text x="255" y="330" text-anchor="middle" font-size="12" fill="#66717E">the three per-unit-dose vectors coincide:</text>
  <text x="255" y="348" text-anchor="middle" font-size="12" fill="#66717E">same direction (c&#8202;&#8805;&#8202;0.95) &#183; same size (d&#8202;&#8804;&#8202;0.15)</text>

  <!-- right panel: fail -->
  <rect x="505" y="80" width="400" height="280" rx="10" fill="#FBFCFD" stroke="#DCE2E8" stroke-width="1.2"/>
  <text x="705" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#D95F02">Actual final state: bent (0 / 24 pass)</text>

  <g transform="translate(590,310)">
    <line x1="0" y1="0" x2="238" y2="-58" stroke="#e8a06c" stroke-width="2.4" marker-end="url(#g-orange3)"/>
    <line x1="0" y1="0" x2="182" y2="-122" stroke="#e0813a" stroke-width="2.4" marker-end="url(#g-orange2)"/>
    <line x1="0" y1="0" x2="96" y2="-160" stroke="#D95F02" stroke-width="2.4" marker-end="url(#g-orange)"/>
    <circle cx="0" cy="0" r="4" fill="#17324D"/>
    <path d="M 60 -14 A 62 62 0 0 0 32 -53" fill="none" stroke="#7B8794" stroke-width="1.3" stroke-dasharray="3 3"/>
  </g>
  <text x="852" y="240" text-anchor="middle" font-size="11.5" fill="#D95F02">2%</text>
  <text x="790" y="180" text-anchor="middle" font-size="11.5" fill="#e0813a">3%</text>
  <text x="678" y="142" text-anchor="middle" font-size="11.5" fill="#e8a06c">4%</text>
  <text x="705" y="330" text-anchor="middle" font-size="12" fill="#66717E">the vectors rotate apart and change length:</text>
  <text x="705" y="348" text-anchor="middle" font-size="12" fill="#66717E">c fell to 0.778&#8211;0.848 &#183; d rose to 0.572&#8211;0.703</text>

  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#7B8794">Cosine catches rotation; dose-normalized RMS discrepancy catches size and shape drift. One gate per failure mode.</text>
</svg>
