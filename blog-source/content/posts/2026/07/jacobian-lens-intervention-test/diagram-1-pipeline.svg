<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="d1title">
  <title id="d1title">Pipeline of the experiment: a requested float32 edit is cast to BF16 to become the realized edit; the realized edit is transported two ways, through the fixed corpus-average Jacobian and through the model's remaining 29 blocks; the resulting quantities are scored by frozen dose-linearity gates, and the Jacobian prediction is separately compared against identity and random-map baselines.</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="p-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
    <marker id="p-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#17324D">One edit, four quantities, two questions</text>

  <!-- requested edit -->
  <rect x="40" y="120" width="180" height="86" rx="9" fill="#E8EDF2" stroke="#17324D" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#17324D">Requested edit</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#66717E">built in float32</text>
  <text x="130" y="188" text-anchor="middle" font-size="12" fill="#66717E">dose b &#183; direction v</text>

  <!-- cast arrow -->
  <line x1="222" y1="163" x2="298" y2="163" stroke="#17324D" stroke-width="2" marker-end="url(#p-navy)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11.5" fill="#66717E">BF16 cast</text>

  <!-- realized edit -->
  <rect x="302" y="120" width="190" height="86" rx="9" fill="#E8EDF2" stroke="#17324D" stroke-width="1.5"/>
  <text x="397" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#17324D">Realized edit</text>
  <text x="397" y="170" text-anchor="middle" font-size="12" fill="#66717E">what actually landed</text>
  <text x="397" y="188" text-anchor="middle" font-size="12" fill="#66717E">after block 50</text>

  <!-- fidelity gate note, below requested/realized -->
  <rect x="70" y="252" width="330" height="62" rx="8" fill="#ffffff" stroke="#C89118" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="235" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#C89118">Fidelity gate (Fig. 2)</text>
  <text x="235" y="294" text-anchor="middle" font-size="11.5" fill="#66717E">requested vs realized: fails below 2% dose,</text>
  <text x="235" y="308" text-anchor="middle" font-size="11.5" fill="#66717E">passes from 2% through 30%</text>
  <line x1="260" y1="210" x2="248" y2="250" stroke="#C89118" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#p-gray)"/>

  <!-- transport pill: fixed J -->
  <line x1="494" y1="145" x2="540" y2="112" stroke="#17324D" stroke-width="2" marker-end="url(#p-navy)"/>
  <rect x="544" y="72" width="164" height="56" rx="28" fill="#FBFCFD" stroke="#7B8794" stroke-width="1.3"/>
  <text x="626" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#17324D">fixed corpus-average J</text>
  <text x="626" y="113" text-anchor="middle" font-size="11.5" fill="#66717E">one matrix multiply</text>
  <line x1="710" y1="100" x2="756" y2="100" stroke="#17324D" stroke-width="2" marker-end="url(#p-navy)"/>

  <!-- predicted wake -->
  <rect x="760" y="60" width="180" height="86" rx="9" fill="#F0F5EF" stroke="#1B9E77" stroke-width="1.6"/>
  <text x="850" y="90" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B9E77">Predicted wake</text>
  <text x="850" y="110" text-anchor="middle" font-size="12" fill="#66717E">J &#183; (realized edit)</text>
  <text x="850" y="128" text-anchor="middle" font-size="12" fill="#66717E">straight-line reference</text>

  <!-- transport pill: model blocks -->
  <line x1="494" y1="181" x2="540" y2="214" stroke="#17324D" stroke-width="2" marker-end="url(#p-navy)"/>
  <rect x="544" y="198" width="164" height="56" rx="28" fill="#FBFCFD" stroke="#7B8794" stroke-width="1.3"/>
  <text x="626" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#17324D">blocks 51&#8211;79</text>
  <text x="626" y="239" text-anchor="middle" font-size="11.5" fill="#66717E">the model itself, nonlinear</text>
  <line x1="710" y1="226" x2="756" y2="226" stroke="#17324D" stroke-width="2" marker-end="url(#p-navy)"/>

  <!-- actual wake -->
  <rect x="760" y="186" width="180" height="86" rx="9" fill="#FBF1E8" stroke="#D95F02" stroke-width="1.6"/>
  <text x="850" y="216" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#D95F02">Actual wake</text>
  <text x="850" y="236" text-anchor="middle" font-size="12" fill="#66717E">measured residual change</text>
  <text x="850" y="254" text-anchor="middle" font-size="12" fill="#66717E">after block 79</text>

  <!-- question 1 -->
  <rect x="40" y="420" width="430" height="100" rx="9" fill="#ffffff" stroke="#7B8794" stroke-width="1.4"/>
  <text x="255" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#17324D">Question 1: dose linearity (Fig. 1)</text>
  <text x="255" y="470" text-anchor="middle" font-size="11.5" fill="#66717E">frozen gates on the 2% / 3% / 4% panel:</text>
  <text x="255" y="490" text-anchor="middle" font-size="11.5" fill="#1B9E77">realized edit 24/24 pass &#183; fixed-J 24/24 pass</text>
  <text x="255" y="508" text-anchor="middle" font-size="11.5" fill="#D95F02">actual final 0/24 pass</text>

  <!-- question 2 -->
  <rect x="490" y="420" width="430" height="100" rx="9" fill="#ffffff" stroke="#7B8794" stroke-width="1.4"/>
  <text x="705" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#17324D">Question 2: predictive value (Fig. 4)</text>
  <text x="705" y="470" text-anchor="middle" font-size="11.5" fill="#66717E">predicted wake vs actual wake:</text>
  <text x="705" y="490" text-anchor="middle" font-size="11.5" fill="#1B9E77">J beats 5 random maps</text>
  <text x="705" y="508" text-anchor="middle" font-size="11.5" fill="#D95F02">but not the identity baseline at layer 50</text>

  <!-- minimal connectors to questions -->
  <line x1="397" y1="322" x2="330" y2="418" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p-gray)"/>
  <text x="330" y="368" text-anchor="start" font-size="10.5" fill="#9AA6B2">scored: realized, fixed-J, actual</text>
  <line x1="850" y1="274" x2="790" y2="418" stroke="#9AA6B2" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p-gray)"/>
  <text x="835" y="352" text-anchor="start" font-size="10.5" fill="#9AA6B2">compared</text>
</svg>
