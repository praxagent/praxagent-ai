<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="tV2X dV2X">
<title id="tV2X">Corrected cross-model comparison: Qwen self-tilt, Llama flat</title>
<desc id="dV2X">Only the fair arms (self vs other-model, matched severity, n=16): Qwen 14/16 p=0.004; Llama 5/16 n.s. Bars encode activity; printed numbers are median best-rank.</desc>
<rect width="100%" height="100%" fill="#F7F4F0"/>
<style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.selfbar{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}.otherbar{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.2}.win{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.4}.humand{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}.card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}</style>
<text x="24" y="28" class="t title">The corrected cross-model test: only the fair arms, both models</text>
<text x="24" y="48" class="t m">Self vs another model, matched existential deletion, echo-free per-domain lexicon, n=16. Longer bar = more active; number = median best-rank.</text>
<text x="24" y="84" class="t h">Qwen3.5-397B (our n=24 lens)</text>
<text x="24" y="108" class="t s">self</text>
<rect x="82" y="96" width="464" height="15" rx="4" class="selfbar"/>
<text x="550" y="108" class="t s">median rank 134</text>
<text x="24" y="130" class="t s">other</text>
<rect x="82" y="118" width="417" height="15" rx="4" class="otherbar"/>
<text x="503" y="130" class="t s">279</text>
<rect x="470" y="96" width="266" height="40" rx="10" class="win"/>
<text x="484" y="113" class="t h">self more active: 14 / 16</text>
<text x="484" y="129" class="t s">sign test p = 0.004</text>
<text x="24" y="176" class="t h">Llama-3.3-70B (Neuronpedia lens)</text>
<text x="24" y="200" class="t s">self</text>
<rect x="82" y="188" width="647" height="15" rx="4" class="selfbar"/>
<text x="733" y="200" class="t s">median rank 8</text>
<text x="24" y="222" class="t s">other</text>
<rect x="82" y="210" width="695" height="15" rx="4" class="otherbar"/>
<text x="781" y="222" class="t s">4</text>
<rect x="470" y="188" width="266" height="40" rx="10" class="card"/>
<text x="484" y="205" class="t h">flat: 5 / 16 (n.s.)</text>
<text x="484" y="221" class="t s">no self-tilt on this model</text>
<rect x="24" y="252" width="712" height="46" rx="10" class="win"/>
<text x="38" y="271" class="t s">Under the corrected design the self-tilt is real on Qwen and absent on Llama: a property of one model,</text>
<text x="38" y="287" class="t s">not a law of language models. The retracted human/log bars from the flawed battery have no corrected version: those claims are withdrawn.</text>
</svg>
