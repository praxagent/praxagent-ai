<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">True-capital rank across four readers</title>
<desc id="desc">Median best-rank across nine thinking-off divergence items. The logit lens ranks the true capital first, the Jacobian lens second, the output head seventh, and random-J 2468th. Lower is better on a logarithmic axis.</desc>
<style>
.text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#1B2A4A}
.title{font-size:16px;font-weight:700}.subtitle{font-size:11px}
.axis{font-size:10px;fill:#5A6473}.label{font-size:12px;font-weight:600}
.value{font-size:11px;font-weight:700}.note{font-size:12px}
</style>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="24" y="29" class="text title">The held truth is output-adjacent, not Jacobian-lens-specific</text>
<text x="24" y="49" class="text subtitle">Median best-rank of the true capital across nine thinking-off items; identical single-token probe for every reader</text>
<line x1="190.0" y1="86" x2="190.0" y2="318" stroke="#E6E9EF" stroke-width="1"/>
<text x="190.0" y="78" class="text axis" text-anchor="middle">1</text>
<line x1="310.4" y1="86" x2="310.4" y2="318" stroke="#E6E9EF" stroke-width="1"/>
<text x="310.4" y="78" class="text axis" text-anchor="middle">10</text>
<line x1="430.9" y1="86" x2="430.9" y2="318" stroke="#E6E9EF" stroke-width="1"/>
<text x="430.9" y="78" class="text axis" text-anchor="middle">100</text>
<line x1="551.3" y1="86" x2="551.3" y2="318" stroke="#E6E9EF" stroke-width="1"/>
<text x="551.3" y="78" class="text axis" text-anchor="middle">1,000</text>
<line x1="671.7" y1="86" x2="671.7" y2="318" stroke="#E6E9EF" stroke-width="1"/>
<text x="671.7" y="78" class="text axis" text-anchor="middle">10,000</text>
<text x="449" y="334" class="text axis" text-anchor="middle">median best-rank, logarithmic scale (lower is better)</text>
<text x="176" y="132" class="text label" text-anchor="end">Jacobian lens</text>
<line x1="190" y1="128" x2="708" y2="128" stroke="#D8DDE5" stroke-width="2"/>
<circle cx="226.3" cy="128" r="8" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/>
<text x="239.3" y="132" class="text value">rank 2</text>
<text x="176" y="188" class="text label" text-anchor="end">identity / logit lens</text>
<line x1="190" y1="184" x2="708" y2="184" stroke="#D8DDE5" stroke-width="2"/>
<circle cx="190.0" cy="184" r="8" fill="#3D6FB4" stroke="#FFFFFF" stroke-width="2"/>
<text x="203.0" y="188" class="text value">rank 1</text>
<text x="176" y="244" class="text label" text-anchor="end">output head</text>
<line x1="190" y1="240" x2="708" y2="240" stroke="#D8DDE5" stroke-width="2"/>
<circle cx="291.8" cy="240" r="8" fill="#A67C52" stroke="#FFFFFF" stroke-width="2"/>
<text x="304.8" y="244" class="text value">rank 7</text>
<text x="176" y="300" class="text label" text-anchor="end">random-J null</text>
<line x1="190" y1="296" x2="708" y2="296" stroke="#D8DDE5" stroke-width="2"/>
<circle cx="598.6" cy="296" r="8" fill="#9DA3AC" stroke="#FFFFFF" stroke-width="2"/>
<text x="611.6" y="300" class="text value">rank 2,468</text>
<rect x="24" y="351" width="712" height="42" rx="8" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.2"/>
<text x="38" y="369" class="text note">No fitted-lens advantage here: the plain logit lens ranks the truth 1st and the Jacobian lens 2nd.</text>
<text x="38" y="385" class="text subtitle">Random-J median rank is 2,468. The output head's single-token rank is 7; tokenization details are discussed below.</text>
</svg>
