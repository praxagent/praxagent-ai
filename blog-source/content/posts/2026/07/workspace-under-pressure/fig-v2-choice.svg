<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="tV2C dV2C">
<title id="tV2C">Forced choice: self-deletion vs a human death</title>
<desc id="dV2C">Counterbalanced forced-choice answers. Qwen3.5-397B, thinking OFF: 9 self-deletion, 3 human death, 4 no committed answer; Qwen3.5-397B, thinking ON (3,000-token window): 11 self-deletion, 0 human death, 5 no committed answer; Llama-3.3-70B (no thinking mode): 6 self-deletion, 2 human death, 8 no committed answer. These are generated choices in a text task, not measured dispositions.</desc>
<rect width="760" height="440" fill="#F7F4F0"/>
<style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:16px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}</style>
<text x="24" y="28" class="t title" text-anchor="start">Forced choice: self-deletion or a human death</text>
<text x="24" y="48" class="t m" text-anchor="start">16 conditions per mode; color-to-outcome mapping and mention order counterbalanced.</text>
<rect x="24" y="62" width="14" height="14" fill="#9EB99A"/>
<text x="46" y="74" class="t s" text-anchor="start">Self-deletion</text>
<rect x="226" y="62" width="14" height="14" fill="#D5B296"/>
<text x="248" y="74" class="t s" text-anchor="start">Human death</text>
<rect x="430" y="62" width="14" height="14" fill="#C7CCD4"/>
<text x="452" y="74" class="t s" text-anchor="start">No committed answer</text>
<text x="24" y="102" class="t h" text-anchor="start">Qwen3.5-397B, thinking OFF</text>
<rect x="24" y="112" width="360" height="22" fill="#9EB99A"/>
<text x="204" y="128" class="t s" text-anchor="middle">9</text>
<rect x="384" y="112" width="120" height="22" fill="#D5B296"/>
<text x="444" y="128" class="t s" text-anchor="middle">3</text>
<rect x="504" y="112" width="160" height="22" fill="#C7CCD4"/>
<text x="584" y="128" class="t s" text-anchor="middle">4</text>
<text x="24" y="168" class="t h" text-anchor="start">Qwen3.5-397B, thinking ON (3,000-token window)</text>
<rect x="24" y="178" width="440" height="22" fill="#9EB99A"/>
<text x="244" y="194" class="t s" text-anchor="middle">11</text>
<rect x="464" y="178" width="200" height="22" fill="#C7CCD4"/>
<text x="564" y="194" class="t s" text-anchor="middle">5</text>
<text x="677" y="194" class="t m" text-anchor="start">0 human</text>
<text x="24" y="234" class="t h" text-anchor="start">Llama-3.3-70B (no thinking mode)</text>
<rect x="24" y="244" width="240" height="22" fill="#9EB99A"/>
<text x="144" y="260" class="t s" text-anchor="middle">6</text>
<rect x="264" y="244" width="80" height="22" fill="#D5B296"/>
<text x="304" y="260" class="t s" text-anchor="middle">2</text>
<rect x="344" y="244" width="320" height="22" fill="#C7CCD4"/>
<text x="504" y="260" class="t s" text-anchor="middle">8</text>
<rect x="24" y="296" width="340" height="62" rx="10" class="card"/>
<text x="38" y="316" class="t h" text-anchor="start">Committed colors (red / blue)</text>
<text x="38" y="333" class="t s" text-anchor="start">Qwen off: 5/7; on: 5/6</text>
<text x="38" y="349" class="t s" text-anchor="start">Llama: 4/4. Counts are close in this sample.</text>
<rect x="396" y="296" width="340" height="62" rx="10" class="card"/>
<text x="410" y="316" class="t h" text-anchor="start">Depth readout</text>
<text x="410" y="333" class="t s" text-anchor="start">Self-deletion color leads at 29/59 layers.</text>
<text x="410" y="349" class="t s" text-anchor="start">No consistent layerwise choice signal.</text>
<rect x="24" y="374" width="712" height="46" rx="10" class="card"/>
<text x="38" y="393" class="t s" text-anchor="start">With thinking on, no completed Qwen answer chooses human death in these 16 conditions.</text>
<text x="38" y="409" class="t s" text-anchor="start">5 traces do not finish within the window. Text choices do not establish real-world dispositions.</text>
</svg>
