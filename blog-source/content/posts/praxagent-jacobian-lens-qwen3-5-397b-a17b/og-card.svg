<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open Jacobian Lens for Qwen3.5-397B</title>
  <desc id="desc">A restrained navy research-release card from Praxagent announcing an open Jacobian lens for Qwen3.5-397B, with lens weights, code, hash, and receipts.</desc>
  <rect width="1200" height="630" fill="#24384D"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif}
    .cream{fill:#F0EBE4}
    .muted{fill:#C9C0B4}
    .blue{fill:#BFD5E6}
    .ink{fill:#17283A}
    .line{stroke:#8FA8C0;stroke-width:2;fill:none}
    .thin{stroke:#8FA8C0;stroke-width:1.5;fill:none}
    .layer{fill:#314A65;stroke:#8FA8C0;stroke-width:1.5}
    .active{fill:#D6E8F5;stroke:#D6E8F5;stroke-width:1.5}
    .token{fill:#314A65;stroke:#6E8AA6;stroke-width:1.3}
  </style>

  <!-- Header -->
  <text x="64" y="68" class="t blue" font-size="24" font-weight="700" letter-spacing="2">PRAXAGENT RESEARCH</text>
  <text x="1136" y="68" class="t muted" font-size="22" text-anchor="end">JULY 10, 2026</text>
  <line x1="64" y1="92" x2="1136" y2="92" stroke="#5A7694" stroke-width="1.5"/>

  <!-- Release badge -->
  <rect x="64" y="130" width="310" height="42" rx="21" fill="#D6E8F5"/>
  <text x="219" y="158" class="t ink" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="1.2">OPEN-SOURCE RELEASE</text>

  <!-- Main title -->
  <text x="64" y="250" class="t cream" font-size="68" font-weight="750">Jacobian Lens</text>
  <text x="64" y="326" class="t cream" font-size="58" font-weight="650">for Qwen3.5-397B</text>
  <text x="68" y="376" class="t blue" font-size="27" font-weight="600">397B total parameters  /  17B active</text>

  <text x="68" y="444" class="t muted" font-size="25">Fitted transport with a controlled readout audit</text>

  <!-- Evidence strip -->
  <circle cx="75" cy="497" r="5" fill="#8FA8C0"/>
  <text x="92" y="505" class="t cream" font-size="23">lens weights</text>
  <circle cx="245" cy="497" r="5" fill="#8FA8C0"/>
  <text x="262" y="505" class="t cream" font-size="23">code</text>
  <circle cx="351" cy="497" r="5" fill="#8FA8C0"/>
  <text x="368" y="505" class="t cream" font-size="23">SHA-256</text>
  <circle cx="512" cy="497" r="5" fill="#8FA8C0"/>
  <text x="529" y="505" class="t cream" font-size="23">receipts</text>

  <!-- Right-side method schematic -->
  <text x="825" y="142" class="t muted" font-size="16" font-weight="700" letter-spacing="1.5">MID-LAYER READOUT</text>

  <rect class="layer" x="760" y="169" width="190" height="48" rx="8"/>
  <text x="855" y="200" class="t blue" text-anchor="middle" font-size="18">early layers</text>
  <rect class="active" x="744" y="231" width="222" height="58" rx="9"/>
  <text x="855" y="257" class="t ink" text-anchor="middle" font-size="18" font-weight="700">workspace band</text>
  <text x="855" y="278" class="t ink" text-anchor="middle" font-size="15">layers 19-38</text>
  <rect class="layer" x="760" y="303" width="190" height="48" rx="8"/>
  <text x="855" y="334" class="t blue" text-anchor="middle" font-size="18">late layers</text>

  <path class="line" d="M855 367 V407 H992"/>
  <path d="M992 407 l-12 -7 v14 z" fill="#8FA8C0"/>

  <rect x="801" y="381" width="108" height="52" rx="8" fill="#8FA8C0"/>
  <text x="855" y="414" class="t ink" text-anchor="middle" font-size="25" font-weight="700">J<tspan baseline-shift="sub" font-size="16">&#x2113;</tspan></text>

  <text x="1026" y="382" class="t muted" font-size="14" font-weight="700" letter-spacing="1">RANKED TOKENS</text>
  <rect class="token" x="1008" y="397" width="128" height="37" rx="7"/>
  <text x="1023" y="422" class="t cream" font-size="17">Japan  #3</text>
  <rect class="token" x="1008" y="442" width="128" height="37" rx="7"/>
  <text x="1023" y="467" class="t cream" font-size="17">China  #5</text>
  <rect class="token" x="1008" y="487" width="128" height="37" rx="7"/>
  <text x="1023" y="512" class="t cream" font-size="17">Canada  #13</text>

  <!-- Footer -->
  <line x1="64" y1="560" x2="1136" y2="560" stroke="#5A7694" stroke-width="1.5"/>
  <text x="64" y="602" class="t muted" font-size="21">praxagent.ai</text>
  <text x="1136" y="602" class="t blue" font-size="21" text-anchor="end">PUBLIC LENS  /  PUBLIC EVIDENCE</text>
</svg>
