<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title3 desc3">
  <title id="title3">Three epistemic objects packed into one feature ID phrase</title>
  <desc id="desc3">Coordinate, label, and causal story are different claims that often get conflated.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .a{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .b{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .c{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .s{font-size:12px}.h{font-size:13px;font-weight:700}.m{font-size:11px;fill:#5A544C}
  </style>
  <text x="24" y="28" class="t h">One phrase, three claims</text>
  <text x="24" y="48" class="t m">"We steered deception feature 58667" mixes objects that must be separated.</text>

  <rect class="a" x="24" y="70" width="210" height="120" rx="10"/>
  <text x="129" y="98" text-anchor="middle" class="t h">1. Coordinate</text>
  <text x="129" y="122" text-anchor="middle" class="t s">integer ID 58667</text>
  <text x="129" y="142" text-anchor="middle" class="t m">index into dictionary</text>
  <text x="129" y="162" text-anchor="middle" class="t m">objective / measurable</text>

  <rect class="b" x="255" y="70" width="210" height="120" rx="10"/>
  <text x="360" y="98" text-anchor="middle" class="t h">2. Label</text>
  <text x="360" y="122" text-anchor="middle" class="t s">"deception"</text>
  <text x="360" y="142" text-anchor="middle" class="t m">human hypothesis</text>
  <text x="360" y="162" text-anchor="middle" class="t m">needs construct tests</text>

  <rect class="c" x="486" y="70" width="210" height="120" rx="10"/>
  <text x="591" y="98" text-anchor="middle" class="t h">3. Causal story</text>
  <text x="591" y="122" text-anchor="middle" class="t s">steering changes lying</text>
  <text x="591" y="142" text-anchor="middle" class="t m">separate experiment</text>
  <text x="591" y="162" text-anchor="middle" class="t m">not implied by the ID</text>
</svg>
