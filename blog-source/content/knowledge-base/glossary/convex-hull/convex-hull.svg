<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430"
     viewBox="0 0 760 430" role="img"
     aria-labelledby="hullTitle hullDesc">
  <title id="hullTitle">The convex hull of three points is the triangle they span</title>
  <desc id="hullDesc">Vertices (0, 0), (4, 0), and (0, 4) form a triangle. The combination with weights one half, one quarter, and one quarter is the point (1, 1) inside the triangle. The point (3, 3) lies outside.</desc>
  <rect width="760" height="430" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
  </style>
  <text x="24" y="32" class="t title">A soft token lands inside the convex hull</text>
  <text x="24" y="52" class="t m">Equal scales. Vertices (0, 0), (4, 0), and (0, 4). Weights 1/2, 1/4, 1/4 give (1, 1).</text>
  <polygon points="100,360 340,360 100,120" fill="#E8F0F7" stroke="#4B6787" stroke-width="2"/>
  <circle cx="100" cy="360" r="5" fill="#2C2924"/>
  <circle cx="340" cy="360" r="5" fill="#2C2924"/>
  <circle cx="100" cy="120" r="5" fill="#2C2924"/>
  <text x="48" y="384" class="t s">(0, 0)</text>
  <text x="348" y="368" class="t s">(4, 0)</text>
  <text x="112" y="116" class="t s">(0, 4)</text>
  <circle cx="160" cy="300" r="6" fill="#A67C52"/>
  <text x="172" y="296" class="t h">(1, 1) inside</text>
  <circle cx="280" cy="180" r="6" fill="#8C4A42"/>
  <text x="296" y="176" class="t h">(3, 3) outside</text>
  <text x="400" y="300" class="t m">Reaching (3, 3) would need weight</text>
  <text x="400" y="318" class="t m">3/4 on (4, 0) and 3/4 on (0, 4).</text>
  <text x="400" y="336" class="t m">Those weights already sum past 1.</text>
</svg>
