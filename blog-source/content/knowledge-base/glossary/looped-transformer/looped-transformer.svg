<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="looped-transformer-title looped-transformer-desc">
<title id="looped-transformer-title">A tall stack of distinct layers beside one shared core run several times</title>
<desc id="looped-transformer-desc">Conceptual diagram, no measured data. Left: an ordinary transformer drawn as eight distinct layers, each used once. Right: a looped transformer drawn as a prelude, one shared core, which may hold one or more transformer blocks, and a coda. An arrow labeled fed back in for the next pass returns the core's output to the core; the core runs K times in all, where K is the number of passes chosen at run time. A dashed path shows the prelude output e re-entering the core on every pass, as it does in many designs. Footer: depth becomes a number of passes chosen at run time, and more passes need not settle or help.</desc>
<style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.arrow{fill:none;stroke:#A67C52;stroke-width:1.8}</style>
<rect width="760" height="400" fill="#F7F4F0"/>
<text class="t title" x="24" y="28">A looped transformer reuses one shared core</text>
<text class="t m" x="24" y="48">Conceptual drawing; the eight-layer stack is a toy count. No model or measurement is shown.</text>
<rect x="24" y="64" width="300" height="276" rx="10" fill="#FBF9F6" stroke="#C4B8A8"/>
<text class="t h" x="40" y="88">Ordinary transformer</text>
<text class="t m" x="40" y="106">8 distinct layers, each used once</text>
<rect x="110" y="300" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="314" text-anchor="middle">layer 1</text>
<rect x="110" y="276" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="290" text-anchor="middle">layer 2</text>
<rect x="110" y="252" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="266" text-anchor="middle">layer 3</text>
<rect x="110" y="228" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="242" text-anchor="middle">layer 4</text>
<rect x="110" y="204" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="218" text-anchor="middle">layer 5</text>
<rect x="110" y="180" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="194" text-anchor="middle">layer 6</text>
<rect x="110" y="156" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="170" text-anchor="middle">layer 7</text>
<rect x="110" y="132" width="128" height="20" rx="6" fill="#E8F0F7" stroke="#4B6787"/><text class="t m" x="174" y="146" text-anchor="middle">layer 8</text>
<text class="t m" x="40" y="330">input at the bottom, prediction at the top</text>
<rect x="344" y="64" width="392" height="276" rx="10" fill="#FBF9F6" stroke="#C4B8A8"/>
<text class="t h" x="360" y="88">Looped transformer</text>
<text class="t m" x="360" y="106">one shared core, run K times; K is chosen at run time</text>
<rect x="362" y="196" width="74" height="40" rx="6" fill="#EDE8E1" stroke="#7F786D"/><text class="t s" x="399" y="220" text-anchor="middle">prelude</text>
<rect x="486" y="196" width="120" height="40" rx="6" fill="#F3E8E0" stroke="#A67C52"/>
<text class="t h" x="546" y="213" text-anchor="middle">core</text>
<text class="t m" x="546" y="228" text-anchor="middle">one or more blocks</text>
<rect x="650" y="196" width="70" height="40" rx="6" fill="#EDE8E1" stroke="#7F786D"/><text class="t s" x="685" y="220" text-anchor="middle">coda</text>
<path d="M 436 216 H 478" class="arrow"/><path d="M 478 211 L 486 216 L 478 221 z" fill="#A67C52"/>
<path d="M 606 216 H 642" class="arrow"/><path d="M 642 211 L 650 216 L 642 221 z" fill="#A67C52"/>
<text class="t m" x="444" y="208">e</text>
<path d="M 570 196 C 570 140, 522 140, 522 190" class="arrow"/>
<path d="M 517 184 L 522 193 L 527 184 z" fill="#A67C52"/>
<text class="t s" x="546" y="138" text-anchor="middle">fed back in for the next pass</text>
<path d="M 450 216 V 272 H 530 V 244" fill="none" stroke="#A89B8C" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M 525 248 L 530 240 L 535 248 z" fill="#A89B8C"/>
<text class="t m" x="456" y="290">in many designs the input</text>
<text class="t m" x="456" y="304">representation e re-enters each pass</text>
<text class="t m" x="614" y="262">same weights</text>
<text class="t m" x="614" y="276">on every pass</text>
<rect x="24" y="354" width="712" height="30" rx="8" fill="#EAF1E5" stroke="#6F8D5E"/>
<text class="t s" x="40" y="373">Depth becomes a number of passes chosen at run time. More passes need not settle, or help.</text>
</svg>
