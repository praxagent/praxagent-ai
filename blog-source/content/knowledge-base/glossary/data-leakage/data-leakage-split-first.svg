<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="leak-title leak-desc">
  <title id="leak-title">Prevent data leakage by splitting before learned preprocessing</title>
  <desc id="leak-desc">An incorrect top workflow fits imputation, scaling, and principal component analysis on all rows before the train-test split, allowing test information to flow backward. A correct bottom workflow splits raw independent units first, fits preprocessing and the model on training rows, and applies the fitted pipeline to test rows only for final evaluation.</desc>
  <defs>
    <marker id="leak-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C2924"/>
    </marker>
    <marker id="leak-bad-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B3F35"/>
    </marker>
    <pattern id="leak-test-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F3E7D7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A67C52" stroke-width="2" opacity="0.30"/>
    </pattern>
  </defs>
  <rect width="960" height="570" rx="24" fill="#F7F4F0"/>
  <text x="480" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2C2924">For held-out evaluation, split before anything learns from data</text>

  <rect x="28" y="68" width="904" height="205" rx="18" fill="#FFFDF9" stroke="#8B3F35" stroke-width="2.5"/>
  <text x="54" y="101" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#8B3F35">Leaking order</text>
  <rect x="54" y="126" width="150" height="78" rx="12" fill="#EAD0CC" stroke="#8B3F35" stroke-width="2"/>
  <text x="129" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">all rows</text>
  <text x="129" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">train + future test</text>
  <line x1="214" y1="165" x2="267" y2="165" stroke="#8B3F35" stroke-width="3" marker-end="url(#leak-bad-arrow)"/>
  <rect x="280" y="116" width="233" height="98" rx="12" fill="#EAD0CC" stroke="#8B3F35" stroke-width="2"/>
  <text x="396" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">fit learned preprocessing</text>
  <text x="396" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">imputation, scaling,</text>
  <text x="396" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">principal component analysis</text>
  <line x1="524" y1="165" x2="577" y2="165" stroke="#8B3F35" stroke-width="3" marker-end="url(#leak-bad-arrow)"/>
  <rect x="590" y="126" width="130" height="78" rx="12" fill="#EAD0CC" stroke="#8B3F35" stroke-width="2"/>
  <text x="655" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">split</text>
  <text x="655" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">too late</text>
  <line x1="730" y1="165" x2="783" y2="165" stroke="#8B3F35" stroke-width="3" marker-end="url(#leak-bad-arrow)"/>
  <rect x="796" y="126" width="110" height="78" rx="12" fill="url(#leak-test-pattern)" stroke="#8B3F35" stroke-width="2"/>
  <text x="851" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">test</text>
  <text x="851" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">already used</text>
  <path d="M850 218 C790 254 350 260 208 217" fill="none" stroke="#8B3F35" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#leak-bad-arrow)"/>
  <text x="525" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8B3F35">test information has already flowed into fitting</text>

  <rect x="28" y="297" width="904" height="238" rx="18" fill="#FFFDF9" stroke="#6F8D5E" stroke-width="2.5"/>
  <text x="54" y="331" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#506A43">Protected order</text>
  <rect x="54" y="360" width="130" height="72" rx="12" fill="#DDE8D6" stroke="#6F8D5E" stroke-width="2"/>
  <text x="119" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">raw units</text>
  <text x="119" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">split first</text>
  <line x1="194" y1="396" x2="239" y2="396" stroke="#2C2924" stroke-width="3" marker-end="url(#leak-arrow)"/>

  <rect x="252" y="346" width="135" height="70" rx="12" fill="#DDE8D6" stroke="#6F8D5E" stroke-width="2"/>
  <text x="319" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">training rows</text>
  <text x="319" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">fit only here</text>
  <line x1="397" y1="381" x2="437" y2="381" stroke="#2C2924" stroke-width="3" marker-end="url(#leak-arrow)"/>
  <rect x="450" y="335" width="218" height="92" rx="12" fill="#DCE6EE" stroke="#4B6787" stroke-width="2"/>
  <text x="559" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">fit pipeline + model</text>
  <text x="559" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">learn medians, scales, axes,</text>
  <text x="559" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">and prediction rule</text>

  <rect x="252" y="449" width="135" height="62" rx="12" fill="url(#leak-test-pattern)" stroke="#A67C52" stroke-width="2"/>
  <text x="319" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">test rows</text>
  <text x="319" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">untouched</text>
  <path d="M668 381 L715 381 L715 444" fill="none" stroke="#2C2924" stroke-width="3" marker-end="url(#leak-arrow)"/>
  <path d="M397 480 L705 480" fill="none" stroke="#2C2924" stroke-width="3" marker-end="url(#leak-arrow)"/>
  <rect x="718" y="414" width="188" height="76" rx="12" fill="#DDE8D6" stroke="#6F8D5E" stroke-width="2"/>
  <text x="812" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2924">transform + evaluate</text>
  <text x="812" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5A544C">using the fitted pipeline</text>
  <text x="480" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A544C">The test rows travel forward through fixed transformations; they never help fit them.</text>
</svg>
