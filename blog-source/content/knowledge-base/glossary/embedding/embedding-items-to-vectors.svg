<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="embedding-title embedding-desc">
  <title id="embedding-title">Items become coordinate vectors in an embedding space</title>
  <desc id="embedding-desc">Three text items on the left map to illustrative two-coordinate vectors and labeled points on a coordinate plane. The two visible coordinates are a teaching simplification.</desc>
  <defs>
    <marker id="embedding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B6787"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#F7F4F0"/>
  <text x="42" y="48" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Items</text>
  <text x="682" y="48" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Toy embedding space (2 coordinates)</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#2C2924">
    <rect x="42" y="82" width="260" height="66" rx="12" fill="#FFFDFC" stroke="#4B6787" stroke-width="2"/>
    <text x="62" y="110" font-weight="700">root pressure</text>
    <text x="62" y="135" fill="#5A544C">vector (0.8, 0.3)</text>
    <rect x="42" y="174" width="260" height="66" rx="12" fill="#FFFDFC" stroke="#6F8D5E" stroke-width="2"/>
    <text x="62" y="202" font-weight="700">soil compaction</text>
    <text x="62" y="227" fill="#5A544C">vector (0.7, 0.4)</text>
    <rect x="42" y="266" width="260" height="66" rx="12" fill="#FFFDFC" stroke="#A67C52" stroke-width="2"/>
    <text x="62" y="294" font-weight="700">protein folding</text>
    <text x="62" y="319" fill="#5A544C">vector (-0.5, 0.6)</text>
  </g>

  <line x1="325" y1="207" x2="432" y2="207" stroke="#4B6787" stroke-width="4" marker-end="url(#embedding-arrow)"/>
  <text x="336" y="188" fill="#4B6787" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">encode</text>

  <line x1="510" y1="338" x2="845" y2="338" stroke="#2C2924" stroke-width="2" marker-end="url(#embedding-arrow)"/>
  <line x1="650" y1="362" x2="650" y2="78" stroke="#2C2924" stroke-width="2" marker-end="url(#embedding-arrow)"/>
  <text x="806" y="366" fill="#5A544C" font-family="Inter, Arial, sans-serif" font-size="15">coordinate 1</text>
  <text x="664" y="93" fill="#5A544C" font-family="Inter, Arial, sans-serif" font-size="15">coordinate 2</text>

  <circle cx="794" cy="260" r="9" fill="#4B6787" stroke="#2C2924" stroke-width="2"/>
  <text x="708" y="250" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">root pressure</text>
  <circle cx="776" cy="234" r="9" fill="#6F8D5E" stroke="#2C2924" stroke-width="2"/>
  <text x="683" y="217" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">soil compaction</text>
  <circle cx="560" cy="182" r="9" fill="#A67C52" stroke="#2C2924" stroke-width="2"/>
  <text x="478" y="163" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">protein folding</text>

  <rect x="42" y="365" width="816" height="36" rx="10" fill="#EAE4DC"/>
  <text x="450" y="389" text-anchor="middle" fill="#4A443D" font-family="Inter, Arial, sans-serif" font-size="15">Real embeddings usually have far more coordinates than a page can display in one graph.</text>
</svg>
