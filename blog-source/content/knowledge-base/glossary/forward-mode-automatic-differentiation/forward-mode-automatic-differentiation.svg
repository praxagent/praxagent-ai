<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-labelledby="fwdTitle fwdDesc">
  <title id="fwdTitle">Forward mode carries a tangent beside every value</title>
  <desc id="fwdDesc">An evaluation trace of f(x1, x2) = x1 times x1 plus x1 times x2 at x1 = 3, x2 = 2, run once with the seed direction (1, 0). Two input boxes on the left hold the values 3 and 2 with tangents 1 and 0. Arrows lead to two product boxes: w3 = x1 times x1 has value 9 and tangent 6, and w4 = x1 times x2 has value 6 and tangent 2, each tangent from the product rule. Arrows from both lead to the output box w5 = w3 + w4, with value 15 and tangent 8 from the sum rule. A footer states that one pass gives f(3, 2) = 15 and the partial derivative with respect to x1, 8, and that seeding (0, 1) instead gives the partial derivative with respect to x2, 3, in a second pass.</desc>
  <rect width="760" height="412" fill="#F7F4F0"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2C2924"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .tan{fill:#7A5634}
    .input{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.3}
    .step{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.3}
    .output{fill:#F3E8E0;stroke:#A67C52;stroke-width:2.2}
    .flow{stroke:#2C2924;stroke-width:1.6}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.2}
  </style>
  <text x="24" y="30" class="t title">Forward mode carries a tangent beside every value</text>
  <text x="24" y="50" class="t m">f(x1, x2) = x1 &#xb7; x1 + x1 &#xb7; x2 at (3, 2), run once with the seed direction (1, 0).</text>
  <text x="24" y="67" class="t m">Each box holds a value and its tangent: how fast that value changes along the seed direction.</text>
  <rect class="input" x="24" y="92" width="196" height="86" rx="10"/>
  <text x="38" y="117" class="t h">x1, an input</text>
  <text x="38" y="140" class="t s">value 3</text>
  <text x="38" y="162" class="t s tan">tangent 1, the seed</text>
  <rect class="input" x="24" y="212" width="196" height="86" rx="10"/>
  <text x="38" y="237" class="t h">x2, an input</text>
  <text x="38" y="260" class="t s">value 2</text>
  <text x="38" y="282" class="t s tan">tangent 0, the seed</text>
  <rect class="step" x="282" y="92" width="196" height="86" rx="10"/>
  <text x="296" y="117" class="t h">w3 = x1 &#xb7; x1</text>
  <text x="296" y="140" class="t s">value 3 &#xb7; 3 = 9</text>
  <text x="296" y="162" class="t s tan">tangent 1 &#xb7; 3 + 3 &#xb7; 1 = 6</text>
  <rect class="step" x="282" y="212" width="196" height="86" rx="10"/>
  <text x="296" y="237" class="t h">w4 = x1 &#xb7; x2</text>
  <text x="296" y="260" class="t s">value 3 &#xb7; 2 = 6</text>
  <text x="296" y="282" class="t s tan">tangent 1 &#xb7; 2 + 3 &#xb7; 0 = 2</text>
  <rect class="output" x="540" y="152" width="196" height="86" rx="10"/>
  <text x="554" y="177" class="t h">w5 = w3 + w4, the output</text>
  <text x="554" y="200" class="t s">value 9 + 6 = 15</text>
  <text x="554" y="222" class="t s tan">tangent 6 + 2 = 8</text>
  <line class="flow" x1="220" y1="135" x2="280" y2="135" marker-end="url(#head)"/>
  <line class="flow" x1="220" y1="158" x2="280" y2="234" marker-end="url(#head)"/>
  <line class="flow" x1="220" y1="255" x2="280" y2="255" marker-end="url(#head)"/>
  <line class="flow" x1="478" y1="142" x2="538" y2="176" marker-end="url(#head)"/>
  <line class="flow" x1="478" y1="248" x2="538" y2="214" marker-end="url(#head)"/>
  <rect class="foot" x="24" y="322" width="712" height="66" rx="8"/>
  <text x="380" y="348" text-anchor="middle" class="t s">One pass gives f(3, 2) = 15 and the derivative along (1, 0): df/dx1 = 8, which is x2 + 2 x1.</text>
  <text x="380" y="370" text-anchor="middle" class="t s">Seeding (0, 1) instead gives df/dx2 = 3 in a second pass: one pass per direction.</text>
</svg>
