<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="titleTail descTail">
  <title id="titleTail">A two-sided sign-test p-value sums equally extreme fair-sign outcomes</title>
  <desc id="descTail">Sixteen paired signs yield fourteen positive and two negative. Under a fair-sign null every one of the 65536 sign patterns is equally likely. The two-sided p-value sums the patterns with at most two positives or at most two negatives.</desc>
  <defs>
    <marker id="arrowTail" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A67C52"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:26px;font-weight:700}
    .h{font-size:20px;font-weight:700}
    .s{font-size:17px}
    .m{font-size:15px;fill:#5A544C}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;fill:#2C2924}
    .card{fill:#FBF9F6;stroke:#D9D0C4;stroke-width:2}
    .obs{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .null{fill:#EDE8E1;stroke:#7F786D;stroke-width:2}
    .tail{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
    .kept{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .arrow{stroke:#A67C52;stroke-width:3;fill:none;marker-end:url(#arrowTail)}
    .dash{stroke:#A89B8C;stroke-width:2;stroke-dasharray:7 6;fill:none}
  </style>

  <text x="40" y="48" class="t title">A p-value is a stated-null tail probability</text>
  <text x="40" y="80" class="t m">Worked sign-test example: 14 wins and 2 losses in 16 paired comparisons.</text>

  <rect class="card" x="40" y="112" width="330" height="390" rx="16"/>
  <text x="64" y="150" class="t h">1. Observe a direction count</text>
  <text x="64" y="178" class="t m">Only signs remain after ranking</text>

  <rect class="obs" x="84" y="210" width="242" height="64" rx="12"/>
  <text x="205" y="240" text-anchor="middle" class="t s">14 positive</text>
  <text x="205" y="262" text-anchor="middle" class="t m">treatment better</text>

  <rect class="tail" x="84" y="292" width="242" height="64" rx="12"/>
  <text x="205" y="322" text-anchor="middle" class="t s">2 negative</text>
  <text x="205" y="344" text-anchor="middle" class="t m">control better</text>

  <text x="205" y="400" text-anchor="middle" class="t s">Observed: 14 wins in 16</text>
  <text x="205" y="430" text-anchor="middle" class="t m">Gap sizes are not used.</text>
  <text x="205" y="456" text-anchor="middle" class="t m">Ties would be dropped first.</text>

  <path class="arrow" d="M390 300 H440"/>
  <text x="415" y="248" text-anchor="middle" class="t m">state the</text>
  <text x="415" y="268" text-anchor="middle" class="t m">null</text>

  <rect class="card" x="460" y="112" width="330" height="390" rx="16"/>
  <text x="484" y="150" class="t h">2. Fair-sign null</text>
  <text x="484" y="178" class="t m">Each nonzero sign is + or - with chance 1/2</text>

  <rect class="null" x="504" y="210" width="242" height="84" rx="12"/>
  <text x="625" y="246" text-anchor="middle" class="t s">2^16 = 65536</text>
  <text x="625" y="274" text-anchor="middle" class="t m">equally likely sign patterns</text>

  <text x="625" y="340" text-anchor="middle" class="t s">Independent fair signs</text>
  <text x="625" y="368" text-anchor="middle" class="t m">jointly, not just one pair at a time</text>
  <line class="dash" x1="504" y1="400" x2="746" y2="400"/>
  <text x="625" y="436" text-anchor="middle" class="t m">If dependence is present, this</text>
  <text x="625" y="462" text-anchor="middle" class="t m">binomial null need not apply.</text>

  <path class="arrow" d="M810 300 H860"/>
  <text x="835" y="248" text-anchor="middle" class="t m">sum the</text>
  <text x="835" y="268" text-anchor="middle" class="t m">tails</text>

  <rect class="card" x="880" y="112" width="280" height="390" rx="16"/>
  <text x="904" y="150" class="t h">3. Two-sided tail</text>
  <text x="904" y="178" class="t m">Either direction counts</text>

  <rect class="tail" x="908" y="208" width="224" height="58" rx="10"/>
  <text x="1020" y="244" text-anchor="middle" class="t s">0, 1, or 2 wins</text>
  <rect class="tail" x="908" y="280" width="224" height="58" rx="10"/>
  <text x="1020" y="316" text-anchor="middle" class="t s">14, 15, or 16 wins</text>

  <text x="1020" y="372" text-anchor="middle" class="t m">sum those probabilities</text>
  <path class="arrow" d="M1020 384 V408"/>
  <rect class="kept" x="932" y="406" width="176" height="40" rx="10"/>
  <text x="1020" y="432" text-anchor="middle" class="t s">p = 0.00418...</text>
  <text x="1020" y="474" text-anchor="middle" class="t m">Rounded report: p = 0.004</text>

  <rect class="kept" x="40" y="530" width="1120" height="68" rx="12"/>
  <text x="600" y="562" text-anchor="middle" class="t s">The p-value is how often the null produces a result at least this extreme.</text>
  <text x="600" y="588" text-anchor="middle" class="t m">It is not the probability that the null is true, and not an effect size.</text>
</svg>
