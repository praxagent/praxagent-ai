<svg xmlns="http://www.w3.org/2000/svg" width="760" height="422" viewBox="0 0 760 422" role="img" aria-labelledby="covTitle covDesc">
  <title id="covTitle">A covariance matrix measures how weighted points spread around their mean</title>
  <desc id="covDesc">Three panels show the same toy embeddings, (0, 0), (4, 0) and (0, 4), drawn to equal scales, under three sets of weights. A shaded ellipse around the weighted mean shows the spread: its half-width in any direction is one standard deviation of the points projected onto that direction. With weights one half, one quarter and one quarter, the mean is (1, 1), the ellipse is wide and tilted along the line from (0, 4) to (4, 0), and the covariance matrix has variances 3 and 3 and covariance minus 1. With weights 0.8, 0.1 and 0.1, the mean is (0.4, 0.4), the ellipse is smaller, and the variances are 1.44 and 1.44 with covariance minus 0.16. With all the weight on (0, 0), the mean is that point, there is no ellipse, and every entry of the covariance matrix is 0. A footer states that moving weight from (4, 0) and (0, 4) onto (0, 0) shrinks the covariance here, down to zero when (0, 0) has all the weight.</desc>
  <rect width="760" height="422" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .tan{fill:#7A5634}
    .card{fill:#FBF9F6;stroke:#D9D0C4;stroke-width:1.2}
    .spread{fill:#E8F0F7;fill-opacity:0.9;stroke:#4B6787;stroke-width:1.6}
    .lead{stroke:#A67C52;stroke-width:1}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.2}
  </style>
  <text x="24" y="32" class="t title">A covariance matrix measures how weighted points spread around their mean</text>
  <text x="24" y="52" class="t m">Toy embeddings (0, 0), (4, 0) and (0, 4), equal scales. Ellipse: one standard deviation of spread in every direction.</text>
  <!-- panel 1: weights 1/2, 1/4, 1/4 -->
  <rect class="card" x="24" y="68" width="232" height="296" rx="10"/>
  <text x="38" y="92" class="t h">Weight shared</text>
  <text x="38" y="110" class="t m">weights 1/2, 1/4, 1/4</text>
  <ellipse class="spread" cx="122" cy="252" rx="68" ry="48.1" transform="rotate(45 122 252)"/>
  <line class="lead" x1="129" y1="252" x2="180.5" y2="252"/>
  <text x="183.5" y="256" class="t m tan">mean (1, 1)</text>
  <circle cx="122" cy="252" r="5.5" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.5"/>
  <circle cx="88" cy="286" r="5" fill="#2C2924"/>
  <text x="75.3" y="290" text-anchor="end" class="t s">1/2</text>
  <circle cx="224" cy="286" r="5" fill="#2C2924"/>
  <text x="224" y="306" text-anchor="middle" class="t s">1/4</text>
  <circle cx="88" cy="150" r="5" fill="#2C2924"/>
  <text x="77" y="154" text-anchor="end" class="t s">1/4</text>
  <text x="38" y="334" class="t s">variances 3 and 3</text>
  <text x="38" y="351" class="t s">covariance &#x2212;1</text>
  <!-- panel 2: weights 0.8, 0.1, 0.1 -->
  <rect class="card" x="264" y="68" width="232" height="296" rx="10"/>
  <text x="278" y="92" class="t h">One point dominant</text>
  <text x="278" y="110" class="t m">weights 0.8, 0.1, 0.1</text>
  <ellipse class="spread" cx="341.6" cy="272.4" rx="43" ry="38.5" transform="rotate(45 341.6 272.4)"/>
  <line class="lead" x1="348.6" y1="272.4" x2="385.1" y2="272.4"/>
  <text x="388.1" y="276.4" class="t m tan">mean (0.4, 0.4)</text>
  <circle cx="341.6" cy="272.4" r="5.5" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.5"/>
  <circle cx="328" cy="286" r="5" fill="#2C2924"/>
  <text x="296.2" y="290" text-anchor="end" class="t s">0.8</text>
  <circle cx="464" cy="286" r="5" fill="#2C2924"/>
  <text x="464" y="306" text-anchor="middle" class="t s">0.1</text>
  <circle cx="328" cy="150" r="5" fill="#2C2924"/>
  <text x="317" y="154" text-anchor="end" class="t s">0.1</text>
  <text x="278" y="334" class="t s">variances 1.44 and 1.44</text>
  <text x="278" y="351" class="t s">covariance &#x2212;0.16</text>
  <!-- panel 3: weights 1, 0, 0 -->
  <rect class="card" x="504" y="68" width="232" height="296" rx="10"/>
  <text x="518" y="92" class="t h">All weight on one point</text>
  <text x="518" y="110" class="t m">weights 1, 0, 0</text>
  <circle cx="568" cy="286" r="9.5" fill="#A67C52"/>
  <text x="584" y="290" class="t m tan">mean (0, 0)</text>
  <circle cx="568" cy="286" r="5" fill="#2C2924"/>
  <text x="556" y="290" text-anchor="end" class="t s">1</text>
  <circle cx="704" cy="286" r="4.5" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.4"/>
  <text x="704" y="306" text-anchor="middle" class="t s">0</text>
  <circle cx="568" cy="150" r="4.5" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.4"/>
  <text x="557" y="154" text-anchor="end" class="t s">0</text>
  <text x="518" y="334" class="t s">variances 0 and 0</text>
  <text x="518" y="351" class="t s">covariance 0</text>
  <rect class="foot" x="24" y="376" width="712" height="34" rx="8"/>
  <text x="380" y="397" text-anchor="middle" class="t s">Moving weight from (4, 0) and (0, 4) onto (0, 0) shrinks the covariance here, down to zero when (0, 0) has all of it.</text>
</svg>
