<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="retrieval-metrics-title retrieval-metrics-desc">
  <title id="retrieval-metrics-title">Recall, reciprocal rank, and discounted gain read one top-ten ranking differently</title>
  <desc id="retrieval-metrics-desc">A top-ten list contains relevant documents at ranks two, five, and nine. Four documents are known relevant in total. Recall at ten is three fourths, reciprocal rank is one half, and normalized discounted cumulative gain gives more credit to earlier relevant results.</desc>
  <rect width="1000" height="480" fill="#F7F4F0"/>
  <text x="500" y="40" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Three metrics, three questions about the same ranked list</text>
  <text x="500" y="68" text-anchor="middle" fill="#5A544C" font-family="Inter, Arial, sans-serif" font-size="15">Toy query: 4 documents are known relevant in the reference labels</text>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#FFFDFC" stroke="#80776D" stroke-width="1.5">
      <rect x="36" y="102" width="78" height="78" rx="10"/><rect x="130" y="102" width="78" height="78" rx="10"/><rect x="224" y="102" width="78" height="78" rx="10"/><rect x="318" y="102" width="78" height="78" rx="10"/><rect x="412" y="102" width="78" height="78" rx="10"/>
      <rect x="506" y="102" width="78" height="78" rx="10"/><rect x="600" y="102" width="78" height="78" rx="10"/><rect x="694" y="102" width="78" height="78" rx="10"/><rect x="788" y="102" width="78" height="78" rx="10"/><rect x="882" y="102" width="78" height="78" rx="10"/>
    </g>
    <g fill="#E8F0E5" stroke="#4E7146" stroke-width="3">
      <rect x="130" y="102" width="78" height="78" rx="10"/><rect x="412" y="102" width="78" height="78" rx="10"/><rect x="788" y="102" width="78" height="78" rx="10"/>
    </g>
    <g fill="#5A544C" font-size="13" font-weight="700">
      <text x="75" y="124">RANK 1</text><text x="169" y="124">RANK 2</text><text x="263" y="124">RANK 3</text><text x="357" y="124">RANK 4</text><text x="451" y="124">RANK 5</text>
      <text x="545" y="124">RANK 6</text><text x="639" y="124">RANK 7</text><text x="733" y="124">RANK 8</text><text x="827" y="124">RANK 9</text><text x="921" y="124">RANK 10</text>
    </g>
    <g fill="#2C2924" font-size="17"><text x="75" y="158">not rel.</text><text x="263" y="158">not rel.</text><text x="357" y="158">not rel.</text><text x="545" y="158">not rel.</text><text x="639" y="158">not rel.</text><text x="733" y="158">not rel.</text><text x="921" y="158">not rel.</text></g>
    <g fill="#315A2E" font-size="17" font-weight="700"><text x="169" y="158">RELEVANT</text><text x="451" y="158">RELEVANT</text><text x="827" y="158">RELEVANT</text></g>
  </g>

  <path d="M 169 190 L 169 226 L 210 226" fill="none" stroke="#6F8D5E" stroke-width="3"/>
  <path d="M 451 190 L 451 226 L 500 226" fill="none" stroke="#6F8D5E" stroke-width="3"/>
  <path d="M 827 190 L 827 226 L 790 226" fill="none" stroke="#6F8D5E" stroke-width="3"/>
  <text x="500" y="218" text-anchor="middle" fill="#315A2E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Three relevant results are inside the cutoff</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="36" y="250" width="286" height="156" rx="16" fill="#FFFDFC" stroke="#4B6787" stroke-width="2"/>
    <text x="179" y="284" text-anchor="middle" fill="#2C2924" font-size="20" font-weight="700">Recall@10</text>
    <text x="179" y="316" text-anchor="middle" fill="#5A544C" font-size="15">How many known relevant</text>
    <text x="179" y="338" text-anchor="middle" fill="#5A544C" font-size="15">documents were found?</text>
    <text x="179" y="380" text-anchor="middle" fill="#31516F" font-size="26" font-weight="700">3 / 4 = 0.75</text>

    <rect x="357" y="250" width="286" height="156" rx="16" fill="#FFFDFC" stroke="#A67C52" stroke-width="2"/>
    <text x="500" y="284" text-anchor="middle" fill="#2C2924" font-size="20" font-weight="700">Reciprocal rank@10</text>
    <text x="500" y="316" text-anchor="middle" fill="#5A544C" font-size="15">How early was the first</text>
    <text x="500" y="338" text-anchor="middle" fill="#5A544C" font-size="15">relevant result?</text>
    <text x="500" y="380" text-anchor="middle" fill="#795530" font-size="26" font-weight="700">1 / 2 = 0.50</text>

    <rect x="678" y="250" width="286" height="156" rx="16" fill="#FFFDFC" stroke="#6F8D5E" stroke-width="2"/>
    <text x="821" y="278" text-anchor="middle" fill="#2C2924" font-size="17" font-weight="700">Normalized discounted</text>
    <text x="821" y="300" text-anchor="middle" fill="#2C2924" font-size="17" font-weight="700">cumulative gain @10</text>
    <text x="821" y="332" text-anchor="middle" fill="#5A544C" font-size="15">Were relevant results near the top?</text>
    <text x="821" y="380" text-anchor="middle" fill="#315A2E" font-size="26" font-weight="700">about 0.515</text>
  </g>

  <text x="500" y="444" text-anchor="middle" fill="#5A544C" font-family="Inter, Arial, sans-serif" font-size="15">Mean reciprocal rank averages reciprocal rank across queries; nDCG can also use graded relevance.</text>
  <text x="500" y="468" text-anchor="middle" fill="#7A3E2F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Scores depend on qrels, cutoff, query set, and handling of unjudged documents.</text>
</svg>
