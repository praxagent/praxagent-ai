<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="block-triangular-matrix-title block-triangular-matrix-desc">
<title id="block-triangular-matrix-title">A block-triangular Jacobian makes stability a running minimum over tokens</title>
<desc id="block-triangular-matrix-desc">Conceptual diagram with toy values, not measured data. Left: a four-by-four grid of blocks for tokens 1 to 4. Diagonal blocks D1 to D4 hold each token's response to its own state; D3 is outlined and labeled unstable. Blocks below the diagonal, marked with a star, are effects of earlier tokens on later ones; blocks above the diagonal are zero, since a later token never affects an earlier one. Right: toy token margins 0.40, 0.25, -0.10 and 0.30 drawn as dots, and the running minimum drawn as a line through 0.40, 0.25, -0.10 and -0.10, which drops below zero, into the shaded region past the edge, at token 3 and stays there. Footer: eigenvalues come from the diagonal blocks alone, so a passage is only as stable as its weakest token.</desc>
<style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.arrow{fill:none;stroke:#A67C52;stroke-width:1.8}.axis{stroke:#7F786D;stroke-width:1}</style>
