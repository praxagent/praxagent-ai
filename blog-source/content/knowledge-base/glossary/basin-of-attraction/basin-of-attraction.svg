  <text x="131.0" y="364.0" text-anchor="end" class="t m">&#x2212;1</text>
  <line x1="135.0" y1="305.0" x2="140.0" y2="305.0" class="ink"/>
  <text x="131.0" y="309.0" text-anchor="end" class="t m">&#x2212;0.5</text>
  <line x1="135.0" y1="250.0" x2="140.0" y2="250.0" class="ink"/>
  <text x="131.0" y="254.0" text-anchor="end" class="t m">0</text>
  <line x1="135.0" y1="195.0" x2="140.0" y2="195.0" class="ink"/>
  <text x="131.0" y="199.0" text-anchor="end" class="t m">0.5</text>
  <line x1="135.0" y1="140.0" x2="140.0" y2="140.0" class="ink"/>
  <text x="131.0" y="144.0" text-anchor="end" class="t m">1</text>
  <text x="0" y="0" transform="translate(84 250.0) rotate(-90)" text-anchor="middle" class="t m">state x</text>
  <rect x="140.0" y="406" width="320.0" height="22" fill="#DCE5EF" stroke="#4B6787" stroke-width="1.4"/>
  <rect x="460.0" y="406" width="160.0" height="22" fill="#F2E6D8" stroke="#7A5634" stroke-width="1.4"/>
  <text x="300.0" y="421" text-anchor="middle" class="t s">scan from the fixed start, c &lt; 0.2: ends at 1</text>
  <text x="540.0" y="421" text-anchor="middle" class="t s">c &gt; 0.2: ends at &#x2212;1</text>
  <circle cx="460.0" cy="417.0" r="5" fill="#FBF9F6" stroke="#2C2924" stroke-width="1.8"/>
  <text x="131.0" y="421" text-anchor="end" class="t m">outcome</text>
</svg>
