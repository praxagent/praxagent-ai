<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="baTitle baDesc">
  <title id="baTitle">A fixed start ends on whichever attractor's basin holds it, so a scan that moves the boundary changes the outcome</title>
  <desc id="baDesc">A plot of the state x, from -1 to 1 (vertical), against a parameter c, from -0.6 to 0.6 (horizontal), for a toy map with attracting fixed points at x = 1 and x = -1 and a repelling fixed point at x = c. The repelling point is a dashed diagonal line, x = c: above it the region is labeled basin of 1, below it basin of -1. The two attracting points are solid lines along the top and bottom edges, present at every c. A dotted horizontal line at x = 0.2 is the fixed start. It lies in the basin of 1 for c below 0.2 and in the basin of -1 for c above 0.2, and it meets the diagonal at c = 0.2, marked by a circle. Arrows show that a start at 0.2 ends at 1 when c = -0.4 and at -1 when c = 0.45. A strip below the plot gives the outcome of a scan over c from the fixed start: it ends at 1 for c below 0.2 and at -1 for c above 0.2; at c = 0.2 itself, marked by an open circle on the strip, the start is the repelling point and reaches neither attractor. The shading covers only the interval from -1 to 1. Toy values, not measured data.</desc>
  <rect width="780" height="460" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .ink{stroke:#2C2924;stroke-width:1.3;fill:none}
  </style>
  <text x="24" y="28" class="t title">A fixed start ends wherever its basin sends it, and the basins move with the parameter</text>
  <text x="24" y="48" class="t m">Toy map with attracting fixed points at 1 and &#x2212;1 and a repelling one at c between them. Exact toy-map values, not measured data.</text>
  <rect class="card" x="16" y="64" width="748" height="376" rx="12"/>
  <text x="32" y="90" class="t h">Basins on the interval from &#x2212;1 to 1, for each value of the parameter c</text>
  <polygon points="140.0,316.0 620.0,184.0 620.0,140.0 140.0,140.0" fill="#DCE5EF"/>
  <polygon points="140.0,360.0 620.0,360.0 620.0,184.0 140.0,316.0" fill="#F2E6D8"/>
  <line x1="140.0" y1="140.0" x2="620.0" y2="140.0" stroke="#4B6787" stroke-width="4"/>
  <line x1="140.0" y1="360.0" x2="620.0" y2="360.0" stroke="#7A5634" stroke-width="4"/>
  <line x1="140.0" y1="316.0" x2="620.0" y2="184.0" stroke="#2C2924" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="140.0" y1="228.0" x2="620.0" y2="228.0" stroke="#2C2924" stroke-width="1.6" stroke-dasharray="2 4"/>
  <circle cx="460.0" cy="228.0" r="6" fill="none" stroke="#2C2924" stroke-width="2"/>
  <text x="450.0" y="219.0" text-anchor="end" class="t s">boundary meets the start: c = 0.2</text>
  <line x1="220.0" y1="228.0" x2="220.0" y2="154.0" stroke="#2C2924" stroke-width="1.5"/>
  <polygon points="220.0,145.0 224.5,154.6 215.5,154.6" fill="#2C2924"/>
  <text x="228.0" y="181.8" class="t s">ends at 1</text>
  <line x1="560.0" y1="228.0" x2="560.0" y2="346.0" stroke="#2C2924" stroke-width="1.5"/>
  <polygon points="560.0,355.0 555.5,345.4 564.5,345.4" fill="#2C2924"/>
  <text x="552.0" y="299.5" text-anchor="end" class="t s">ends at &#x2212;1</text>
  <text x="348.0" y="175.2" class="t h">basin of 1</text>
  <text x="332.0" y="320.4" class="t h">basin of &#x2212;1</text>
  <text x="632" y="144.0" class="t s">x = 1: attracting,</text>
  <text x="632" y="158.0" class="t m">multiplier c</text>
  <text x="632" y="188.0" class="t s">x = c: repelling,</text>
  <text x="632" y="202.0" class="t m">the basin boundary</text>
  <text x="632" y="232.0" class="t s">fixed start, x = 0.2</text>
  <text x="632" y="342.0" class="t s">x = &#x2212;1: attracting,</text>
  <text x="632" y="356.0" class="t m">multiplier &#x2212;c</text>
  <line x1="140.0" y1="362.0" x2="140.0" y2="367.0" class="ink"/>
  <text x="140.0" y="380.0" text-anchor="middle" class="t m">&#x2212;0.6</text>
  <line x1="220.0" y1="362.0" x2="220.0" y2="367.0" class="ink"/>
  <text x="220.0" y="380.0" text-anchor="middle" class="t m">&#x2212;0.4</text>
  <line x1="300.0" y1="362.0" x2="300.0" y2="367.0" class="ink"/>
  <text x="300.0" y="380.0" text-anchor="middle" class="t m">&#x2212;0.2</text>
  <line x1="380.0" y1="362.0" x2="380.0" y2="367.0" class="ink"/>
  <text x="380.0" y="380.0" text-anchor="middle" class="t m">0</text>
  <line x1="460.0" y1="362.0" x2="460.0" y2="367.0" class="ink"/>
  <text x="460.0" y="380.0" text-anchor="middle" class="t m">0.2</text>
  <line x1="540.0" y1="362.0" x2="540.0" y2="367.0" class="ink"/>
