<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="line-versus-boxes-title line-versus-boxes-desc">
  <title id="line-versus-boxes-title">One straight cut, one tree of boxes, and a forest of averaged boxes on the same schematic candidates</title>
  <desc id="line-versus-boxes-desc">Three panels show the identical schematic scatter of candidates in two features, with filled dots for labeled positives and hollow dots for labeled negatives. Most positives sit in an upper-right cluster, and four more form a separate pocket at the lower right, where the first feature is high but the second is low. The left panel draws logistic regression as one straight diagonal boundary: it can separate the upper-right cluster, but the lower-right pocket falls on the negative side and is missed, because a single straight boundary cannot enclose two separated positive regions without also sweeping in the negatives that lie between them. The middle panel draws a single decision tree as axis-aligned boxes formed by a vertical cut, then a horizontal cut on the right side, then a second vertical cut below it. Two of the four boxes are labeled positive with probabilities 0.93 and 0.88, so both the cluster and the pocket are captured, but each box has one hard edge and every candidate inside a box receives the same probability. The right panel shows what averaging many such partitions does: the individual tree boundaries, drawn as dashed lines, disagree slightly with one another, so the shading around each positive region moves in steps from a dark core where every tree agrees, through a lighter ring where trees disagree, to unshaded background. The geometry is illustrative rather than fitted, and the real feature space has eight dimensions.</desc>
  <defs>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:24px;font-weight:700}
      .h{font-size:17px;font-weight:700}
      .m{font-size:13px;fill:#5A544C}
      .xs{font-size:12px;fill:#5A544C}
      .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
      .axis{stroke:#5A544C;stroke-width:1.6}
      .pos{fill:#4B6787;stroke:#2C2924;stroke-width:1.5}
      .neg{fill:#FBF9F6;stroke:#2C2924;stroke-width:1.5}
      .cut{stroke:#2C2924;stroke-width:2.5}
      .ghost{stroke:#8B8377;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
      .note{fill:none;stroke:#A67C52;stroke-width:2.5;stroke-dasharray:7 5}
    </style>
    <g id="scatter">
      <circle class="neg" cx="24" cy="216" r="6"/>
      <circle class="neg" cx="48" cy="192" r="6"/>
      <circle class="neg" cx="36" cy="168" r="6"/>
      <circle class="neg" cx="72" cy="204" r="6"/>
      <circle class="neg" cx="60" cy="156" r="6"/>
      <circle class="neg" cx="96" cy="192" r="6"/>
      <circle class="neg" cx="24" cy="132" r="6"/>
      <circle class="neg" cx="84" cy="132" r="6"/>
      <circle class="neg" cx="120" cy="216" r="6"/>
      <circle class="neg" cx="48" cy="108" r="6"/>
      <circle class="neg" cx="108" cy="168" r="6"/>
      <circle class="neg" cx="144" cy="204" r="6"/>
      <circle class="neg" cx="72" cy="84" r="6"/>
      <circle class="neg" cx="36" cy="60" r="6"/>
      <circle class="neg" cx="120" cy="120" r="6"/>
      <circle class="neg" cx="96" cy="48" r="6"/>
      <circle class="neg" cx="48" cy="24" r="6"/>
      <circle class="neg" cx="156" cy="144" r="6"/>
      <circle class="pos" cx="168" cy="72" r="6"/>
      <circle class="pos" cx="192" cy="48" r="6"/>
      <circle class="pos" cx="156" cy="36" r="6"/>
      <circle class="pos" cx="204" cy="84" r="6"/>
      <circle class="pos" cx="180" cy="24" r="6"/>
      <circle class="pos" cx="216" cy="60" r="6"/>
      <circle class="pos" cx="156" cy="72" r="6"/>
      <circle class="pos" cx="216" cy="24" r="6"/>
      <circle class="pos" cx="204" cy="192" r="6"/>
      <circle class="pos" cx="216" cy="168" r="6"/>
      <circle class="pos" cx="192" cy="156" r="6"/>
      <circle class="pos" cx="228" cy="180" r="6"/>
    </g>
    <g id="frame">
      <line class="axis" x1="0" y1="240" x2="240" y2="240"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="240"/>
    </g>
  </defs>

  <rect width="1000" height="560" fill="#F7F4F0"/>
  <text class="t title" x="24" y="34">Why the shape of the decision boundary matters</text>
  <text class="t m" x="24" y="58">The same schematic candidates three times. Most positives sit upper right; four more form a pocket at the lower right.</text>

  <!-- Panel 1: straight cut -->
  <rect class="card" x="24" y="88" width="310" height="392" rx="12"/>
  <text class="t h" x="48" y="118">Model one: one straight cut</text>
  <text class="t m" x="48" y="136">The same weights act everywhere.</text>
  <text class="t xs" x="52" y="272" text-anchor="middle" transform="rotate(-90 52 272)">feature B increases upward</text>
  <g transform="translate(64,152)">
    <use href="#frame"/>
    <line x1="60" y1="0" x2="240" y2="180" stroke="#4B6787" stroke-width="3.5"/>
    <text class="t xs" x="140" y="16" fill="#3C5570" font-weight="700">positive side</text>
    <use href="#scatter"/>
    <ellipse class="note" cx="210" cy="174" rx="36" ry="30"/>
    <text class="t xs" x="238" y="228" text-anchor="end" fill="#7A5A3A" font-weight="700">pocket missed</text>
  </g>
  <text class="t xs" x="64" y="418">feature A increases to the right</text>
  <text class="t xs" x="48" y="444">One straight line cannot enclose both</text>
  <text class="t xs" x="48" y="460">positive regions, so the pocket is missed.</text>

  <!-- Panel 2: one tree -->
  <rect class="card" x="345" y="88" width="310" height="392" rx="12"/>
  <text class="t h" x="369" y="118">One tree: axis-aligned boxes</text>
  <text class="t m" x="369" y="136">Each cut splits one feature at one value.</text>
  <g transform="translate(385,152)">
    <rect x="0" y="0" width="132" height="240" fill="#F2EEE8"/>
    <rect x="132" y="0" width="108" height="120" fill="#E8F0F7"/>
    <rect x="132" y="120" width="48" height="120" fill="#F2EEE8"/>
    <rect x="180" y="120" width="60" height="120" fill="#E8F0F7"/>
    <line class="cut" x1="132" y1="0" x2="132" y2="240"/>
    <line class="cut" x1="132" y1="120" x2="240" y2="120"/>
    <line class="cut" x1="180" y1="120" x2="180" y2="240"/>
    <use href="#frame"/>
    <use href="#scatter"/>
    <text class="t xs" x="186" y="16" text-anchor="middle" font-weight="700" fill="#3C5570">0.93</text>
    <text class="t xs" x="66" y="16" text-anchor="middle" font-weight="700">0.02</text>
    <text class="t xs" x="156" y="234" text-anchor="middle" font-weight="700">0.05</text>
    <text class="t xs" x="210" y="136" text-anchor="middle" font-weight="700" fill="#3C5570">0.88</text>
  </g>
  <text class="t xs" x="385" y="418">cut on A, then on B, then on A again</text>
  <text class="t xs" x="369" y="444">Two separate boxes can both be called</text>
  <text class="t xs" x="369" y="460">likely positive, so the pocket is caught.</text>

  <!-- Panel 3: forest -->
  <rect class="card" x="666" y="88" width="310" height="392" rx="12"/>
  <text class="t h" x="690" y="118">A forest: many boxes averaged</text>
  <text class="t m" x="690" y="136">Trees disagree slightly about where to cut.</text>
  <g transform="translate(706,152)">
    <rect x="120" y="0" width="120" height="126" fill="#E8F0F7"/>
    <rect x="150" y="0" width="90" height="102" fill="#C9DCEC"/>
    <rect x="168" y="144" width="72" height="96" fill="#E8F0F7"/>
    <rect x="192" y="162" width="48" height="78" fill="#C9DCEC"/>
    <polyline class="ghost" points="126,0 126,110 240,110"/>
    <polyline class="ghost" points="140,0 140,96 240,96"/>
    <polyline class="ghost" points="114,0 114,126 240,126"/>
    <polyline class="ghost" points="174,240 174,150 240,150"/>
    <polyline class="ghost" points="186,240 186,168 240,168"/>
    <polyline class="ghost" points="198,240 198,138 240,138"/>
    <use href="#frame"/>
    <use href="#scatter"/>
  </g>
  <text class="t xs" x="706" y="418">dashed: cuts drawn by individual trees</text>
  <text class="t xs" x="690" y="444">Dark core: every tree agrees. Light ring:</text>
  <text class="t xs" x="690" y="460">they disagree, so the average steps down.</text>

  <rect x="24" y="496" width="952" height="44" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text class="t m" x="500" y="514" text-anchor="middle" font-weight="700">Filled dot: labeled positive. Hollow dot: labeled negative. Both models see the same candidates.</text>
  <text class="t xs" x="500" y="532" text-anchor="middle">Schematic geometry in two features, chosen to show the structural difference. HTRU2 has eight features and no such picture can be drawn.</text>
</svg>
