<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="scifactQualityTitle scifactQualityDesc">
  <title id="scifactQualityTitle">SciFact retrieval quality across three document protocols</title>
  <desc id="scifactQualityDesc">SciFact test document nDCG at 10 on a zero-to-one axis, with query-bootstrap intervals: naive 256-token chunks 0.6414 [0.5942, 0.6876]; late 256-token chunks 0.6610 [0.6145, 0.7071]; whole-document encoding 0.6389 [0.5918, 0.6852]. Higher is better.</desc>
  <defs>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:15px;font-weight:700}
      .h{font-size:13px;font-weight:700}
      .s{font-size:12px}
      .m{font-size:11px;fill:#5A544C}
      .grid{stroke:#D9D0C4;stroke-width:1}
      .axis{stroke:#7F786D;stroke-width:1.4}
      .ci{stroke:#2C2924;stroke-width:2}
      .naive{fill:#F3E8E0;stroke:#A67C52;stroke-width:2}
      .late{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
      .whole{fill:#EDE8E1;stroke:#7F786D;stroke-width:2}
    </style>
  </defs>
  <rect width="760" height="390" fill="#F7F4F0"/>
  <text x="24" y="29" class="t title">SciFact retrieval quality across three document protocols</text>
  <text x="24" y="50" class="t m">Same 5,183 documents, 300 queries, qrels, model, and query path; higher is better.</text>
  <line x1="210.0" y1="91" x2="210.0" y2="312" class="grid"/>
  <text x="210.0" y="332" text-anchor="middle" class="t m">0.0</text>
  <line x1="308.0" y1="91" x2="308.0" y2="312" class="grid"/>
  <text x="308.0" y="332" text-anchor="middle" class="t m">0.2</text>
  <line x1="406.0" y1="91" x2="406.0" y2="312" class="grid"/>
  <text x="406.0" y="332" text-anchor="middle" class="t m">0.4</text>
  <line x1="504.0" y1="91" x2="504.0" y2="312" class="grid"/>
  <text x="504.0" y="332" text-anchor="middle" class="t m">0.6</text>
  <line x1="602.0" y1="91" x2="602.0" y2="312" class="grid"/>
  <text x="602.0" y="332" text-anchor="middle" class="t m">0.8</text>
  <line x1="700.0" y1="91" x2="700.0" y2="312" class="grid"/>
  <text x="700.0" y="332" text-anchor="middle" class="t m">1.0</text>
  <line x1="210.0" y1="312" x2="700.0" y2="312" class="axis"/>
  <text x="455" y="354" text-anchor="middle" class="t s">Document nDCG@10 (0 to 1; higher is better)</text>
  <text x="194" y="149" text-anchor="end" class="t h">Naive 256-token chunks</text>
  <line x1="501.1" y1="145" x2="546.9" y2="145" class="ci"/>
  <line x1="501.1" y1="138" x2="501.1" y2="152" class="ci"/>
  <line x1="546.9" y1="138" x2="546.9" y2="152" class="ci"/>
  <rect x="517.3" y="138" width="14" height="14" class="naive"/>
  <text x="558.9" y="149" class="t s">0.6414 [0.5942, 0.6876]</text>
  <text x="194" y="219" text-anchor="end" class="t h">Late 256-token chunks</text>
  <line x1="511.1" y1="215" x2="556.5" y2="215" class="ci"/>
  <line x1="511.1" y1="208" x2="511.1" y2="222" class="ci"/>
  <line x1="556.5" y1="208" x2="556.5" y2="222" class="ci"/>
  <circle cx="533.9" cy="215" r="8" class="late"/>
  <text x="568.5" y="219" class="t s">0.6610 [0.6145, 0.7071]</text>
  <text x="194" y="289" text-anchor="end" class="t h">Whole document</text>
  <line x1="500.0" y1="285" x2="545.8" y2="285" class="ci"/>
  <line x1="500.0" y1="278" x2="500.0" y2="292" class="ci"/>
  <line x1="545.8" y1="278" x2="545.8" y2="292" class="ci"/>
  <path d="M523.1 276 L532.1 285 L523.1 294 L514.1 285 Z" class="whole"/>
  <text x="557.8" y="289" class="t s">0.6389 [0.5918, 0.6852]</text>
  <rect x="24" y="365" width="712" height="21" rx="7" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.3"/>
  <text x="380" y="380" text-anchor="middle" class="t m">Intervals resample the fixed test queries; they do not establish performance on another corpus.</text>
</svg>
