baseURL: 'https://praxagent.ai/blog/'
languageCode: 'en-us'
title: 'praxagent Research Notes'
description: 'Technical research notes on model internals, controlled evaluation, and applied AI systems'

ignoreFiles:
  - '\\.venv/'
  - 'venv/'
  - '\\.git/'
  - 'node_modules/'
  - '__pycache__/'

params:
  description: 'Experiments, methods, controls, and engineering notes from praxagent'

permalinks:
  posts: '/posts/:year/:month/:slug/'

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

outputs:
  home: ['HTML']
  page: ['HTML']
  section: ['HTML']

publishDir: '../blog'
