baseURL: 'https://praxagent.ai/blog/'
languageCode: 'en-us'
title: 'praxagent Research Notes'
description: 'Technical research notes on model internals, controlled evaluation, and applied AI systems'

ignoreFiles:
  - '\\.venv/'
  - 'venv/'
  - '\\.git/'
  - 'node_modules/'
  - '__pycache__/'
  - '(^|/)AGENTS[.]md$'

params:
  description: 'Experiments, methods, controls, and engineering notes from praxagent'
  scholarly:
    default_author: 'timothy-jones'
    publisher_name: 'praxagent'
    publisher_url: 'https://praxagent.ai'
    container_title: 'praxagent Research Notes'
    repository_url: 'https://github.com/praxagent/praxagent-ai'
    rights_holder: 'praxagent'
    rights_label: 'All rights reserved.'
    rights_url: 'https://github.com/praxagent/praxagent-ai/blob/main/CONTENT-LICENSE.md'

permalinks:
  posts: '/posts/:year/:month/:slug/'

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

outputs:
  home: ['HTML']
  page: ['HTML']
  section: ['HTML']

publishDir: '../blog'
