name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Pick up documentation changes from Prax without requiring changes there.
    - cron: "17 09 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build and validate
        env:
          PRAX_DOCS_CACHE: ${{ runner.temp }}/prax-docs
        run: make ci

      - name: Verify Prax deploy artifact
        run: |
          test -f blog/knowledge-base/prax/index.html
          test -f blog/references/prax/index.html
          test -f blog/prax-docs/prax-docs-manifest.json
          # GitHub Pages returns 404 for directories that are not world-traversable.
          python3 - <<'PY'
          import stat
          from pathlib import Path

          for relative in (
              "blog/knowledge-base/prax",
              "blog/references/prax",
              "blog/prax-docs",
          ):
              path = Path(relative)
              mode = path.stat().st_mode
              print(f"{relative} mode={oct(mode & 0o777)}")
              if not ((mode & stat.S_IXOTH) and (mode & stat.S_IROTH)):
                  raise SystemExit(
                      f"error: {relative} mode {oct(mode & 0o777)} is not world-traversable"
                  )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
