<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="titleLayers descLayers">
  <title id="titleLayers">Track the fingerprint downstream across layers, not at one depth</title>
  <desc id="descLayers">The steering vector is inserted at layer 50. The J-score fingerprint is measured again at layers 55 through 78 and fades smoothly but stays clearly nonzero.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .bar{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}
    .barins{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}
    .barprim{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .lay{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .axis{stroke:#A89B8C;stroke-width:1.4}
    .arrow{stroke:#A67C52;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">Follow the fingerprint downstream, not just at one depth</text>
  <text x="24" y="48" class="t m">Bars: paired target-minus-matched change in the frozen J score at each measured layer (amplification).</text>

  <!-- insertion arrow -->
  <path class="arrow" d="M95,68 L95,92" marker-end="url(#ah)"/>
  <text x="112" y="74" class="t s">steering vector added here</text>

  <!-- bars: values 1.18 1.06 0.95 0.91 0.83 0.68 0.48, scale x127, baseline 248 -->
  <rect class="barins"  x="78"  y="98"  width="34" height="150"/>
  <rect class="bar"     x="174" y="113" width="34" height="135"/>
  <rect class="bar"     x="270" y="127" width="34" height="121"/>
  <rect class="barprim" x="366" y="133" width="34" height="115"/>
  <rect class="bar"     x="462" y="143" width="34" height="105"/>
  <rect class="bar"     x="558" y="162" width="34" height="86"/>
  <rect class="bar"     x="654" y="187" width="34" height="61"/>

  <text x="95"  y="114" text-anchor="middle" class="t m">+1.18</text>
  <text x="191" y="105" text-anchor="middle" class="t m">+1.06</text>
  <text x="287" y="119" text-anchor="middle" class="t m">+0.95</text>
  <text x="383" y="125" text-anchor="middle" class="t m">+0.91</text>
  <text x="479" y="135" text-anchor="middle" class="t m">+0.83</text>
  <text x="575" y="154" text-anchor="middle" class="t m">+0.68</text>
  <text x="671" y="179" text-anchor="middle" class="t m">+0.48</text>

  <!-- zero baseline -->
  <line class="axis" x1="60" y1="248" x2="706" y2="248"/>
  <text x="712" y="252" class="t m">0</text>

  <!-- layer labels -->
  <rect class="lay" x="60"  y="256" width="70" height="22" rx="5"/><text x="95"  y="271" text-anchor="middle" class="t m">layer 50</text>
  <rect class="lay" x="156" y="256" width="70" height="22" rx="5"/><text x="191" y="271" text-anchor="middle" class="t m">layer 55</text>
  <rect class="lay" x="252" y="256" width="70" height="22" rx="5"/><text x="287" y="271" text-anchor="middle" class="t m">layer 60</text>
  <rect class="lay" x="348" y="256" width="70" height="22" rx="5"/><text x="383" y="271" text-anchor="middle" class="t m">layer 65</text>
  <rect class="lay" x="444" y="256" width="70" height="22" rx="5"/><text x="479" y="271" text-anchor="middle" class="t m">layer 70</text>
  <rect class="lay" x="540" y="256" width="70" height="22" rx="5"/><text x="575" y="271" text-anchor="middle" class="t m">layer 75</text>
  <rect class="lay" x="636" y="256" width="70" height="22" rx="5"/><text x="671" y="271" text-anchor="middle" class="t m">layer 78</text>

  <text x="95"  y="292" text-anchor="middle" class="t m">insert</text>
  <text x="383" y="292" text-anchor="middle" class="t m">primary readout</text>
  <text x="671" y="292" text-anchor="middle" class="t m">latest</text>

  <!-- Footer -->
  <rect class="foot" x="24" y="304" width="712" height="36" rx="10"/>
  <text x="40" y="327" class="t s">The network does not erase the edit, but it does attenuate it: strong where inserted, still clearly nonzero 28 blocks later.</text>
</svg>
