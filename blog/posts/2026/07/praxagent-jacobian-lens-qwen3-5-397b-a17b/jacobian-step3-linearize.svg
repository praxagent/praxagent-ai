<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: linearize the downstream transformer</title>
  <desc id="desc">The baseline source vector goes through the nonlinear downstream transformer to the baseline target vector. A nearby perturbed source goes through the same transformer to a nearby target. The Jacobian is the local d by d matrix that approximately maps the small source perturbation to the resulting target displacement.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .h{font-size:22px;font-weight:700}
    .sh{font-size:17px;font-weight:700}
    .s{font-size:15px}
    .m{font-size:13px;fill:#5A544C}
    .baseline{fill:#FFFFFF;stroke:#7F786D;stroke-width:1.7}
    .perturbed{fill:#DCE9F5;stroke:#4B6787;stroke-width:2}
    .output{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .nonlinear{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.7}
    .jacobian{fill:#E8F0F7;stroke:#4B6787;stroke-width:2}
    .arrow{stroke:#7F786D;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .blueArrow{stroke:#4B6787;stroke-width:2.5;fill:none;marker-end:url(#blueArrow)}
    .greenArrow{stroke:#587447;stroke-width:2.5;fill:none;marker-end:url(#greenArrow)}
    .dash{stroke:#B8B0A4;stroke-width:1.4;stroke-dasharray:6 4}
    .blue{fill:#35597B}
    .green{fill:#587447}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7F786D"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4B6787"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#587447"/>
    </marker>
  </defs>

  <text x="28" y="34" class="t h">Step 3: replace the nonlinear map by its local tangent map</text>
  <text x="28" y="58" class="t m">Keep the prompt x, source position t, and target position t' fixed. Compare one forward pass with a nearby perturbed pass.</text>

  <!-- baseline lane -->
  <text x="28" y="115" class="t sh">baseline</text>
  <rect class="baseline" x="150" y="78" width="180" height="72" rx="9"/>
  <text x="240" y="106" text-anchor="middle" class="t s" font-style="italic">h<tspan baseline-shift="sub" font-size="11">&#x2113;,t</tspan></text>
  <text x="240" y="132" text-anchor="middle" class="t m">current source vector</text>
  <path class="arrow" d="M335 114 H382"/>
  <rect class="nonlinear" x="390" y="78" width="230" height="72" rx="9"/>
  <text x="505" y="105" text-anchor="middle" class="t sh">nonlinear downstream map</text>
  <text x="505" y="131" text-anchor="middle" class="t m" font-style="italic">F<tspan baseline-shift="sub" font-size="10">x,&#x2113;,t&#x2032;,t</tspan></text>
  <path class="arrow" d="M625 114 H672"/>
  <rect class="output" x="680" y="78" width="180" height="72" rx="9"/>
  <text x="770" y="106" text-anchor="middle" class="t s" font-style="italic">h<tspan baseline-shift="sub" font-size="11">L,t&#x2032;</tspan></text>
  <text x="770" y="132" text-anchor="middle" class="t m">current target vector</text>

  <!-- perturbed lane -->
  <text x="28" y="215" class="t sh blue">nearby pass</text>
  <rect class="perturbed" x="150" y="178" width="180" height="72" rx="9"/>
  <text x="240" y="206" text-anchor="middle" class="t s blue" font-style="italic">h<tspan baseline-shift="sub" font-size="11">&#x2113;,t</tspan> + &#x3B4;h</text>
  <text x="240" y="232" text-anchor="middle" class="t m">small source nudge</text>
  <path class="blueArrow" d="M335 214 H382"/>
  <rect class="nonlinear" x="390" y="178" width="230" height="72" rx="9"/>
  <text x="505" y="205" text-anchor="middle" class="t sh">same nonlinear map</text>
  <text x="505" y="231" text-anchor="middle" class="t m">same prompt and positions</text>
  <path class="greenArrow" d="M625 214 H672"/>
  <rect class="output" x="680" y="178" width="180" height="72" rx="9"/>
  <text x="770" y="206" text-anchor="middle" class="t s green" font-style="italic">h<tspan baseline-shift="sub" font-size="11">L,t&#x2032;</tspan> + &#x394;h</text>
  <text x="770" y="232" text-anchor="middle" class="t m">actual target displacement</text>

  <line class="dash" x1="28" y1="278" x2="872" y2="278"/>

  <!-- tangent map -->
  <text x="28" y="322" class="t sh">first-order approximation</text>
  <rect class="perturbed" x="220" y="296" width="130" height="62" rx="9"/>
  <text x="285" y="322" text-anchor="middle" class="t sh blue" font-style="italic">&#x3B4;h<tspan baseline-shift="sub" font-size="10">&#x2113;,t</tspan></text>
  <text x="285" y="344" text-anchor="middle" class="t m">in &#x211D;<tspan baseline-shift="super" font-size="9">d</tspan></text>
  <path class="blueArrow" d="M355 327 H405"/>
  <rect class="jacobian" x="413" y="288" width="215" height="78" rx="9"/>
  <text x="520" y="316" text-anchor="middle" class="t sh blue" font-style="italic">A<tspan baseline-shift="super" font-size="10">(&#x2113;)</tspan><tspan baseline-shift="sub" font-size="10">x,t&#x2032;,t</tspan></text>
  <text x="520" y="340" text-anchor="middle" class="t s">local d &#xD7; d Jacobian</text>
  <text x="520" y="358" text-anchor="middle" class="t m">derivative at the baseline pass</text>
  <path class="greenArrow" d="M633 327 H683"/>
  <rect class="output" x="691" y="296" width="150" height="62" rx="9"/>
  <text x="766" y="322" text-anchor="middle" class="t sh green" font-style="italic">A &#x3B4;h</text>
  <text x="766" y="344" text-anchor="middle" class="t m">&#x2248; &#x394;h in &#x211D;<tspan baseline-shift="super" font-size="9">d</tspan></text>

  <text x="28" y="382" class="t m">The approximation is local: the omitted error is second order in the size of the perturbation, O(||delta h||^2).</text>
</svg>
