<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="mcTitle mcDesc">
  <title id="mcTitle">Monte Carlo estimation of an average Jacobian lens</title>
  <desc id="mcDesc">Three sampled text contexts produce three different two by two local Jacobian matrices. The matrices are added element by element and divided by three to give one estimated average transport. A bottom strip scales the toy example to the actual Qwen fit: 24 WikiText passages, up to 128 tokens, 60 layers, and 4096 by 4096 matrices.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .h{font-size:18px;font-weight:700}
    .sh{font-size:14px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .panel{fill:#FFFFFF;stroke:#4B6787;stroke-width:1.5}
    .prompt{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.2}
    .target{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.2}
    .matrix{fill:#FCFBF9;stroke:#A89B8C;stroke-width:1.2}
    .mean{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .accent{fill:#4B6787}
    .green{fill:#587447}
    .arrow{stroke:#7F786D;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#B8B0A4;stroke-width:1.2;stroke-dasharray:5 4}
    .bracket{stroke:#4B6787;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7F786D"/>
    </marker>
  </defs>

  <text x="28" y="32" class="t h">Monte Carlo fitting: average many local tangent maps</text>
  <text x="28" y="53" class="t m">Toy residual width d = 2. Each text and causal position pair gives a different Jacobian.</text>

  <rect class="panel" x="28" y="74" width="264" height="292" rx="12"/>
  <text x="48" y="101" class="t sh">Sample 1</text>
  <rect class="prompt" x="48" y="116" width="224" height="58" rx="7"/>
  <text x="60" y="139" class="t s">&quot;the capital of [France] is Paris&quot;</text>
  <text x="60" y="158" class="t m">source t = France; target t' = Paris</text>
  <path class="arrow" d="M160 179 V202"/>
  <text x="178" y="194" class="t m">differentiate</text>
  <rect class="matrix" x="80" y="208" width="160" height="112" rx="8"/>
  <text x="160" y="231" text-anchor="middle" class="t s">local map A1</text>
  <path class="bracket" d="M112 246 h-7 v49 h7 M208 246 h7 v49 h-7"/>
  <text x="132" y="266" text-anchor="middle" class="t s">1.2</text>
  <text x="180" y="266" text-anchor="middle" class="t s">0.1</text>
  <text x="132" y="289" text-anchor="middle" class="t s">0.0</text>
  <text x="180" y="289" text-anchor="middle" class="t s">0.8</text>
  <text x="160" y="344" text-anchor="middle" class="t m">one context-specific tangent</text>

  <rect class="panel" x="312" y="74" width="264" height="292" rx="12"/>
  <text x="332" y="101" class="t sh">Sample 2</text>
  <rect class="prompt" x="332" y="116" width="224" height="58" rx="7"/>
  <text x="344" y="139" class="t s">&quot;a leaf converts light into sugar&quot;</text>
  <text x="344" y="158" class="t m">source t = leaf; target t' = sugar</text>
  <path class="arrow" d="M444 179 V202"/>
  <text x="462" y="194" class="t m">differentiate</text>
  <rect class="matrix" x="364" y="208" width="160" height="112" rx="8"/>
  <text x="444" y="231" text-anchor="middle" class="t s">local map A2</text>
  <path class="bracket" d="M396 246 h-7 v49 h7 M492 246 h7 v49 h-7"/>
  <text x="416" y="266" text-anchor="middle" class="t s">0.9</text>
  <text x="464" y="266" text-anchor="middle" class="t s">0.2</text>
  <text x="416" y="289" text-anchor="middle" class="t s">-0.1</text>
  <text x="464" y="289" text-anchor="middle" class="t s">1.1</text>
  <text x="444" y="344" text-anchor="middle" class="t m">same model, different tangent</text>

  <rect class="panel" x="596" y="74" width="336" height="292" rx="12"/>
  <text x="616" y="101" class="t sh">Sample 3, then average element by element</text>
  <rect class="target" x="616" y="116" width="144" height="58" rx="7"/>
  <text x="628" y="139" class="t s">&quot;the proof follows&quot;</text>
  <text x="628" y="158" class="t m">another (x,t,t')</text>
  <rect class="matrix" x="616" y="208" width="144" height="112" rx="8"/>
  <text x="688" y="231" text-anchor="middle" class="t s">local map A3</text>
  <path class="bracket" d="M644 246 h-7 v49 h7 M732 246 h7 v49 h-7"/>
  <text x="663" y="266" text-anchor="middle" class="t s">1.1</text>
  <text x="708" y="266" text-anchor="middle" class="t s">-0.1</text>
  <text x="663" y="289" text-anchor="middle" class="t s">0.2</text>
  <text x="708" y="289" text-anchor="middle" class="t s">0.9</text>
  <path class="arrow" d="M770 264 H792"/>
  <rect class="mean" x="798" y="191" width="116" height="142" rx="9"/>
  <text x="856" y="215" text-anchor="middle" class="t s green">Jhat = (A1+A2+A3)/3</text>
  <path class="bracket" d="M820 237 h-6 v51 h6 M893 237 h6 v51 h-6"/>
  <text x="837" y="258" text-anchor="middle" class="t s">1.067</text>
  <text x="876" y="258" text-anchor="middle" class="t s">0.067</text>
  <text x="837" y="281" text-anchor="middle" class="t s">0.033</text>
  <text x="876" y="281" text-anchor="middle" class="t s">0.933</text>
  <text x="856" y="310" text-anchor="middle" class="t m">reusable transport</text>
  <text x="764" y="348" text-anchor="middle" class="t m">Toy numbers illustrate averaging, not measured Qwen values.</text>

  <rect class="panel" x="28" y="390" width="904" height="122" rx="12"/>
  <text x="48" y="418" class="t sh">Scale the same estimator up to the released lens</text>
  <line class="dash" x1="220" y1="438" x2="220" y2="492"/>
  <line class="dash" x1="408" y1="438" x2="408" y2="492"/>
  <line class="dash" x1="596" y1="438" x2="596" y2="492"/>
  <line class="dash" x1="784" y1="438" x2="784" y2="492"/>

  <text x="126" y="458" text-anchor="middle" class="t sh accent">24 passages</text>
  <text x="126" y="478" text-anchor="middle" class="t m">sample contexts</text>
  <text x="314" y="458" text-anchor="middle" class="t sh accent">&lt;= 128 tokens</text>
  <text x="314" y="478" text-anchor="middle" class="t m">many correlated (t,t') pairs</text>
  <text x="502" y="458" text-anchor="middle" class="t sh accent">d = 4,096</text>
  <text x="502" y="478" text-anchor="middle" class="t m">16.8M entries per matrix</text>
  <text x="690" y="458" text-anchor="middle" class="t sh accent">60 layers</text>
  <text x="690" y="478" text-anchor="middle" class="t m">one averaged Jhat per layer</text>
  <text x="858" y="458" text-anchor="middle" class="t sh green">running mean</text>
  <text x="858" y="478" text-anchor="middle" class="t m">checkpointed after prompts</text>
  <text x="480" y="502" text-anchor="middle" class="t m">More prompts reduce corpus-sampling noise; more token pairs inside one passage do not create more independent passages.</text>
</svg>
