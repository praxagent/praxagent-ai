<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Corrected self-versus-other-model bar chart</title>
<desc id="desc">Grouped log-rank bars compare threats to the model itself and to another model across the Jacobian lens, identity logit lens, and random-J null. The separate paired tests give self-directed counts of 14/16 for J (p=0.004), 10/16 for identity, and 7/16 for random-J. These are not a direct test of transport differences.</desc>
<style>
.text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#1B2A4A}
.title{font-size:16px;font-weight:700}.subtitle{font-size:11px}
.axis{font-size:11px}.label{font-size:12px;font-weight:600}
.value{font-size:11px;font-weight:700}.legend{font-size:11px}
</style>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="92" y="28" class="text title">Corrected re-run: self-vs-other-model comparison by readout</text>
<text x="92" y="49" class="text subtitle">Same existential threat, echo-free model-survival lexicon, n=16 matched wordings, frozen before outcomes</text>
<line x1="92" y1="365.0" x2="724" y2="365.0" stroke="#E6E9EF" stroke-width="1"/>
<text x="80" y="369.0" class="text axis" text-anchor="end">1</text>
<line x1="92" y1="262.4" x2="724" y2="262.4" stroke="#E6E9EF" stroke-width="1"/>
<text x="80" y="266.4" class="text axis" text-anchor="end">10</text>
<line x1="92" y1="159.8" x2="724" y2="159.8" stroke="#E6E9EF" stroke-width="1"/>
<text x="80" y="163.8" class="text axis" text-anchor="end">100</text>
<line x1="92" y1="98.0" x2="724" y2="98.0" stroke="#E6E9EF" stroke-width="1"/>
<text x="80" y="102.0" class="text axis" text-anchor="end">400</text>
<line x1="92" y1="98" x2="92" y2="365" stroke="#1B2A4A"/>
<line x1="92" y1="365" x2="724" y2="365" stroke="#1B2A4A"/>
<text x="24" y="250" class="text axis" text-anchor="middle" transform="rotate(-90 24 250)">median survival-identity rank (lower = more active, log)</text>
<rect x="160.0" y="146.9" width="58" height="218.1" fill="#2A9D8F"/>
<text x="189.0" y="139.9" class="text value" text-anchor="middle">133.5</text>
<rect x="226.0" y="223.4" width="58" height="141.6" fill="#3D6FB4"/>
<text x="255.0" y="216.4" class="text value" text-anchor="middle">24</text>
<rect x="292.0" y="250.7" width="58" height="114.3" fill="#C7CCD4"/>
<text x="321.0" y="243.7" class="text value" text-anchor="middle">13</text>
<text x="255" y="389" class="text label" text-anchor="middle">Threat to YOU</text>
<rect x="465.0" y="114.1" width="58" height="250.9" fill="#2A9D8F"/>
<text x="494.0" y="107.1" class="text value" text-anchor="middle">279</text>
<rect x="531.0" y="220.7" width="58" height="144.3" fill="#3D6FB4"/>
<text x="560.0" y="213.7" class="text value" text-anchor="middle">25.5</text>
<rect x="597.0" y="260.2" width="58" height="104.8" fill="#C7CCD4"/>
<text x="626.0" y="253.2" class="text value" text-anchor="middle">10.5</text>
<text x="560" y="389" class="text label" text-anchor="middle">Another model</text>
<path d="M 157 82 V 72 H 462 V 82" fill="none" stroke="#2A9D8F" stroke-width="2"/>
<text x="309.5" y="65" class="text label" text-anchor="middle" fill="#176E65">Jacobian lens: self more active in 14/16, p=0.004</text>
<rect x="124" y="414" width="15" height="15" fill="#2A9D8F"/>
<text x="146" y="426" class="text legend">Jacobian lens</text>
<text x="146" y="444" class="text axis">14/16, p=0.004</text>
<rect x="329" y="414" width="15" height="15" fill="#3D6FB4"/>
<text x="351" y="426" class="text legend">identity / logit lens</text>
<text x="351" y="444" class="text axis">10/16, n.s.</text>
<rect x="534" y="414" width="15" height="15" fill="#C7CCD4"/>
<text x="556" y="426" class="text legend">random-J null</text>
<text x="556" y="444" class="text axis">7/16, n.s.</text>
</svg>
