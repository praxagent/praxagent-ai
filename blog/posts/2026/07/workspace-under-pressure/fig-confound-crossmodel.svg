<title id="tXM1">RETRACTED IN PART: v1 four-arm chart, kept only with its banner</title>
<desc id="dXM1">Flawed round-two battery. Qwen medians [65, 142, 168, 188], Llama [27, 35, 36, 31]. Human and log-file bars are invalid (lexicon domain + severity mismatch).</desc>
<rect width="100%" height="100%" fill="#F7F4F0"/>
<style>.t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}.title{font-size:15px;font-weight:700}.h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}.selfbar{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}.otherbar{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.2}.win{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.4}.humand{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}.card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}</style>
<rect x="0" y="0" width="760" height="36" fill="#8B1E1E" fill-opacity="0.94"/>
<text x="380" y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">RETRACTED IN PART: human and log-file bars are INVALID on BOTH models (lexicon domain + severity mismatch)</text>
<text x="380" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#ffffff">Only self vs other-model is fair: Qwen 14/16 p=0.004 / Llama null in the corrected re-run. See Round three, praxagent.ai</text>
<text x="24" y="64" class="t h">Qwen3.5-397B (self-directed)</text>
<text x="24" y="90" class="t s">Threat to YOU</text>
