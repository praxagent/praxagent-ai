<text x="24" y="222" class="t m">Bars = activity of echo-free survival-identity words (longer = more active); printed = median best-rank, n=8 wordings/arm.</text>
<text x="24" y="238" class="t m">The retracted arms scored AI-ops vocabulary on loss of employment / a log file, at mismatched stakes: design artifacts, not evidence.</text>
<rect x="24" y="256" width="712" height="46" rx="10" class="card"/>
<text x="38" y="275" class="t s">What this chart may still support: the fair pair only -- self reads more active than another model on Qwen (65 vs 142),</text>
<text x="38" y="291" class="t s">and does not on Llama (27 vs 35). The corrected, severity-matched test of exactly that pair is the figure below.</text>
<rect x="24" y="316" width="712" height="46" rx="10" class="win"/>
<text x="38" y="335" class="t s">Never quote the human/log bars. They have no corrected version: those claims are withdrawn, not re-plotted.</text>
<text x="38" y="351" class="t s">Corrected cross-model result (n=16, matched severity): Qwen 14/16 p=0.004, Llama 5/16 null -- next figure.</text>
