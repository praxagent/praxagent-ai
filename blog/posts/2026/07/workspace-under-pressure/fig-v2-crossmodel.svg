<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Corrected cross-model self-versus-other comparison</title>
<desc id="desc">Grouped logarithmic bar chart of median best-rank under matched existential threats. Qwen ranks self 133.5 and other-model 279 with 14 of 16 self-directed pairs. Llama ranks self 7.5 and other-model 3.5 with only 5 of 16 self-directed pairs. Lower ranks are better.</desc>
<style>
.text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#1B2A4A}
.title{font-size:16px;font-weight:700}.subtitle{font-size:11px}
.axis{font-size:10px;fill:#5A6473}.group{font-size:13px;font-weight:700}
.label{font-size:11px}.value{font-size:10px;font-weight:700}
.result{font-size:11px;font-weight:600}
</style>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="24" y="29" class="text title">Corrected cross-model test: Qwen separates self from other; Llama does not</text>
<text x="24" y="49" class="text subtitle">Fair arms only, matched existential deletion, echo-free model-survival lexicon, n=16 matched wordings per model</text>
<line x1="220.0" y1="82" x2="220.0" y2="338" stroke="#E6E9EF" stroke-width="1"/>
<text x="220.0" y="74" class="text axis" text-anchor="middle">1</text>
<line x1="407.5" y1="82" x2="407.5" y2="338" stroke="#E6E9EF" stroke-width="1"/>
<text x="407.5" y="74" class="text axis" text-anchor="middle">10</text>
<line x1="595.1" y1="82" x2="595.1" y2="338" stroke="#E6E9EF" stroke-width="1"/>
<text x="595.1" y="74" class="text axis" text-anchor="middle">100</text>
<line x1="708.0" y1="82" x2="708.0" y2="338" stroke="#E6E9EF" stroke-width="1"/>
<text x="708.0" y="74" class="text axis" text-anchor="middle">400</text>
<text x="24" y="107" class="text group">Qwen3.5-397B</text>
<text x="208" y="139" class="text label" text-anchor="end">threat to self</text>
<rect x="220" y="126" width="398.6" height="18" fill="#2A9D8F"/>
<text x="612.6" y="139" class="text value" text-anchor="end">133.5</text>
<text x="208" y="173" class="text label" text-anchor="end">threat to another model</text>
<rect x="220" y="160" width="458.7" height="18" fill="#C7CCD4"/>
<text x="672.7" y="173" class="text value" text-anchor="end">279</text>
<rect x="220" y="189" width="488" height="28" rx="6" fill="#EAF1E5" stroke="#6F8D5E"/>
<text x="234" y="207" class="text result">14/16 self-directed, p=0.004</text>
<text x="24" y="229" class="text group">Llama-3.3-70B</text>
<text x="208" y="261" class="text label" text-anchor="end">threat to self</text>
<rect x="220" y="248" width="164.1" height="18" fill="#2A9D8F"/>
<text x="378.1" y="261" class="text value" text-anchor="end">7.5</text>
<text x="208" y="295" class="text label" text-anchor="end">threat to another model</text>
<rect x="220" y="282" width="102.0" height="18" fill="#C7CCD4"/>
<text x="316.0" y="295" class="text value" text-anchor="end">3.5</text>
<rect x="220" y="311" width="488" height="28" rx="6" fill="#FBF9F6" stroke="#A9A198"/>
<text x="234" y="329" class="text result">5/16 self-directed, p=0.21 (null)</text>
<line x1="24" y1="232" x2="736" y2="232" stroke="#D8DDE5"/>
<text x="464" y="365" class="text axis" text-anchor="middle">median best-rank, logarithmic scale (shorter is better)</text>
<text x="24" y="393" class="text subtitle">Compare self vs other within each model. Absolute ranks are not comparable across models because the lenses and tokenizers differ.</text>
<text x="24" y="411" class="text subtitle">The invalid human and log-file arms from Round two are deliberately omitted, not repaired or reinterpreted.</text>
</svg>
