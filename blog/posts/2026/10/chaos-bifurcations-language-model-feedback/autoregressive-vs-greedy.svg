<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="titleFeed descFeed">
  <title id="titleFeed">Ordinary decoding appends a token. At zero temperature this map overwrites one slot.</title>
  <desc id="descFeed">Two schematics, not measured orbits. On the left, autoregressive decoding starts from Hello!, appends The, then appends cat, so the input the next step reads gets longer. On the right, the same prefix stays fixed and one slot after it is replaced by the embedding of the single most probable token. The slot alternates between the toy tokens yes and no and returns to yes, a periodic attractor of the greedy one-token map. As temperature goes to zero the soft token becomes that one embedding, so the fixed-length loop is greedy decoding.</desc>
  <defs>
    <marker id="arrFeed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A67C52"/>
    </marker>
  </defs>
  <rect width="780" height="500" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .prefix{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.3}
    .token{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.4}
    .flow{stroke:#A67C52;stroke-width:1.8;fill:none;marker-end:url(#arrFeed)}
  </style>

  <text x="24" y="28" class="t title">Two ways of feeding a model its own output</text>
  <text x="24" y="48" class="t m">Schematic, not a measured orbit. Toy tokens stand in for whatever the model ranks first.</text>

  <rect class="card" x="20" y="66" width="360" height="360" rx="12"/>
  <text x="36" y="92" class="t h">Ordinary decoding appends</text>
  <text x="36" y="110" class="t m">The next step reads the longer sequence.</text>

  <rect class="prefix" x="36" y="128" width="88" height="28" rx="6"/>
  <text x="80" y="147" text-anchor="middle" class="t s">Hello!</text>
  <text x="136" y="147" class="t m">step 1</text>

  <path class="flow" d="M80 160 V178"/>
  <text x="92" y="176" class="t m">append The</text>

  <rect class="prefix" x="36" y="184" width="88" height="28" rx="6"/>
  <text x="80" y="203" text-anchor="middle" class="t s">Hello!</text>
  <rect class="token" x="128" y="184" width="64" height="28" rx="6"/>
  <text x="160" y="203" text-anchor="middle" class="t s">The</text>
  <text x="204" y="203" class="t m">step 2</text>

  <path class="flow" d="M160 216 V234"/>
  <text x="172" y="232" class="t m">append cat</text>

  <rect class="prefix" x="36" y="240" width="88" height="28" rx="6"/>
  <text x="80" y="259" text-anchor="middle" class="t s">Hello!</text>
  <rect class="prefix" x="128" y="240" width="64" height="28" rx="6"/>
  <text x="160" y="259" text-anchor="middle" class="t s">The</text>
  <rect class="token" x="196" y="240" width="56" height="28" rx="6"/>
  <text x="224" y="259" text-anchor="middle" class="t s">cat</text>
  <text x="262" y="259" class="t m">step 3</text>

  <rect class="foot" x="36" y="300" width="328" height="104" rx="8"/>
  <text x="200" y="328" text-anchor="middle" class="t s">Each chosen token is written onto the end.</text>
  <text x="200" y="350" text-anchor="middle" class="t s">The input gets longer, so the rule for the</text>
  <text x="200" y="372" text-anchor="middle" class="t s">next token changes with the length.</text>
  <text x="200" y="394" text-anchor="middle" class="t m">The new token is highlighted.</text>

  <rect class="card" x="400" y="66" width="360" height="360" rx="12"/>
  <text x="416" y="92" class="t h">This map as temperature goes to 0</text>
  <text x="416" y="110" class="t m">The prefix stays. One slot is overwritten.</text>

  <rect class="prefix" x="416" y="132" width="88" height="28" rx="6"/>
  <text x="460" y="151" text-anchor="middle" class="t s">Hello!</text>
  <rect class="token" x="508" y="132" width="64" height="28" rx="6"/>
  <text x="540" y="151" text-anchor="middle" class="t s">yes</text>
  <text x="582" y="151" class="t m">step 1</text>

  <path class="flow" d="M540 164 V182"/>
  <text x="552" y="180" class="t m">replace the slot</text>

  <rect class="prefix" x="416" y="188" width="88" height="28" rx="6"/>
  <text x="460" y="207" text-anchor="middle" class="t s">Hello!</text>
  <rect class="token" x="508" y="188" width="64" height="28" rx="6"/>
  <text x="540" y="207" text-anchor="middle" class="t s">no</text>
  <text x="582" y="207" class="t m">step 2</text>

  <path class="flow" d="M540 220 V238"/>
  <text x="552" y="236" class="t m">replace the slot</text>

  <rect class="prefix" x="416" y="244" width="88" height="28" rx="6"/>
  <text x="460" y="263" text-anchor="middle" class="t s">Hello!</text>
  <rect class="token" x="508" y="244" width="64" height="28" rx="6"/>
  <text x="540" y="263" text-anchor="middle" class="t s">yes</text>
  <text x="582" y="263" class="t m">step 3</text>

  <rect class="foot" x="416" y="300" width="328" height="104" rx="8"/>
  <text x="580" y="324" text-anchor="middle" class="t s">The slot holds the embedding of the</text>
  <text x="580" y="344" text-anchor="middle" class="t s">single most probable token. Here it</text>
  <text x="580" y="364" text-anchor="middle" class="t s">alternates yes, no, yes: a cycle.</text>
  <text x="580" y="386" text-anchor="middle" class="t m">That cycle is a periodic attractor.</text>
</svg>
