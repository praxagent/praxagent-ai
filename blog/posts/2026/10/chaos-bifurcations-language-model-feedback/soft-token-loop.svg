<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" role="img" aria-labelledby="titleLoop descLoop">
  <title id="titleLoop">The soft-token loop and the two factors of its derivative</title>
  <desc id="descLoop">A fixed chat prompt and one soft token enter a transformer, which has a steering vector added at a middle layer. The transformer's output gives one logit score per vocabulary token; a softmax at temperature T turns the scores into next-token probabilities; the probability-weighted average of all token embeddings, the expected embedding, is fed back as the next soft token at the same position after the same prompt. Below, the derivative of one step is the product of a network factor, the network's Jacobian, and a readout factor, the covariance of token embeddings under the next-token probabilities divided by T, which is large only when several tokens compete. Conceptual diagram; no data.</desc>
  <defs>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A67C52"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}
    .chip{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1}
    .card{fill:#FBF9F6;stroke:#D9D0C4;stroke-width:1.2}
    .hi{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.4}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .flow{stroke:#A67C52;stroke-width:1.6;fill:none}
    .back{stroke:#A67C52;stroke-width:2.2;fill:none}
    .res{stroke:#7F786D;stroke-width:1.2}
    .layer{fill:#FBF9F6;stroke:#4B6787;stroke-width:1}
    .divider{stroke:#A89B8C;stroke-width:1.4;stroke-dasharray:5 4}
  </style>

  <text x="24" y="28" class="t title">The soft-token loop: a language model reading its own expected output</text>
  <text x="24" y="48" class="t m">One fixed prompt and one fed-back soft token at a fixed position: a smooth, deterministic map.</text>

  <!-- feedback path over the top -->
  <path class="back" d="M661,100 L661,80 L84,80 L84,98" marker-end="url(#arrLoop)"/>
  <rect x="206" y="66" width="332" height="18" rx="4" fill="#F7F4F0"/>
  <text x="372" y="79" text-anchor="middle" class="t m" style="fill:#7A5634">fed back as the next soft token, same position, same prompt</text>

  <!-- box 1: input -->
  <rect class="card" x="24" y="100" width="120" height="72" rx="10"/>
  <text x="36" y="119" class="t h">input</text>
  <rect class="chip" x="34" y="127" width="100" height="18" rx="5"/>
  <text x="84" y="140" text-anchor="middle" class="t m">fixed chat prompt</text>
  <rect class="hi" x="34" y="149" width="100" height="18" rx="5"/>
  <text x="84" y="162" text-anchor="middle" class="t m" style="fill:#2C2924">soft token</text>

  <!-- box 2: transformer -->
  <rect class="data" x="166" y="100" width="150" height="72" rx="10"/>
  <text x="178" y="119" class="t h">transformer</text>
  <line class="res" x1="178" y1="148" x2="304" y2="148"/>
  <rect class="layer" x="186" y="139" width="7" height="18" rx="1"/>
  <rect class="layer" x="202" y="139" width="7" height="18" rx="1"/>
  <rect class="layer" x="218" y="139" width="7" height="18" rx="1"/>
  <circle cx="241" cy="148" r="7" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.4"/>
  <line x1="237" y1="148" x2="245" y2="148" stroke="#7A5634" stroke-width="1.4"/>
  <line x1="241" y1="144" x2="241" y2="152" stroke="#7A5634" stroke-width="1.4"/>
  <rect class="layer" x="257" y="139" width="7" height="18" rx="1"/>
  <rect class="layer" x="273" y="139" width="7" height="18" rx="1"/>
  <rect class="layer" x="289" y="139" width="7" height="18" rx="1"/>

  <!-- box 3: logits -->
  <rect class="card" x="338" y="100" width="92" height="72" rx="10"/>
  <text x="350" y="119" class="t h">logits</text>
  <text x="350" y="141" class="t m">one score</text>
  <text x="350" y="155" class="t m">per token</text>

  <!-- box 4: softmax -->
  <rect class="card" x="452" y="100" width="112" height="72" rx="10"/>
  <text x="464" y="119" class="t h">softmax</text>
  <text x="464" y="137" class="t m">at temperature T:</text>
  <text x="464" y="151" class="t m">next-token</text>
  <text x="464" y="165" class="t m">probabilities</text>

  <!-- box 5: expected embedding -->
  <rect class="hi" x="586" y="100" width="150" height="72" rx="10"/>
  <text x="598" y="119" class="t h">expected</text>
  <text x="598" y="134" class="t h">embedding</text>
  <text x="598" y="152" class="t m">weighted average of</text>
  <text x="598" y="165" class="t m">all token embeddings</text>

  <!-- flow arrows -->
  <line class="flow" x1="144" y1="136" x2="164" y2="136" marker-end="url(#arrLoop)"/>
  <line class="flow" x1="316" y1="136" x2="336" y2="136" marker-end="url(#arrLoop)"/>
  <line class="flow" x1="430" y1="136" x2="450" y2="136" marker-end="url(#arrLoop)"/>
  <line class="flow" x1="564" y1="136" x2="584" y2="136" marker-end="url(#arrLoop)"/>

  <!-- explanation row -->
  <text x="166" y="192" class="t m">Steering adds a fixed vector (plus sign) to</text>
  <text x="166" y="206" class="t m">every position at one middle layer.</text>
  <text x="452" y="192" class="t m">Low T sharpens them;</text>
  <text x="452" y="206" class="t m">high T flattens them.</text>
  <text x="586" y="192" class="t m">The average is fed back,</text>
  <text x="586" y="206" class="t m">not one chosen token.</text>

  <line class="divider" x1="24" y1="224" x2="736" y2="224"/>

  <!-- derivative band -->
  <text x="24" y="248" class="t h">How one step stretches a small change: the derivative is a product of two factors</text>

  <rect class="data" x="24" y="260" width="324" height="78" rx="12"/>
  <text x="38" y="282" class="t h">network factor</text>
  <text x="38" y="302" class="t m">How the network's final hidden state responds</text>
  <text x="38" y="316" class="t m">to a small change in the soft token it reads:</text>
  <text x="38" y="330" class="t m">the network's Jacobian.</text>

  <circle cx="380" cy="299" r="17" fill="#FBF9F6" stroke="#C4B8A8" stroke-width="1.2"/>
  <text x="380" y="303" text-anchor="middle" class="t m" style="fill:#2C2924">times</text>

  <rect class="hi" x="412" y="260" width="324" height="78" rx="12"/>
  <text x="426" y="282" class="t h">readout factor</text>
  <text x="426" y="302" class="t m">Covariance of the token embeddings under the</text>
  <text x="426" y="316" class="t m">next-token probabilities, divided by T: large</text>
  <text x="426" y="330" class="t m">only when several different tokens compete.</text>

  <!-- footer takeaway -->
  <rect class="foot" x="24" y="354" width="712" height="34" rx="10"/>
  <text x="380" y="375" text-anchor="middle" class="t s">Chaos needs competing tokens: a spread next-token distribution that the inverse temperature still amplifies.</text>
</svg>
