<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="gainTitle gainDesc">
  <title id="gainTitle">How the spread sets the readout gain: four two-token cases</title>
  <desc id="gainDesc">Four cards at temperature 1. Each shows two tokens as dots sized by probability, the soft token as a diamond at their balance point, and a bar for the gain on a shared scale, with a tick at a gain of 1. (a) Sure: probabilities 0.99 and 0.01, distance 3, spread 0.0891, log gain minus 2.42 nats, so a push shrinks to 9 percent. (b) Leaning: probabilities 0.9 and 0.1, distance 3, spread 0.81, log gain minus 0.21 nats, so a push shrinks to 81 percent. (c) Torn, far apart: probabilities 0.5 and 0.5, distance 3, spread 2.25, log gain plus 0.81 nats, so a push stretches to 225 percent. (d) Torn, close together: probabilities 0.5 and 0.5, distance 0.5, spread 0.0625, log gain minus 2.77 nats, so a push shrinks to 6 percent. Below, a number line of the log gain from minus 3 to plus 1 nats per step places d and a far below zero, b just below zero, and c above zero; zero means a gain of 1, no change. A footer states that a spread is an average of squares and never negative, that only the log gain can fall below zero, which means the push shrinks, and that across the line between the two tokens the spread is 0, so a push in that direction does not move the soft token.</desc>
  <rect width="760" height="456" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .v{font-size:12px;font-weight:700}
    .m{font-size:11px;fill:#5A544C}
    .k{font-size:11px;font-weight:700}
    .shrink{fill:#2F5D8A}
    .stretch{fill:#7A5634}
    .card{fill:#FBF9F6;stroke:#D9D0C4;stroke-width:1.2}
    .tick{stroke:#2C2924;stroke-width:1.2;stroke-dasharray:2 2}
    .seg{stroke:#8A8072;stroke-width:1.4}
    .axis{stroke:#2C2924;stroke-width:1.3}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.2}
  </style>
  <text x="24" y="30" class="t title">How the spread sets the readout gain: four two-token cases</text>
  <text x="24" y="50" class="t m">Toy numbers, T = 1. How far the soft token moves when the network's output changes along the line between two tokens.</text>
  <text x="24" y="67" class="t m">Dots: tokens, sized by probability. Diamond: the soft token, their balance point. Bar: the gain, equal to the spread at T = 1; tick: gain 1.</text>
  <!-- card 1: p = 0.99, distance 3 -->
  <rect class="card" x="16" y="82" width="173" height="190" rx="10"/>
  <text x="28" y="106" class="t h">(a) Sure</text>
  <text x="28" y="124" class="t m">p = 0.99 and 0.01</text>
  <text x="28" y="139" class="t m">distance 3</text>
  <line class="seg" x1="42.5" y1="164" x2="162.5" y2="164"/>
  <circle cx="42.5" cy="164" r="7.5" fill="#2C2924"/>
  <circle cx="162.5" cy="164" r="2.5" fill="#2C2924"/>
  <text x="42.5" y="186" text-anchor="middle" class="t m">0.99</text>
  <text x="162.5" y="186" text-anchor="middle" class="t m">0.01</text>
  <path d="M43.7 159L48.7 164L43.7 169L38.7 164Z" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.3"/>
  <rect x="28" y="198" width="5.3" height="9" rx="2" fill="#2F5D8A"/>
  <line class="tick" x1="88" y1="195" x2="88" y2="210"/>
  <text x="28" y="224" class="t s">spread 0.0891</text>
  <text x="28" y="242" class="t s">log gain &#x2212;2.42 nats</text>
  <text x="28" y="260" class="t v shrink">shrinks a push to 9%</text>
  <!-- card 2: p = 0.9, distance 3 -->
  <rect class="card" x="201" y="82" width="173" height="190" rx="10"/>
  <text x="213" y="106" class="t h">(b) Leaning</text>
  <text x="213" y="124" class="t m">p = 0.9 and 0.1</text>
  <text x="213" y="139" class="t m">distance 3</text>
  <line class="seg" x1="227.5" y1="164" x2="347.5" y2="164"/>
  <circle cx="227.5" cy="164" r="7.2" fill="#2C2924"/>
  <circle cx="347.5" cy="164" r="3.7" fill="#2C2924"/>
  <text x="227.5" y="186" text-anchor="middle" class="t m">0.9</text>
  <text x="347.5" y="186" text-anchor="middle" class="t m">0.1</text>
  <path d="M239.5 159L244.5 164L239.5 169L234.5 164Z" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.3"/>
  <rect x="213" y="198" width="48.6" height="9" rx="2" fill="#2F5D8A"/>
  <line class="tick" x1="273" y1="195" x2="273" y2="210"/>
  <text x="213" y="224" class="t s">spread 0.81</text>
  <text x="213" y="242" class="t s">log gain &#x2212;0.21 nats</text>
  <text x="213" y="260" class="t v shrink">shrinks a push to 81%</text>
  <!-- card 3: p = 0.5, distance 3 -->
  <rect class="card" x="386" y="82" width="173" height="190" rx="10"/>
  <text x="398" y="106" class="t h">(c) Torn, far apart</text>
  <text x="398" y="124" class="t m">p = 0.5 and 0.5</text>
  <text x="398" y="139" class="t m">distance 3</text>
  <line class="seg" x1="412.5" y1="164" x2="532.5" y2="164"/>
  <circle cx="412.5" cy="164" r="5.9" fill="#2C2924"/>
  <circle cx="532.5" cy="164" r="5.9" fill="#2C2924"/>
  <text x="412.5" y="186" text-anchor="middle" class="t m">0.5</text>
  <text x="532.5" y="186" text-anchor="middle" class="t m">0.5</text>
  <path d="M472.5 159L477.5 164L472.5 169L467.5 164Z" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.3"/>
  <rect x="398" y="198" width="135" height="9" rx="2" fill="#7A5634"/>
  <line class="tick" x1="458" y1="195" x2="458" y2="210"/>
  <text x="398" y="224" class="t s">spread 2.25</text>
  <text x="398" y="242" class="t s">log gain +0.81 nats</text>
  <text x="398" y="260" class="t v stretch">stretches a push to 225%</text>
  <!-- card 4: p = 0.5, distance 0.5 -->
  <rect class="card" x="571" y="82" width="173" height="190" rx="10"/>
  <text x="583" y="106" class="t h">(d) Torn, close together</text>
  <text x="583" y="124" class="t m">p = 0.5 and 0.5</text>
  <text x="583" y="139" class="t m">distance 0.5</text>
  <line class="seg" x1="647.5" y1="164" x2="667.5" y2="164"/>
  <circle cx="647.5" cy="164" r="5.9" fill="#2C2924"/>
  <circle cx="667.5" cy="164" r="5.9" fill="#2C2924"/>
  <text x="657.5" y="186" text-anchor="middle" class="t m">0.5 and 0.5</text>
  <path d="M657.5 159L662.5 164L657.5 169L652.5 164Z" fill="#A67C52" stroke="#FBF9F6" stroke-width="1.3"/>
  <rect x="583" y="198" width="3.8" height="9" rx="2" fill="#2F5D8A"/>
  <line class="tick" x1="643" y1="195" x2="643" y2="210"/>
  <text x="583" y="224" class="t s">spread 0.0625</text>
  <text x="583" y="242" class="t s">log gain &#x2212;2.77 nats</text>
  <text x="583" y="260" class="t v shrink">shrinks a push to 6%</text>
  <text x="24" y="298" class="t k">The same four cases on the log scale that this note uses for growth per step, in nats</text>
  <rect x="70" y="322" width="465" height="14" fill="#E8F0F7"/>
  <rect x="535" y="322" width="155" height="14" fill="#F3E8E0"/>
  <line class="axis" x1="70" y1="336" x2="690" y2="336"/>
  <line class="axis" x1="70" y1="336" x2="70" y2="341"/>
  <text x="70" y="354" text-anchor="middle" class="t m">&#x2212;3</text>
  <line class="axis" x1="225" y1="336" x2="225" y2="341"/>
  <text x="225" y="354" text-anchor="middle" class="t m">&#x2212;2</text>
  <line class="axis" x1="380" y1="336" x2="380" y2="341"/>
  <text x="380" y="354" text-anchor="middle" class="t m">&#x2212;1</text>
  <line class="axis" x1="535" y1="336" x2="535" y2="341"/>
  <text x="535" y="354" text-anchor="middle" class="t m">0 (gain 1)</text>
  <line class="axis" x1="690" y1="336" x2="690" y2="341"/>
  <text x="690" y="354" text-anchor="middle" class="t m">+1</text>
  <circle cx="160.2" cy="336" r="5" fill="#2F5D8A" stroke="#FBF9F6" stroke-width="1.2"/>
  <text x="160.2" y="316" text-anchor="middle" class="t k">a</text>
  <circle cx="502.3" cy="336" r="5" fill="#2F5D8A" stroke="#FBF9F6" stroke-width="1.2"/>
  <text x="502.3" y="316" text-anchor="middle" class="t k">b</text>
  <circle cx="660.7" cy="336" r="5" fill="#7A5634" stroke="#FBF9F6" stroke-width="1.2"/>
  <text x="660.7" y="316" text-anchor="middle" class="t k">c</text>
  <circle cx="105.2" cy="336" r="5" fill="#2F5D8A" stroke="#FBF9F6" stroke-width="1.2"/>
  <text x="105.2" y="316" text-anchor="middle" class="t k">d</text>
  <text x="70" y="372" class="t m">below 0: the readout shrinks a push</text>
  <text x="690" y="372" text-anchor="end" class="t m">above 0: it stretches a push</text>
  <rect class="foot" x="24" y="384" width="712" height="56" rx="8"/>
  <text x="380" y="406" text-anchor="middle" class="t s">A spread is an average of squares, so it is never negative. Only the log gain can fall below zero, and then the push shrinks.</text>
  <text x="380" y="426" text-anchor="middle" class="t s">Across the line between the two tokens the spread is 0: a push in that direction does not move the soft token.</text>
</svg>
