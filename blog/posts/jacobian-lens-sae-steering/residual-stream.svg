<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="titleRes descRes">
  <title id="titleRes">The residual stream is the model's running workspace</title>
  <desc id="descRes">One vector per token position flows through the transformer. Every block reads it and adds its contribution back. h at layer l is a snapshot of that vector right after block l.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .stream{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}
    .blk{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}
    .chip{fill:#EDE8E1;stroke:#7F786D;stroke-width:1}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    .arrow{stroke:#A67C52;stroke-width:1.6;fill:none}
    .snap{stroke:#A67C52;stroke-width:1.6;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#A67C52"/>
    </marker>
  </defs>

  <text x="24" y="28" class="t title">The residual stream is the model's running workspace</text>
  <text x="24" y="48" class="t m">One vector of d numbers per token position flows left to right. Every block reads it, computes, and adds its result back in.</text>

  <!-- blocks above the stream -->
  <rect class="blk" x="130" y="78" width="100" height="38" rx="8"/>
  <text x="180" y="102" text-anchor="middle" class="t s">block 1</text>
  <rect class="blk" x="270" y="78" width="100" height="38" rx="8"/>
  <text x="320" y="102" text-anchor="middle" class="t s">block 2</text>
  <text x="410" y="102" class="t m">...</text>
  <rect class="blk" x="450" y="78" width="100" height="38" rx="8"/>
  <text x="500" y="102" text-anchor="middle" class="t s">block l</text>
  <text x="578" y="102" class="t m">...</text>

  <!-- read / add-back arrows -->
  <path class="arrow" d="M150,166 L150,122" marker-end="url(#ahr)"/>
  <path class="arrow" d="M210,120 L210,164" marker-end="url(#ahr)"/>
  <text x="142" y="146" text-anchor="end" class="t m">reads</text>
  <text x="218" y="146" class="t m">adds back</text>

  <path class="arrow" d="M290,166 L290,122" marker-end="url(#ahr)"/>
  <path class="arrow" d="M350,120 L350,164" marker-end="url(#ahr)"/>

  <path class="arrow" d="M470,166 L470,122" marker-end="url(#ahr)"/>
  <path class="arrow" d="M530,120 L530,164" marker-end="url(#ahr)"/>

  <!-- the stream band -->
  <rect class="stream" x="90" y="170" width="540" height="34" rx="8"/>
  <polygon points="630,164 664,187 630,210" fill="#E8F0F7" stroke="#4B6787" stroke-width="1.4"/>
  <text x="360" y="191" text-anchor="middle" class="t s">residual stream: one running vector of d numbers</text>

  <!-- in / out chips -->
  <rect class="chip" x="16" y="172" width="66" height="30" rx="7"/>
  <text x="49" y="191" text-anchor="middle" class="t m">text in</text>
  <rect class="chip" x="674" y="172" width="74" height="30" rx="7"/>
  <text x="711" y="191" text-anchor="middle" class="t m">words out</text>

  <!-- snapshot marker -->
  <line class="snap" x1="562" y1="142" x2="562" y2="222"/>
  <text x="562" y="240" text-anchor="middle" class="t m">h at layer l: the stream's contents right after block l</text>

  <!-- Footer -->
  <rect class="foot" x="24" y="258" width="712" height="48" rx="10"/>
  <text x="40" y="278" class="t s">Nothing else passes between blocks, so whatever the model has worked out lives in those d numbers.</text>
  <text x="40" y="296" class="t s">SAE steering writes into this workspace by hand: it adds a chosen vector to the stream between blocks.</text>
</svg>
