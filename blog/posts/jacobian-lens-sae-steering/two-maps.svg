<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title2m desc2m">
  <title id="title2m">Two public maps on Llama 3.3 70B</title>
  <desc id="desc2m">A Goodfire SAE decoder direction is added at layer 50; a Neuronpedia Jacobian lens transports residual directions toward vocabulary dispositions.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .a{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
    .b{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .c{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
    .arrow{stroke:#5A544C;stroke-width:2;fill:none;marker-end:url(#arr)}
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A544C"/>
    </marker>
  </defs>
  <text x="24" y="28" class="t h">Two public maps, one forensic question</text>
  <text x="24" y="48" class="t m">Can the second instrument audit the first on pinned open weights?</text>

  <rect class="a" x="24" y="72" width="210" height="150" rx="10"/>
  <text x="129" y="100" text-anchor="middle" class="t h">Goodfire SAE</text>
  <text x="129" y="124" text-anchor="middle" class="t s">layer 50 residual</text>
  <text x="129" y="146" text-anchor="middle" class="t m">feature ID -&gt; decoder d_i</text>
  <text x="129" y="168" text-anchor="middle" class="t m">edit: h' = h + a * d_i</text>
  <text x="129" y="196" text-anchor="middle" class="t m">labels are suggestive</text>

  <path class="arrow" d="M246 147 H284"/>

  <rect class="b" x="296" y="72" width="210" height="150" rx="10"/>
  <text x="401" y="100" text-anchor="middle" class="t h">Jacobian lens</text>
  <text x="401" y="124" text-anchor="middle" class="t s">Neuronpedia WikiText J</text>
  <text x="401" y="146" text-anchor="middle" class="t m">corpus-averaged transport</text>
  <text x="401" y="168" text-anchor="middle" class="t m">z = W_U N_f (J h)</text>
  <text x="401" y="196" text-anchor="middle" class="t m">single-token dispositions</text>

  <path class="arrow" d="M518 147 H556"/>

  <rect class="c" x="568" y="72" width="168" height="150" rx="10"/>
  <text x="652" y="100" text-anchor="middle" class="t h">Audit?</text>
  <text x="652" y="128" text-anchor="middle" class="t s">state-only: no</text>
  <text x="652" y="152" text-anchor="middle" class="t s">paired delta: yes</text>
  <text x="652" y="182" text-anchor="middle" class="t m">not provenance</text>
  <text x="652" y="204" text-anchor="middle" class="t m">not consciousness</text>
</svg>
