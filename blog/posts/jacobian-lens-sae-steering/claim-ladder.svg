<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="titleCl descCl">
  <title id="titleCl">Claim ladder for this note</title>
  <desc id="descCl">Rungs climb from public artifacts through fingerprinting to monitoring; consciousness and provenance sit off the ladder.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .r1{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.4}
    .r2{fill:#E3EBEF;stroke:#4B6787;stroke-width:1.4}
    .r3{fill:#D9E4EC;stroke:#4B6787;stroke-width:1.4}
    .r4{fill:#CFE0EA;stroke:#4B6787;stroke-width:1.4}
    .off{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5;stroke-dasharray:5 4}
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .h{font-size:13px;font-weight:700}.s{font-size:12px}.m{font-size:11px;fill:#5A544C}
  </style>
  <text x="24" y="28" class="t h">What this experiment can support</text>
  <text x="24" y="48" class="t m">Climb the rungs carefully. The dashed boxes are not on the ladder.</text>

  <rect class="r1" x="24" y="230" width="460" height="44" rx="8"/>
  <text x="40" y="257" class="t s">1. Public SAE edit + public J transport on pinned Llama 70B</text>

  <rect class="r2" x="24" y="176" width="460" height="44" rx="8"/>
  <text x="40" y="203" class="t s">2. Suggestive lexical fingerprints for 5/6 labeled targets</text>

  <rect class="r3" x="24" y="122" width="460" height="44" rx="8"/>
  <text x="40" y="149" class="t s">3. State-only attribution fails under holdouts and random-J</text>

  <rect class="r4" x="24" y="68" width="460" height="44" rx="8"/>
  <text x="40" y="95" class="t s">4. Paired clean-reference differential useful for monitoring</text>

  <rect class="off" x="520" y="90" width="216" height="70" rx="10"/>
  <text x="628" y="118" text-anchor="middle" class="t h">Not claimed</text>
  <text x="628" y="140" text-anchor="middle" class="t m">provenance forensics</text>

  <rect class="off" x="520" y="180" width="216" height="70" rx="10"/>
  <text x="628" y="208" text-anchor="middle" class="t h">Not claimed</text>
  <text x="628" y="230" text-anchor="middle" class="t m">belief / consciousness</text>
</svg>
