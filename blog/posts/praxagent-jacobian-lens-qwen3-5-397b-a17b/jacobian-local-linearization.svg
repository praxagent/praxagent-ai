<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="localTitle localDesc">
  <title id="localTitle">Residual vectors and their local Jacobian map</title>
  <desc id="localDesc">A source residual vector h at layer ell and token position t flows through the remaining transformer layers and can affect final-layer residuals at the same or later positions. One target position t prime is selected. The lower panel shows the local linearization: a perturbation delta h at the source is multiplied by a d by d Jacobian matrix to produce the first-order perturbation at the target.</desc>
  <rect width="100%" height="100%" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .h{font-size:19px;font-weight:700}
    .sh{font-size:15px;font-weight:700}
    .s{font-size:13px}
    .m{font-size:12px;fill:#5A544C}
    .tiny{font-size:11px;fill:#5A544C}
    .box{fill:#FFFFFF;stroke:#A89B8C;stroke-width:1.4}
    .source{fill:#DCE9F5;stroke:#4B6787;stroke-width:2}
    .target{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:2}
    .stack{fill:#EDE8E1;stroke:#7F786D;stroke-width:1.5}
    .math{fill:#FFFFFF;stroke:#4B6787;stroke-width:1.7}
    .matrix{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.7}
    .arrow{stroke:#7F786D;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .causal{stroke:#4B6787;stroke-width:1.7;fill:none;opacity:.55;marker-end:url(#arrowBlue)}
    .blocked{stroke:#B8B0A4;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
    .divider{stroke:#B8B0A4;stroke-width:1.2}
    .blue{fill:#35597B}
    .green{fill:#587447}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7F786D"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4B6787"/>
    </marker>
  </defs>

  <text x="28" y="32" class="t h">One source residual, one causally reachable target</text>
  <text x="28" y="54" class="t m">Each token position carries its own d-dimensional residual vector at every layer.</text>

  <!-- Source layer -->
  <text x="34" y="104" class="t sh">Layer <tspan font-style="italic">&#x2113;</tspan></text>
  <text x="34" y="124" class="t m">intermediate residual stream</text>

  <rect class="box" x="210" y="80" width="110" height="72" rx="8"/>
  <text x="265" y="107" text-anchor="middle" class="t s">position t-1</text>
  <text x="265" y="131" text-anchor="middle" class="t m" font-style="italic">h<tspan baseline-shift="sub" font-size="9">&#x2113;,t-1</tspan></text>

  <rect class="source" x="340" y="72" width="140" height="88" rx="9"/>
  <text x="410" y="101" text-anchor="middle" class="t sh blue">source position t</text>
  <text x="410" y="126" text-anchor="middle" class="t s" font-style="italic">h<tspan baseline-shift="sub" font-size="10">&#x2113;,t</tspan><tspan font-style="normal"> &#x2208; </tspan>&#x211D;<tspan baseline-shift="super" font-size="10">d</tspan></text>
  <text x="410" y="147" text-anchor="middle" class="t tiny">selected vector</text>

  <rect class="box" x="500" y="80" width="110" height="72" rx="8"/>
  <text x="555" y="107" text-anchor="middle" class="t s">position t+1</text>
  <text x="555" y="131" text-anchor="middle" class="t m" font-style="italic">h<tspan baseline-shift="sub" font-size="9">&#x2113;,t+1</tspan></text>

  <text x="640" y="122" text-anchor="middle" class="t h">...</text>

  <rect class="box" x="680" y="80" width="110" height="72" rx="8"/>
  <text x="735" y="107" text-anchor="middle" class="t s">position t&#x2032;</text>
  <text x="735" y="131" text-anchor="middle" class="t m" font-style="italic">h<tspan baseline-shift="sub" font-size="9">&#x2113;,t&#x2032;</tspan></text>

  <!-- Downstream stack -->
  <path class="causal" d="M410 161 C420 190 470 195 520 223"/>
  <path class="causal" d="M410 161 C470 188 610 192 690 223"/>
  <path class="causal" d="M410 161 C520 180 760 190 820 223"/>
  <path class="blocked" d="M410 161 C380 188 300 195 250 220"/>
  <text x="262" y="194" class="t tiny">no effect on earlier positions</text>

  <rect class="stack" x="210" y="218" width="620" height="72" rx="10"/>
  <text x="520" y="247" text-anchor="middle" class="t sh">remaining transformer layers <tspan font-style="italic">&#x2113;+1, ..., L</tspan></text>
  <text x="520" y="270" text-anchor="middle" class="t m">attention and MLP updates propagate the source perturbation forward</text>

  <!-- Final layer -->
  <text x="34" y="332" class="t sh">Layer L</text>
  <text x="34" y="352" class="t m">final residual stream</text>

  <rect class="box" x="210" y="310" width="110" height="72" rx="8"/>
  <text x="265" y="337" text-anchor="middle" class="t s">position t-1</text>
  <text x="265" y="361" text-anchor="middle" class="t m">unreachable</text>

  <rect class="box" x="340" y="310" width="110" height="72" rx="8"/>
  <text x="395" y="337" text-anchor="middle" class="t s">position t</text>
  <text x="395" y="361" text-anchor="middle" class="t m" font-style="italic">h<tspan baseline-shift="sub" font-size="9">L,t</tspan></text>

  <rect class="box" x="500" y="310" width="110" height="72" rx="8"/>
  <text x="555" y="337" text-anchor="middle" class="t s">position t+1</text>
  <text x="555" y="361" text-anchor="middle" class="t m" font-style="italic">h<tspan baseline-shift="sub" font-size="9">L,t+1</tspan></text>

  <text x="640" y="352" text-anchor="middle" class="t h">...</text>

  <rect class="target" x="680" y="302" width="170" height="88" rx="9"/>
  <text x="765" y="331" text-anchor="middle" class="t sh green">target position t&#x2032;</text>
  <text x="765" y="356" text-anchor="middle" class="t s" font-style="italic">h<tspan baseline-shift="sub" font-size="10">L,t&#x2032;</tspan><tspan font-style="normal"> &#x2208; </tspan>&#x211D;<tspan baseline-shift="super" font-size="10">d</tspan></text>
  <text x="765" y="377" text-anchor="middle" class="t tiny">selected final vector</text>

  <line class="divider" x1="28" y1="414" x2="932" y2="414"/>

  <!-- Tangent-space picture -->
  <text x="28" y="444" class="t sh">Local linearization around this forward pass</text>

  <rect class="math" x="250" y="432" width="150" height="64" rx="9"/>
  <text x="325" y="458" text-anchor="middle" class="t sh blue" font-style="italic">&#x3B4;h<tspan baseline-shift="sub" font-size="10">&#x2113;,t</tspan></text>
  <text x="325" y="480" text-anchor="middle" class="t m">source perturbation in &#x211D;<tspan baseline-shift="super" font-size="9">d</tspan></text>

  <path class="arrow" d="M405 464 H445"/>

  <rect class="matrix" x="450" y="424" width="220" height="80" rx="9"/>
  <text x="560" y="451" text-anchor="middle" class="t sh blue" font-style="italic">A<tspan baseline-shift="super" font-size="10">(&#x2113;)</tspan><tspan baseline-shift="sub" font-size="10">x,t&#x2032;,t</tspan></text>
  <text x="560" y="474" text-anchor="middle" class="t s" font-style="italic">= &#x2202;h<tspan baseline-shift="sub" font-size="9">L,t&#x2032;</tspan> / &#x2202;h<tspan baseline-shift="sub" font-size="9">&#x2113;,t</tspan></text>
  <text x="560" y="493" text-anchor="middle" class="t m">d &#xD7; d local Jacobian</text>

  <path class="arrow" d="M675 464 H715"/>

  <rect class="math" x="720" y="432" width="190" height="64" rx="9"/>
  <text x="815" y="458" text-anchor="middle" class="t sh green" font-style="italic">&#x3B4;h<tspan baseline-shift="sub" font-size="10">L,t&#x2032;</tspan></text>
  <text x="815" y="480" text-anchor="middle" class="t m">&#x2248; A &#x3B4;h</text>
</svg>
