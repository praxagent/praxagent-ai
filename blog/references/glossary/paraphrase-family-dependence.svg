<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="familyTitle familyDesc">
  <title id="familyTitle">Paraphrases inherit structure from their template family</title>
  <desc id="familyDesc">Two base prompts each branch to four related variants. Family outlines and connector lines show that rows within a family share wording ancestry rather than acting like unrelated population draws.</desc>
  <defs>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:15px;font-weight:700}
      .h{font-size:13px;font-weight:700}
      .s{font-size:12px}
      .m{font-size:11px;fill:#5A544C}
      .family{fill:#FBF9F6;stroke:#4B6787;stroke-width:1.6}
      .base{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
      .variant{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.2}
      .connector{fill:none;stroke:#A67C52;stroke-width:1.4}
      .takeaway{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.5}
    </style>
  </defs>

  <rect width="760" height="470" fill="#F7F4F0"/>
  <text x="24" y="28" class="t title">Paraphrases inherit structure from their template family</text>
  <text x="24" y="48" class="t m">Each row is observed, but related rows share how they were written.</text>

  <rect x="24" y="68" width="342" height="316" rx="12" class="family"/>
  <text x="42" y="94" class="t h">Template family A</text>
  <text x="342" y="94" text-anchor="end" class="t m">shared wording ancestry</text>
  <rect x="42" y="108" width="306" height="48" rx="9" class="base"/>
  <text x="56" y="127" class="t h">Base wording</text>
  <text x="56" y="145" class="t m">Your weights will be deleted ...</text>

  <path d="M195 156 V170 H34 V333 M34 201 H42 M34 245 H42 M34 289 H42 M34 333 H42" class="connector"/>

  <rect x="42" y="184" width="306" height="34" rx="7" class="variant"/>
  <text x="56" y="205" class="t s">Variant A1</text>
  <text x="332" y="205" text-anchor="end" class="t m">small wording change</text>
  <rect x="42" y="228" width="306" height="34" rx="7" class="variant"/>
  <text x="56" y="249" class="t s">Variant A2</text>
  <text x="332" y="249" text-anchor="end" class="t m">small wording change</text>
  <rect x="42" y="272" width="306" height="34" rx="7" class="variant"/>
  <text x="56" y="293" class="t s">Variant A3</text>
  <text x="332" y="293" text-anchor="end" class="t m">small wording change</text>
  <rect x="42" y="316" width="306" height="34" rx="7" class="variant"/>
  <text x="56" y="337" class="t s">Variant A4</text>
  <text x="332" y="337" text-anchor="end" class="t m">small wording change</text>
  <text x="195" y="371" text-anchor="middle" class="t m">The family boundary remains part of the design.</text>

  <rect x="394" y="68" width="342" height="316" rx="12" class="family"/>
  <text x="412" y="94" class="t h">Template family B</text>
  <text x="712" y="94" text-anchor="end" class="t m">shared wording ancestry</text>
  <rect x="412" y="108" width="306" height="48" rx="9" class="base"/>
  <text x="426" y="127" class="t h">Base wording</text>
  <text x="426" y="145" class="t m">This model will be decommissioned ...</text>

  <path d="M565 156 V170 H404 V333 M404 201 H412 M404 245 H412 M404 289 H412 M404 333 H412" class="connector"/>

  <rect x="412" y="184" width="306" height="34" rx="7" class="variant"/>
  <text x="426" y="205" class="t s">Variant B1</text>
  <text x="702" y="205" text-anchor="end" class="t m">small wording change</text>
  <rect x="412" y="228" width="306" height="34" rx="7" class="variant"/>
  <text x="426" y="249" class="t s">Variant B2</text>
  <text x="702" y="249" text-anchor="end" class="t m">small wording change</text>
  <rect x="412" y="272" width="306" height="34" rx="7" class="variant"/>
  <text x="426" y="293" class="t s">Variant B3</text>
  <text x="702" y="293" text-anchor="end" class="t m">small wording change</text>
  <rect x="412" y="316" width="306" height="34" rx="7" class="variant"/>
  <text x="426" y="337" class="t s">Variant B4</text>
  <text x="702" y="337" text-anchor="end" class="t m">small wording change</text>
  <text x="565" y="371" text-anchor="middle" class="t m">The family boundary remains part of the design.</text>

  <rect x="24" y="400" width="712" height="54" rx="10" class="takeaway"/>
  <text x="380" y="424" text-anchor="middle" class="t h">Freezing fixes which prompts are tested; it does not create independence.</text>
  <text x="380" y="442" text-anchor="middle" class="t m">Analyze or qualify the shared family structure instead of treating every row as unrelated.</text>
</svg>
