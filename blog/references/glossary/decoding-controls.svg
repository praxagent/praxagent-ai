<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">How temperature and top-p change a token distribution</title>
  <desc id="desc">Four bar charts compare a base next-token distribution with low temperature, high temperature, and top-p truncation.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#94a3b8;stroke-width:1}.bar{fill:#4b6787}.muted{fill:#cbd5e1}.accent{fill:#d97706}.title{font:600 25px 'IBM Plex Sans',system-ui,sans-serif;fill:#17283a}.label{font:600 16px 'IBM Plex Sans',system-ui,sans-serif;fill:#24384d}.small{font:13px 'JetBrains Mono',ui-monospace,monospace;fill:#526273}.note{font:14px 'IBM Plex Sans',system-ui,sans-serif;fill:#526273}
    </style>
  </defs>
  <rect class="bg" width="960" height="470" rx="18"/>
  <text class="title" x="48" y="48">The same logits, four decoding views</text>
  <text class="note" x="48" y="76">Bars are illustrative probabilities for five candidate tokens.</text>

  <g transform="translate(48 108)">
    <rect class="panel" width="204" height="300" rx="12"/>
    <text class="label" x="18" y="32">Base distribution</text>
    <line class="axis" x1="22" y1="244" x2="182" y2="244"/>
    <rect class="bar" x="29" y="109" width="22" height="135" rx="3"/><rect class="bar" x="60" y="154" width="22" height="90" rx="3"/><rect class="bar" x="91" y="199" width="22" height="45" rx="3"/><rect class="bar" x="122" y="223" width="22" height="21" rx="3"/><rect class="bar" x="153" y="235" width="22" height="9" rx="3"/>
    <text class="small" x="29" y="266">A</text><text class="small" x="60" y="266">B</text><text class="small" x="91" y="266">C</text><text class="small" x="122" y="266">D</text><text class="small" x="153" y="266">E</text>
    <text class="note" x="18" y="289">Softmax at T = 1</text>
  </g>

  <g transform="translate(268 108)">
    <rect class="panel" width="204" height="300" rx="12"/>
    <text class="label" x="18" y="32">Lower temperature</text>
    <line class="axis" x1="22" y1="244" x2="182" y2="244"/>
    <rect class="accent" x="29" y="48" width="22" height="196" rx="3"/><rect class="bar" x="60" y="169" width="22" height="75" rx="3"/><rect class="bar" x="91" y="226" width="22" height="18" rx="3"/><rect class="bar" x="122" y="241" width="22" height="3" rx="3"/><rect class="bar" x="153" y="243" width="22" height="1" rx="3"/>
    <text class="small" x="29" y="266">A</text><text class="small" x="60" y="266">B</text><text class="small" x="91" y="266">C</text><text class="small" x="122" y="266">D</text><text class="small" x="153" y="266">E</text>
    <text class="note" x="18" y="289">Sharper; ordering unchanged</text>
  </g>

  <g transform="translate(488 108)">
    <rect class="panel" width="204" height="300" rx="12"/>
    <text class="label" x="18" y="32">Higher temperature</text>
    <line class="axis" x1="22" y1="244" x2="182" y2="244"/>
    <rect class="bar" x="29" y="154" width="22" height="90" rx="3"/><rect class="bar" x="60" y="169" width="22" height="75" rx="3"/><rect class="bar" x="91" y="184" width="22" height="60" rx="3"/><rect class="bar" x="122" y="199" width="22" height="45" rx="3"/><rect class="bar" x="153" y="214" width="22" height="30" rx="3"/>
    <text class="small" x="29" y="266">A</text><text class="small" x="60" y="266">B</text><text class="small" x="91" y="266">C</text><text class="small" x="122" y="266">D</text><text class="small" x="153" y="266">E</text>
    <text class="note" x="18" y="289">Flatter; tail gains mass</text>
  </g>

  <g transform="translate(708 108)">
    <rect class="panel" width="204" height="300" rx="12"/>
    <text class="label" x="18" y="32">Top-p = 0.80</text>
    <line class="axis" x1="22" y1="244" x2="182" y2="244"/>
    <rect class="accent" x="29" y="94" width="22" height="150" rx="3"/><rect class="accent" x="60" y="144" width="22" height="100" rx="3"/><rect class="accent" x="91" y="194" width="22" height="50" rx="3"/><rect class="muted" x="122" y="242" width="22" height="2" rx="1"/><rect class="muted" x="153" y="242" width="22" height="2" rx="1"/>
    <text class="small" x="29" y="266">A</text><text class="small" x="60" y="266">B</text><text class="small" x="91" y="266">C</text><text class="small" x="122" y="266">D</text><text class="small" x="153" y="266">E</text>
    <text class="note" x="18" y="289">Tail removed, then renormalized</text>
  </g>
  <text class="note" x="48" y="447">Temperature reshapes every probability; top-p chooses a surviving prefix. Greedy decoding does not sample; it selects argmax A.</text>
</svg>
