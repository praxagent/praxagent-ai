<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Rank versus best-rank across layers and positions</title>
  <desc id="desc">A grid of vocabulary ranks shows that best-rank is the minimum observed rank across all inspected layers and token positions.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.best{fill:#d6e8f5;stroke:#4b6787;stroke-width:3}.title{font:600 25px 'IBM Plex Sans',system-ui,sans-serif;fill:#17283a}.label{font:600 15px 'IBM Plex Sans',system-ui,sans-serif;fill:#24384d}.num{font:600 20px 'JetBrains Mono',ui-monospace,monospace;fill:#24384d}.note{font:14px 'IBM Plex Sans',system-ui,sans-serif;fill:#526273}.arrow{stroke:#d97706;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
  </defs>
  <rect class="bg" width="960" height="430" rx="18"/>
  <text class="title" x="48" y="48">Rank is local; best-rank searches the whole grid</text>
  <text class="note" x="48" y="76">Illustrative rank of one probe token. Lower numbers mean stronger vocabulary scores.</text>
  <text class="label" x="150" y="115">position 1</text><text class="label" x="305" y="115">position 2</text><text class="label" x="460" y="115">position 3</text>
  <text class="label" x="52" y="164">layer 10</text><text class="label" x="52" y="239">layer 20</text><text class="label" x="52" y="314">layer 30</text>
  <g transform="translate(135 132)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">1,420</text></g>
  <g transform="translate(290 132)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">880</text></g>
  <g transform="translate(445 132)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">2,106</text></g>
  <g transform="translate(135 207)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">311</text></g>
  <g transform="translate(290 207)"><rect class="best" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">12</text></g>
  <g transform="translate(445 207)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">97</text></g>
  <g transform="translate(135 282)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">45</text></g>
  <g transform="translate(290 282)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">23</text></g>
  <g transform="translate(445 282)"><rect class="cell" width="120" height="54" rx="8"/><text class="num" x="60" y="35" text-anchor="middle">56</text></g>
  <path class="arrow" d="M350 261 C470 276 610 276 684 171"/>
  <text class="label" x="690" y="150">best-rank = min(all cells)</text>
  <text class="num" x="690" y="190">= 12</text>
  <text class="note" x="690" y="225">Searching more layers and positions</text>
  <text class="note" x="690" y="247">creates more chances for an extreme.</text>
  <text class="note" x="48" y="392">That is why every fitted-lens result needs the same search applied to matched controls, logit lens, and random-J.</text>
</svg>
