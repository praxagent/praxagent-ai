<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410"
     viewBox="0 0 760 410" role="img"
     aria-labelledby="bestRankTitle bestRankDesc">
  <title id="bestRankTitle">Best-rank selects the smallest rank in a fixed search grid</title>
  <desc id="bestRankDesc">A qualitative grid has early, middle, and late layer rows and position A, B, and C columns. The middle-layer position-B cell is labeled smallest rank and is selected as best-rank.</desc>
  <rect width="760" height="410" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .cell{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.2}
    .neutral{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .best{fill:#F3E8E0;stroke:#A67C52;stroke-width:2.6}
  </style>

  <text x="24" y="28" class="t title">Best-rank keeps one cell from a pre-specified grid</text>
  <text x="24" y="48" class="t m">Qualitative illustration. Lower numerical rank is stronger; no measured values are shown.</text>

  <text x="156" y="88" text-anchor="middle" class="t h">position A</text>
  <text x="280" y="88" text-anchor="middle" class="t h">position B</text>
  <text x="404" y="88" text-anchor="middle" class="t h">position C</text>

  <text x="104" y="129" text-anchor="end" class="t h">early layer</text>
  <text x="104" y="193" text-anchor="end" class="t h">middle layer</text>
  <text x="104" y="257" text-anchor="end" class="t h">late layer</text>

  <rect x="112" y="102" width="112" height="48" rx="9" class="cell"/>
  <text x="168" y="131" text-anchor="middle" class="t s">weaker</text>
  <rect x="236" y="102" width="112" height="48" rx="9" class="cell"/>
  <text x="292" y="131" text-anchor="middle" class="t s">intermediate</text>
  <rect x="360" y="102" width="112" height="48" rx="9" class="cell"/>
  <text x="416" y="131" text-anchor="middle" class="t s">weaker</text>

  <rect x="112" y="166" width="112" height="48" rx="9" class="cell"/>
  <text x="168" y="195" text-anchor="middle" class="t s">intermediate</text>
  <rect x="236" y="166" width="112" height="48" rx="9" class="best"/>
  <text x="292" y="187" text-anchor="middle" class="t h">smallest rank</text>
  <text x="292" y="203" text-anchor="middle" class="t m">selected cell</text>
  <rect x="360" y="166" width="112" height="48" rx="9" class="cell"/>
  <text x="416" y="195" text-anchor="middle" class="t s">weaker</text>

  <rect x="112" y="230" width="112" height="48" rx="9" class="cell"/>
  <text x="168" y="259" text-anchor="middle" class="t s">weaker</text>
  <rect x="236" y="230" width="112" height="48" rx="9" class="cell"/>
  <text x="292" y="259" text-anchor="middle" class="t s">intermediate</text>
  <rect x="360" y="230" width="112" height="48" rx="9" class="cell"/>
  <text x="416" y="259" text-anchor="middle" class="t s">intermediate</text>

  <rect x="536" y="96" width="200" height="188" rx="12" class="neutral"/>
  <text x="554" y="123" class="t h">The reduction</text>
  <text x="554" y="150" class="t s">Inspect every allowed cell.</text>
  <text x="554" y="176" class="t s">Keep the minimum rank.</text>
  <text x="554" y="202" class="t h">Here that cell is:</text>
  <text x="554" y="226" class="t s">middle layer</text>
  <text x="554" y="246" class="t s">position B</text>
  <text x="554" y="270" class="t m">Other cells leave the summary.</text>

  <rect x="24" y="318" width="712" height="58" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.4"/>
  <text x="380" y="343" text-anchor="middle" class="t s">Matched controls must use the same layers, positions, variants, and selection rule.</text>
  <text x="380" y="361" text-anchor="middle" class="t m">Searching more cells creates more opportunities to find an extreme.</text>
</svg>
