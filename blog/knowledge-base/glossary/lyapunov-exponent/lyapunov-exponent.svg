<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="lyapTitle lyapDesc">
  <title id="lyapTitle">Nearby paths separate or fall together as the step advances</title>
  <desc id="lyapDesc">Two time plots with the step on the horizontal axis and the state on the vertical axis. On the left a neighbor starts a small gap above a reference path, and the gap doubles at each marked step: delta, 2 delta, 4 delta, 8 delta. On the right the neighbor starts farther away and the gap halves until the paths lie together. The curves are a schematic, not a measured orbit.</desc>
  <rect width="780" height="460" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .ink{stroke:#2C2924;stroke-width:1.3;fill:none}
    .ref{fill:none;stroke:#4B6787;stroke-width:2.6}
    .twin{fill:none;stroke:#A67C52;stroke-width:2.6}
  </style>
  <text x="24" y="28" class="t title">Nearby paths separate when the exponent is positive</text>
  <text x="24" y="48" class="t m">State against step. Brackets mark the gap in the formula. Schematic, not a measured orbit.</text>

