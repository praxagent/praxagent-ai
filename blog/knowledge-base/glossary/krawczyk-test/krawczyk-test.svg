<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="krawczykTitle krawczykDesc">
  <title id="krawczykTitle">Krawczyk's image sits strictly inside the trial box</title>
  <desc id="krawczykDesc">A number line from 1 to 2 is the trial box for x squared minus 2. The Krawczyk image is the shorter interval from 1.25 to about 1.583, drawn inside the trial box. Because the image is strictly inside, the box contains exactly one root.</desc>
  <rect width="760" height="340" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .foot{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.4}
  </style>
  <text x="24" y="30" class="t title">If the image sits inside the box, the root is there and is unique</text>
  <text x="24" y="50" class="t m">f(x) = x squared minus 2 on the trial box [1, 2]. Arithmetic, not a language-model orbit.</text>

  <rect class="card" x="24" y="70" width="712" height="160" rx="12"/>
  <text x="48" y="98" class="t h">trial box X = [1, 2]</text>
  <line x1="80" y1="150" x2="680" y2="150" stroke="#2C2924" stroke-width="1.4"/>
  <line x1="80" y1="140" x2="80" y2="160" stroke="#2C2924" stroke-width="1.4"/>
  <line x1="680" y1="140" x2="680" y2="160" stroke="#2C2924" stroke-width="1.4"/>
  <text x="80" y="178" text-anchor="middle" class="t s">1</text>
  <text x="680" y="178" text-anchor="middle" class="t s">2</text>
  <rect x="230" y="128" width="200" height="28" rx="6" fill="#F3E8E0" stroke="#A67C52" stroke-width="1.8"/>
  <text x="330" y="196" text-anchor="middle" class="t s">K(X) is about [1.25, 1.583]</text>
  <text x="330" y="214" text-anchor="middle" class="t m">strictly inside [1, 2]</text>

  <rect class="foot" x="24" y="248" width="712" height="68" rx="10"/>
  <text x="380" y="276" text-anchor="middle" class="t s">The shorter interval is the Krawczyk image of the trial box.</text>
  <text x="380" y="296" text-anchor="middle" class="t s">One root of x squared minus 2 lies in the trial box, and no other root does.</text>
</svg>
