<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="smTitle smDesc">
  <title id="smTitle">Starts on a saddle's stable manifold converge to the saddle; starts beside it come close, linger, and leave on their own side</title>
  <desc id="smDesc">Left: the plane of the toy map that sends (x, y) to (2x, y/2), with a saddle at the origin drawn as an open circle. The vertical axis, x = 0, is the stable manifold, with arrows pointing toward the saddle. The horizontal axis, y = 0, is the unstable manifold, with arrows pointing away from the saddle on both sides. A start at (1/16, 1) moves through (1/8, 1/2), (1/4, 1/4) and (1/2, 1/8) to (1, 1/16), numbered steps 0 to 4, along the dotted curve on which x times y stays 1/16: it comes closest to the saddle at step 2 and leaves to the right. The mirror start at (-1/16, 1) leaves to the left in the same way. Right: the step at which the absolute value of x first reaches 1, plotted against the natural logarithm of 1 over delta, for delta = 1/16, 1/256 and 1/4096: steps 4, 8 and 12, on a dashed line of slope 1/ln 2, about 1.44 steps per factor e. The values are those of the toy map, not measurements.</desc>
  <rect width="780" height="460" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .ink{stroke:#2C2924;stroke-width:1.3;fill:none}
  </style>
  <text x="24" y="28" class="t title">A saddle's stable manifold: starts on it converge, starts beside it linger and leave</text>
  <text x="24" y="48" class="t m">Toy map (x, y) to (2x, y/2): a saddle at the origin with multipliers 2 and 1/2. Exact toy-map values, not measurements.</text>
