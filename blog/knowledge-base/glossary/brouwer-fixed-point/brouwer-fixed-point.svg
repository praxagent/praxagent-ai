<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400"
     viewBox="0 0 760 400" role="img"
     aria-labelledby="brouwerTitle brouwerDesc">
  <title id="brouwerTitle">Brouwer's theorem in one dimension: the graph crosses the diagonal</title>
  <desc id="brouwerDesc">The map 0.3 plus 0.4 x sends 0 to 0.3 and 1 to 0.7, so the unit interval is mapped into itself. Its graph crosses the diagonal y = x at one half, and that input is a fixed point.</desc>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .row{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.2}
    .target{fill:#F3E8E0;stroke:#A67C52;stroke-width:2.2}
    .ok{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .bad{fill:#F8E8E6;stroke:#8C4A42;stroke-width:1.6}
    .line{fill:none;stroke:#A67C52;stroke-width:2.2}
    .blue{fill:none;stroke:#4B6787;stroke-width:2.2}
    .ink{stroke:#2C2924;stroke-width:1.4;fill:none}
  </style>
  <text x="24" y="32" class="t title">A continuous map of an interval into itself meets the diagonal</text>
  <text x="24" y="52" class="t m">F(x) = 0.3 + 0.4 x on [0, 1]. The image is [0.3, 0.7]. The fixed point is 1/2.</text>
  <line x1="80" y1="320" x2="680" y2="320" class="ink"/>
  <line x1="80" y1="320" x2="80" y2="80" class="ink"/>
  <text x="688" y="316" class="t m">x</text>
  <text x="88" y="88" class="t m">F</text>
  <path d="M80 320 L680 80" stroke="#C4B8A8" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M80 248 L680 152" class="line"/>
  <circle cx="380" cy="200" r="6" fill="#A67C52"/>
  <text x="396" y="192" class="t h">fixed point 1/2</text>
  <text x="80" y="348" class="t s">0</text>
  <text x="660" y="348" class="t s">1</text>
  <text x="200" y="360" class="t m">dashed: the line F(x) = x</text>

</svg>
