<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400"
     viewBox="0 0 760 400" role="img"
     aria-labelledby="ropeTitle ropeDesc">
  <title id="ropeTitle">Rotary embedding rotates a coordinate pair by the position index</title>
  <desc id="ropeDesc">At position 0 the pair (1, 0) is unchanged. At position 1, with frequency pi/2, that pair is rotated onto (0, 1). The angle depends only on the position slot.</desc>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .row{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.2}
    .target{fill:#F3E8E0;stroke:#A67C52;stroke-width:2.2}
    .ok{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .bad{fill:#F8E8E6;stroke:#8C4A42;stroke-width:1.6}
    .line{fill:none;stroke:#A67C52;stroke-width:2.2}
    .blue{fill:none;stroke:#4B6787;stroke-width:2.2}
    .ink{stroke:#2C2924;stroke-width:1.4;fill:none}
  </style>
  <text x="24" y="32" class="t title">A fixed position is a fixed rotation</text>
  <text x="24" y="52" class="t m">One coordinate pair, frequency pi/2. Position 0 does nothing. Position 1 rotates by a right angle.</text>
  <rect x="40" y="90" width="320" height="260" rx="12" class="card"/>
  <text x="200" y="118" text-anchor="middle" class="t h">Position 0</text>
  <line x1="90" y1="240" x2="320" y2="240" class="ink"/>
  <line x1="160" y1="140" x2="160" y2="310" class="ink"/>
  <path d="M160 240 H280" class="line"/>
  <circle cx="280" cy="240" r="5" fill="#A67C52"/>
  <text x="200" y="330" text-anchor="middle" class="t s">(1, 0) stays (1, 0)</text>
  <rect x="400" y="90" width="320" height="260" rx="12" class="card"/>
  <text x="560" y="118" text-anchor="middle" class="t h">Position 1</text>
  <line x1="450" y1="240" x2="680" y2="240" class="ink"/>
  <line x1="520" y1="140" x2="520" y2="310" class="ink"/>
  <path d="M520 240 V150" class="line"/>
  <circle cx="520" cy="150" r="5" fill="#A67C52"/>
  <text x="560" y="330" text-anchor="middle" class="t s">(1, 0) becomes (0, 1)</text>

</svg>
