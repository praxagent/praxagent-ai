<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400"
     viewBox="0 0 760 400" role="img"
     aria-labelledby="rmsTitle rmsDesc">
  <title id="rmsTitle">RMS normalization divides a vector by its root mean square</title>
  <desc id="rmsDesc">The toy vector with coordinates 3 and 4 has mean square 12.5 and root mean square about 3.536. Dividing gives about 0.849 and 1.131, drawn at the same scale as the original coordinates, so the normalized bars are shorter. Learned gains then rescale each coordinate separately.</desc>
  <rect width="760" height="400" fill="#F7F4F0"/>
  <style>
    .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
    .title{font-size:15px;font-weight:700}
    .h{font-size:13px;font-weight:700}
    .s{font-size:12px}
    .m{font-size:11px;fill:#5A544C}
    .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
    .row{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.2}
    .target{fill:#F3E8E0;stroke:#A67C52;stroke-width:2.2}
    .ok{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.6}
    .bad{fill:#F8E8E6;stroke:#8C4A42;stroke-width:1.6}
    .line{fill:none;stroke:#A67C52;stroke-width:2.2}
    .blue{fill:none;stroke:#4B6787;stroke-width:2.2}
    .ink{stroke:#2C2924;stroke-width:1.4;fill:none}
  </style>
  <text x="24" y="32" class="t title">Divide by the root mean square, then apply gains</text>
  <text x="24" y="52" class="t m">Toy vector (3, 4), epsilon 0, gains equal to 1, both panels at one scale. A positive epsilon prevents division by zero.</text>
  <rect x="28" y="84" width="210" height="230" rx="12" class="card"/>
  <text x="133" y="114" text-anchor="middle" class="t h">Before</text>
  <text x="70" y="160" class="t s">3</text>
  <rect x="100" y="148" width="90" height="16" rx="4" fill="#4B6787"/>
  <text x="70" y="210" class="t s">4</text>
  <rect x="100" y="198" width="120" height="16" rx="4" fill="#A67C52"/>
  <text x="133" y="270" text-anchor="middle" class="t m">mean square 12.5</text>
  <text x="268" y="200" text-anchor="middle" class="t h">divide</text>
  <text x="268" y="218" text-anchor="middle" class="t m">by 3.536</text>
  <rect x="340" y="84" width="390" height="230" rx="12" class="card"/>
  <text x="535" y="114" text-anchor="middle" class="t h">After, before a nonunit gain</text>
  <text x="370" y="160" class="t s">0.849</text>
  <rect x="430" y="148" width="25.5" height="16" rx="4" fill="#4B6787"/>
  <text x="370" y="210" class="t s">1.131</text>
  <rect x="430" y="198" width="33.9" height="16" rx="4" fill="#A67C52"/>
  <text x="535" y="270" text-anchor="middle" class="t m">same direction, unit root mean square</text>

</svg>
