<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="mean-pooling-title mean-pooling-desc">
  <title id="mean-pooling-title">Mean pooling averages included token states and excludes masked padding</title>
  <desc id="mean-pooling-desc">The token states two zero and zero two are included, while a padding state one hundred one hundred is excluded. Their coordinate-wise average is one one.</desc>
  <defs>
    <marker id="pool-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B6787"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#F7F4F0"/>
  <text x="450" y="42" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Average the states selected by the mask</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="44" y="80" width="210" height="82" rx="14" fill="#E8EEF4" stroke="#4B6787" stroke-width="2"/>
    <text x="64" y="108" fill="#2C2924" font-size="17" font-weight="700">token: root</text>
    <text x="64" y="136" fill="#2C2924" font-size="18">state (2, 0)</text>
    <text x="210" y="136" fill="#315A2E" font-size="15" font-weight="700">mask 1</text>
    <rect x="44" y="184" width="210" height="82" rx="14" fill="#E8F0E5" stroke="#6F8D5E" stroke-width="2"/>
    <text x="64" y="212" fill="#2C2924" font-size="17" font-weight="700">token: water</text>
    <text x="64" y="240" fill="#2C2924" font-size="18">state (0, 2)</text>
    <text x="210" y="240" fill="#315A2E" font-size="15" font-weight="700">mask 1</text>
    <rect x="44" y="288" width="210" height="82" rx="14" fill="#EAE4DC" stroke="#6B6259" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="64" y="316" fill="#2C2924" font-size="17" font-weight="700">padding</text>
    <text x="64" y="344" fill="#2C2924" font-size="18">state (100, 100)</text>
    <text x="200" y="344" fill="#7A3E2F" font-size="15" font-weight="700">mask 0</text>
    <line x1="52" y1="296" x2="246" y2="362" stroke="#7A3E2F" stroke-width="3"/>
  </g>

  <line x1="285" y1="121" x2="402" y2="171" stroke="#4B6787" stroke-width="3" marker-end="url(#pool-arrow)"/>
  <line x1="285" y1="225" x2="402" y2="207" stroke="#4B6787" stroke-width="3" marker-end="url(#pool-arrow)"/>
  <text x="344" y="119" text-anchor="middle" fill="#4B6787" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">include</text>
  <text x="344" y="255" text-anchor="middle" fill="#4B6787" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">include</text>
  <text x="342" y="329" text-anchor="middle" fill="#7A3E2F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">exclude</text>

  <rect x="420" y="125" width="210" height="150" rx="18" fill="#FFFDFC" stroke="#2C2924" stroke-width="2"/>
  <text x="525" y="159" text-anchor="middle" fill="#5A544C" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">COORDINATE-WISE MEAN</text>
  <text x="525" y="201" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="22">((2, 0) + (0, 2)) / 2</text>
  <text x="525" y="241" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">= (1, 1)</text>

  <line x1="650" y1="200" x2="725" y2="200" stroke="#4B6787" stroke-width="4" marker-end="url(#pool-arrow)"/>
  <rect x="748" y="138" width="118" height="124" rx="18" fill="#F2E7DC" stroke="#A67C52" stroke-width="3"/>
  <text x="807" y="175" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">POOLED</text>
  <text x="807" y="207" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="20">vector</text>
  <text x="807" y="239" text-anchor="middle" fill="#2C2924" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">(1, 1)</text>

  <rect x="332" y="322" width="534" height="52" rx="11" fill="#EAE4DC"/>
  <text x="599" y="344" text-anchor="middle" fill="#4A443D" font-family="Inter, Arial, sans-serif" font-size="15">Averaging is order-invariant.</text>
  <text x="599" y="365" text-anchor="middle" fill="#4A443D" font-family="Inter, Arial, sans-serif" font-size="15">Any context or order information must already be present in the token states.</text>
</svg>
