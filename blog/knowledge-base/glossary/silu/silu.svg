    .ink{stroke:#2C2924;stroke-width:1.4;fill:none}
  </style>
  <text x="24" y="32" class="t title">SiLU is smooth through zero</text>
  <text x="24" y="52" class="t m">Graph of x times the sigmoid of x. The cornered line is a rectified linear unit, drawn for contrast.</text>
