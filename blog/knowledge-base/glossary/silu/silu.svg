  <title id="siluTitle">The SiLU formula is smooth at zero</title>
  <desc id="siluDesc">The solid curve is x times the sigmoid of x. It passes through the origin, is about -0.269 at -1, and about 0.731 at 1. A dashed rectified linear unit is flat for negative x and has a corner at zero.</desc>
