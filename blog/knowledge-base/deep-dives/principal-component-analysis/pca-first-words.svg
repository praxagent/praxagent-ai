<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="pcaWordsTitle pcaWordsDesc">
  <title id="pcaWordsTitle">Variation and correlation before principal component analysis</title>
  <desc id="pcaWordsDesc">The left panel compares root-length values with the same mean but low or high variance. The right panel shows positive, negative, and near-zero linear correlation patterns.</desc>
  <defs>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:16px;font-weight:700}
      .h{font-size:13px;font-weight:700}
      .s{font-size:11px}
      .m{font-size:10px;fill:#5A544C}
      .panel{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
      .axis{stroke:#867F75;stroke-width:1.2}
      .mean{stroke:#A67C52;stroke-width:1.8;stroke-dasharray:5 4}
      .trend{stroke:#A67C52;stroke-width:2}
      .none{stroke:#867F75;stroke-width:1.4;stroke-dasharray:4 4}
      .point{fill:#4B6787;stroke:#F7F4F0;stroke-width:1.3}
      .focus{fill:#A67C52;stroke:#F7F4F0;stroke-width:1.3}
      .low{fill:#EAF1E5;stroke:#6F8D5E;stroke-width:1.2}
      .high{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.2}
    </style>
  </defs>
  <rect width="760" height="420" fill="#F7F4F0"/>
  <text x="24" y="31" class="t title">Variation and correlation answer different questions</text>
  <text x="24" y="51" class="t m">The same ideas apply to any numeric feature.</text>

  <rect x="24" y="76" width="342" height="298" rx="12" class="panel"/>
  <text x="44" y="103" class="t h">1. VARIANCE MEASURES SPREAD</text>
  <text x="44" y="123" class="t m">Both rows have an average root length of 27 millimeters.</text>
  <text x="44" y="160" class="t h">LOW VARIANCE</text>
  <rect x="44" y="174" width="302" height="62" rx="8" class="low"/>
  <line x1="64" y1="211" x2="326" y2="211" class="axis"/>
  <line x1="195" y1="179" x2="195" y2="230" class="mean"/>
  <circle cx="166" cy="211" r="6" class="point"/><circle cx="181" cy="211" r="6" class="point"/><circle cx="195" cy="211" r="7" class="focus"/><circle cx="210" cy="211" r="6" class="point"/><circle cx="224" cy="211" r="6" class="point"/>
  <text x="195" y="192" text-anchor="middle" class="t m">mean</text>
  <text x="44" y="260" class="t h">HIGH VARIANCE</text>
  <rect x="44" y="274" width="302" height="62" rx="8" class="high"/>
  <line x1="64" y1="311" x2="326" y2="311" class="axis"/>
  <line x1="195" y1="279" x2="195" y2="330" class="mean"/>
  <circle cx="64" cy="311" r="6" class="point"/><circle cx="122" cy="311" r="6" class="point"/><circle cx="195" cy="311" r="7" class="focus"/><circle cx="268" cy="311" r="6" class="point"/><circle cx="326" cy="311" r="6" class="point"/>
  <text x="195" y="292" text-anchor="middle" class="t m">same mean</text>
  <text x="44" y="356" class="t m">Farther distances from the mean produce larger variance.</text>

  <rect x="394" y="76" width="342" height="298" rx="12" class="panel"/>
  <text x="414" y="103" class="t h">2. CORRELATION CAN POINT THREE WAYS</text>
  <text x="414" y="123" class="t m">Direction and strength are separate ideas.</text>

  <text x="459" y="157" text-anchor="middle" class="t h">POSITIVE</text>
  <line x1="418" y1="252" x2="500" y2="252" class="axis"/><line x1="418" y1="252" x2="418" y2="174" class="axis"/>
  <line x1="428" y1="242" x2="491" y2="184" class="trend"/>
  <circle cx="430" cy="240" r="4.5" class="point"/><circle cx="445" cy="229" r="4.5" class="point"/><circle cx="460" cy="211" r="4.5" class="point"/><circle cx="476" cy="202" r="4.5" class="point"/><circle cx="490" cy="184" r="4.5" class="point"/>
  <text x="459" y="270" text-anchor="middle" class="t m">both tend to rise</text>

  <text x="565" y="157" text-anchor="middle" class="t h">NEGATIVE</text>
  <line x1="524" y1="252" x2="606" y2="252" class="axis"/><line x1="524" y1="252" x2="524" y2="174" class="axis"/>
  <line x1="534" y1="184" x2="597" y2="242" class="trend"/>
  <circle cx="536" cy="184" r="4.5" class="point"/><circle cx="551" cy="199" r="4.5" class="point"/><circle cx="566" cy="210" r="4.5" class="point"/><circle cx="582" cy="230" r="4.5" class="point"/><circle cx="596" cy="240" r="4.5" class="point"/>
  <text x="565" y="270" text-anchor="middle" class="t m">one rises, one falls</text>

  <text x="671" y="157" text-anchor="middle" class="t h">NEAR ZERO</text>
  <line x1="630" y1="252" x2="712" y2="252" class="axis"/><line x1="630" y1="252" x2="630" y2="174" class="axis"/>
  <line x1="640" y1="213" x2="703" y2="213" class="none"/>
  <circle cx="642" cy="187" r="4.5" class="point"/><circle cx="656" cy="235" r="4.5" class="point"/><circle cx="672" cy="205" r="4.5" class="point"/><circle cx="687" cy="226" r="4.5" class="point"/><circle cx="702" cy="194" r="4.5" class="point"/>
  <text x="671" y="270" text-anchor="middle" class="t m">no clear line</text>

  <text x="414" y="307" class="t s">Correlation can be strong or weak in either direction.</text>
  <text x="414" y="329" class="t s">Near zero means no clear linear relationship.</text>
  <text x="414" y="351" class="t s">None of these patterns, alone, establishes cause.</text>

  <text x="380" y="405" text-anchor="middle" class="t s">PCA finds successive linear directions that capture as much variation across the feature columns as possible.</text>
</svg>
