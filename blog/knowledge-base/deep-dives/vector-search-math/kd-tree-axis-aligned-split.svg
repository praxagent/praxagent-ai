<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="kd-split-title kd-split-desc">
  <title id="kd-split-title">A KD-tree cut is axis-aligned: first fix x, then fix y inside each side</title>
  <desc id="kd-split-desc">Two panels show the same eight toy points in the plane. The left panel draws one vertical cut at x equals 50, which partitions points into x less than 50 and x greater than or equal to 50 without restricting y. The right panel keeps that vertical cut and adds a horizontal cut inside each side: y equals 30 on the left and y equals 80 on the right. Points A and B fall below y equals 30; C and D fall above it. Points E and F fall below y equals 80; G and H fall above it. Those leaf groups match the KD-tree question diagram later on the page. Each later cut chooses a different coordinate and a local split value. The cuts stay parallel to the axes; they are not diagonal.</desc>
  <defs>
    <marker id="kdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A67C52"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:20px;font-weight:700}
      .h{font-size:14px;font-weight:700;letter-spacing:.2px}
      .s{font-size:12px}
      .m{font-size:11px;fill:#5A544C}
      .xs{font-size:11px;fill:#5A544C}
      .panel{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.4}
      .plot{fill:#F7F4F0;stroke:#DCD3C6;stroke-width:1}
      .axis{stroke:#7F786D;stroke-width:1.5}
      .xcut{stroke:#4B6787;stroke-width:2.6}
      .ycut{stroke:#5A7346;stroke-width:2.4;stroke-dasharray:7 4}
      .point{fill:#4B6787;stroke:#F7F4F0;stroke-width:1.4}
      .label{font-size:12px;font-weight:700;fill:#2C2924}
      .region{font-size:12px;font-weight:700;fill:#3C5570}
      .flow{fill:none;stroke:#A67C52;stroke-width:1.8;marker-end:url(#kdArrow)}
    </style>
  </defs>

  <rect width="1000" height="520" fill="#F7F4F0"/>
  <text class="t title" x="24" y="32">An axis-aligned cut fixes one coordinate</text>
  <text class="t m" x="24" y="54">In 2D that cut is a vertical or horizontal line. Later levels cycle to another coordinate and choose a local split value.</text>

  <!-- Left panel: root split on x -->
  <rect class="panel" x="24" y="72" width="440" height="400" rx="12"/>
  <text class="t h" x="44" y="98">1. ROOT SPLIT ON x</text>
  <text class="t m" x="44" y="118">Choose coordinate 0 and split value x = 50</text>

  <rect class="plot" x="64" y="140" width="360" height="280" rx="4"/>
  <line class="axis" x1="84" y1="400" x2="404" y2="400"/>
  <line class="axis" x1="84" y1="400" x2="84" y2="160"/>
  <text class="t xs" x="404" y="418" text-anchor="end">x</text>
  <text class="t xs" x="72" y="168" text-anchor="end">y</text>

  <!-- region washes; x=50 maps to 244 -->
  <rect x="84" y="160" width="160" height="240" fill="#E8F0F7" opacity="0.55"/>
  <rect x="244" y="160" width="160" height="240" fill="#EAF1E5" opacity="0.45"/>

  <line class="xcut" x1="244" y1="160" x2="244" y2="400"/>
  <text class="t s" x="244" y="152" text-anchor="middle" fill="#3C5570" font-weight="700">x = 50</text>
  <text class="t region" x="164" y="186" text-anchor="middle">x &lt; 50</text>
  <!-- Right-side label stays low so it does not collide with G/H. -->
  <text class="t region" x="356" y="388" text-anchor="middle" fill="#3F5A34">x &gt;= 50</text>

  <!-- Toy points chosen to match the tree figure leaves.
       Mapping: x' = 84 + 3.2x, y' = 400 - 2.4y for x,y in [0,100].
       A(20,15) B(35,25) C(25,55) D(40,75) E(65,30) F(80,60) G(70,90) H(90,85) -->
  <circle class="point" cx="148" cy="364" r="6"/><text class="t label" x="156" y="360">A</text>
  <circle class="point" cx="196" cy="340" r="6"/><text class="t label" x="204" y="336">B</text>
  <circle class="point" cx="164" cy="268" r="6"/><text class="t label" x="172" y="264">C</text>
  <circle class="point" cx="212" cy="220" r="6"/><text class="t label" x="220" y="216">D</text>
  <circle class="point" cx="292" cy="328" r="6"/><text class="t label" x="300" y="324">E</text>
  <circle class="point" cx="340" cy="256" r="6"/><text class="t label" x="348" y="252">F</text>
  <circle class="point" cx="308" cy="184" r="6"/><text class="t label" x="316" y="180">G</text>
  <circle class="point" cx="372" cy="196" r="6"/><text class="t label" x="380" y="192">H</text>

  <text class="t xs" x="244" y="448" text-anchor="middle">y is free on both sides of this cut</text>

  <text class="t xs" x="498" y="248" text-anchor="middle">next level</text>
  <path class="flow" d="M478 268 H518"/>

  <!-- Right panel: local y splits -->
  <rect class="panel" x="536" y="72" width="440" height="400" rx="12"/>
  <text class="t h" x="556" y="98">2. NEXT LEVEL SPLITS ON y</text>
  <text class="t m" x="556" y="118">Each side picks its own local y median</text>

  <rect class="plot" x="576" y="140" width="360" height="280" rx="4"/>
  <line class="axis" x1="596" y1="400" x2="916" y2="400"/>
  <line class="axis" x1="596" y1="400" x2="596" y2="160"/>
  <text class="t xs" x="916" y="418" text-anchor="end">x</text>
  <text class="t xs" x="584" y="168" text-anchor="end">y</text>

  <line class="xcut" x1="756" y1="160" x2="756" y2="400"/>
  <text class="t s" x="756" y="152" text-anchor="middle" fill="#3C5570" font-weight="700">x = 50</text>

  <!-- left y=30 -> 328; right y=80 -> 208 -->
  <line class="ycut" x1="596" y1="328" x2="756" y2="328"/>
  <text class="t s" x="676" y="320" text-anchor="middle" fill="#3F5A34" font-weight="700">y = 30</text>
  <line class="ycut" x1="756" y1="208" x2="916" y2="208"/>
  <text class="t s" x="836" y="200" text-anchor="middle" fill="#3F5A34" font-weight="700">y = 80</text>

  <circle class="point" cx="660" cy="364" r="6"/><text class="t label" x="668" y="360">A</text>
  <circle class="point" cx="708" cy="340" r="6"/><text class="t label" x="716" y="336">B</text>
  <circle class="point" cx="676" cy="268" r="6"/><text class="t label" x="684" y="264">C</text>
  <circle class="point" cx="724" cy="220" r="6"/><text class="t label" x="732" y="216">D</text>
  <circle class="point" cx="804" cy="328" r="6"/><text class="t label" x="812" y="324">E</text>
  <circle class="point" cx="852" cy="256" r="6"/><text class="t label" x="860" y="252">F</text>
  <circle class="point" cx="820" cy="184" r="6"/><text class="t label" x="828" y="180">G</text>
  <circle class="point" cx="884" cy="196" r="6"/><text class="t label" x="892" y="192">H</text>

  <text class="t xs" x="676" y="448" text-anchor="middle">A,B below; C,D above</text>
  <text class="t xs" x="836" y="448" text-anchor="middle">E,F below; G,H above</text>

  <text class="t s" x="500" y="500" text-anchor="middle">Cuts stay parallel to the axes. A diagonal divider would not be axis-aligned.</text>
</svg>
