<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="probability-threshold-title probability-threshold-desc">
  <title id="probability-threshold-title">A predicted probability and a probability cutoff answer different questions</title>
  <desc id="probability-threshold-desc">In logistic regression, a global log-odds score, meaning the logarithm of the odds between two classes, passes through an S-shaped sigmoid curve to become a predicted probability on a limited scale. A separate horizontal probability scale places one candidate below a chosen probability cutoff and another above it. The candidate below the cutoff is assigned to class A and the candidate at or above it to class B. Moving the cutoff changes class decisions without changing either candidate's predicted probability.</desc>
  <defs>
    <marker id="threshold-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6542"/>
    </marker>
    <pattern id="class-a-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E8F0F7"/>
      <circle cx="4" cy="4" r="1.2" fill="#8099B4"/>
    </pattern>
    <pattern id="class-b-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F3E8E0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D1B496" stroke-width="1.5"/>
    </pattern>
    <style>
      .t{font-family:Inter,Arial,Helvetica,sans-serif;fill:#2C2924}
      .title{font-size:24px;font-weight:700}
      .h{font-size:18px;font-weight:700}
      .s{font-size:15px}
      .m{font-size:13px;fill:#5A544C}
      .card{fill:#FBF9F6;stroke:#C4B8A8;stroke-width:1.5}
      .data{fill:#E8F0F7;stroke:#4B6787;stroke-width:1.5}
      .highlight{fill:#F3E8E0;stroke:#A67C52;stroke-width:1.5}
      .arrow{fill:none;stroke:#8B6542;stroke-width:2;marker-end:url(#threshold-arrow)}
    </style>
  </defs>

  <rect width="1000" height="560" fill="#F7F4F0"/>
  <text class="t title" x="24" y="34">A probability is not yet a decision</text>
  <text class="t m" x="24" y="58">The model estimates a probability; a separately chosen probability cutoff converts that estimate into a class.</text>

  <rect class="card" x="24" y="82" width="952" height="202" rx="12"/>
  <text class="t h" x="48" y="113">Logistic regression example: score first, probability second</text>
  <text class="t m" x="48" y="135">The sigmoid curve changes the scale, not the ordering of candidates.</text>

  <rect class="data" x="48" y="157" width="242" height="96" rx="10"/>
  <text class="t s" x="169" y="179" text-anchor="middle" font-weight="700">Global log-odds score</text>
  <text class="t m" x="169" y="198" text-anchor="middle">logarithm of class odds</text>
  <line x1="76" y1="218" x2="262" y2="218" stroke="#4B6787" stroke-width="2"/>
  <circle cx="118" cy="218" r="8" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <rect x="213" y="210" width="16" height="16" rx="2" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <text class="t m" x="76" y="244">lower score</text>
  <text class="t m" x="262" y="244" text-anchor="end">higher score</text>

  <path class="arrow" d="M290 205 H328"/>
  <rect class="highlight" x="330" y="157" width="270" height="96" rx="10"/>
  <path d="M354 231 C376 231 383 219 398 205 C413 191 420 179 456 179" fill="none" stroke="#4B6787" stroke-width="3"/>
  <line x1="354" y1="233" x2="462" y2="233" stroke="#A67C52" stroke-width="1.2"/>
  <line x1="354" y1="177" x2="354" y2="233" stroke="#A67C52" stroke-width="1.2"/>
  <text class="t s" x="525" y="185" text-anchor="middle" font-weight="700">S-shaped</text>
  <text class="t s" x="525" y="206" text-anchor="middle" font-weight="700">sigmoid curve</text>
  <text class="t m" x="525" y="228" text-anchor="middle">maps the score</text>
  <text class="t m" x="525" y="245" text-anchor="middle">to a probability</text>

  <path class="arrow" d="M600 205 H638"/>
  <rect class="data" x="640" y="157" width="312" height="96" rx="10"/>
  <text class="t s" x="796" y="181" text-anchor="middle" font-weight="700">Predicted probability</text>
  <line x1="672" y1="213" x2="920" y2="213" stroke="#4B6787" stroke-width="2"/>
  <circle cx="729" cy="213" r="8" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <rect x="855" y="205" width="16" height="16" rx="2" fill="#FBF9F6" stroke="#4B6787" stroke-width="2"/>
  <text class="t m" x="672" y="239">lower probability</text>
  <text class="t m" x="920" y="239" text-anchor="end">higher probability</text>

  <rect class="card" x="24" y="304" width="952" height="194" rx="12"/>
  <text class="t h" x="48" y="335">Either model: apply a probability cutoff only after estimating probability</text>
  <text class="t m" x="48" y="357">The cutoff reflects the cost of each kind of mistake and the decision goal.</text>

  <rect x="64" y="382" width="438" height="58" rx="8" fill="url(#class-a-pattern)" stroke="#4B6787" stroke-width="1.5"/>
  <rect x="502" y="382" width="434" height="58" rx="8" fill="url(#class-b-pattern)" stroke="#A67C52" stroke-width="1.5"/>
  <text class="t s" x="92" y="406" font-weight="700">Below the cutoff</text>
  <text class="t m" x="92" y="428">predict class A</text>
  <text class="t s" x="908" y="406" text-anchor="end" font-weight="700">At or above the cutoff</text>
  <text class="t m" x="908" y="428" text-anchor="end">predict class B</text>

  <line x1="502" y1="378" x2="502" y2="454" stroke="#2C2924" stroke-width="2.2" stroke-dasharray="6 4"/>
  <rect class="card" x="422" y="365" width="160" height="30" rx="7"/>
  <text class="t s" x="502" y="386" text-anchor="middle" font-weight="700">Probability cutoff</text>

  <circle cx="278" cy="411" r="10" fill="#FBF9F6" stroke="#2C2924" stroke-width="2"/>
  <line x1="278" y1="421" x2="278" y2="458" stroke="#2C2924" stroke-width="1.5"/>
  <text class="t m" x="278" y="476" text-anchor="middle">candidate below cutoff</text>

  <rect x="712" y="401" width="20" height="20" rx="3" fill="#FBF9F6" stroke="#2C2924" stroke-width="2"/>
  <line x1="722" y1="421" x2="722" y2="458" stroke="#2C2924" stroke-width="1.5"/>
  <text class="t m" x="722" y="476" text-anchor="middle">candidate above cutoff</text>

  <rect x="24" y="514" width="952" height="34" rx="10" fill="#EAF1E5" stroke="#6F8D5E" stroke-width="1.5"/>
  <text class="t s" x="500" y="537" text-anchor="middle" font-weight="700">Moving the cutoff changes class decisions, not the model's probability estimates.</text>
</svg>
